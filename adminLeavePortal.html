<div class="w-full glass-panel p-4 sm:p-6 rounded-3xl border border-slate-300 shadow-xl bg-white fade-in-up">

    <div class="border-b border-slate-200 pb-4 mb-6">
        <h3 class="text-lg font-black text-slate-900 flex items-center gap-2">
            <div class="w-5 h-5 bg-rose-100 text-rose-700 flex items-center justify-center group-hover:scale-100 transition-transform">
                <i data-lucide="shield" class="w-6 h-6"></i>
            </div>
            Admin Leave Approval Console
        </h3>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mt-1">View & Approve Pending Leaves, View Employee Leave History</p>
    </div>

    <!-- Navigation Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-300 pb-4 mb-6 gap-4">
        <div class="flex items-center gap-2 flex-wrap">
            <button id="adm-tab-pending-btn" onclick="window.switchAdminLeaveTab('pending')"
                class="px-4 py-2 bg-rose-700 text-white font-black text-xs rounded-xl shadow-md transition flex items-center gap-1.5 cursor-pointer">
                <i data-lucide="clock" class="w-4 h-4"></i> Pending Leave Approval Queue
            </button>
            <button id="adm-tab-history-btn" onclick="window.switchAdminLeaveTab('history')"
                class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-black text-xs rounded-xl border border-slate-300 transition flex items-center gap-1.5 cursor-pointer">
                <i data-lucide="archive" class="w-4 h-4"></i> Leave Application History
            </button>
        </div>
        <button onclick="window.syncAdminLeaveMasterData()"
            class="px-3 py-1.5 bg-slate-950 hover:bg-slate-900 text-white font-black text-xs rounded-xl shadow-sm transition flex items-center justify-center gap-1.5 cursor-pointer">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Sync Master Data
        </button>
    </div>

    <!-- Filter Engine -->
    <div id="admin-search-filter-card"
        class="hidden mb-6 p-4 bg-slate-50 border border-slate-300 rounded-2xl animate-fade-in">
        <span class="block text-[10px] uppercase text-slate-700 font-black tracking-wider mb-2">Multi-Combination Filter Engine</span>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs font-bold text-slate-800">
            <div>
                <label class="block text-[10px] text-slate-600 mb-1 font-black uppercase">Search Employee Name / ID</label>
                <input type="text" id="filter-search-term" oninput="window.executeAdminFilterQueryPipeline()"
                    placeholder="Enter name or ID match strings..."
                    class="w-full px-3 py-1.5 border border-slate-300 text-slate-900 rounded-lg bg-white">
            </div>
            <div>
                <label class="block text-[10px] text-slate-600 mb-1 font-black uppercase">Filter by Applied/Active Leave Date</label>
                <input type="date" id="filter-from-date" onchange="window.executeAdminFilterQueryPipeline()"
                    class="w-full px-3 py-1.5 border border-slate-300 text-slate-900 rounded-lg bg-white">
            </div>
            <div>
                <label class="block text-[10px] text-slate-600 mb-1 font-black uppercase">Filter Status State</label>
                <select id="filter-status-state" onchange="window.executeAdminFilterQueryPipeline()"
                    class="w-full px-3 py-1.5 border border-slate-300 text-slate-900 rounded-lg bg-white font-black">
                    <option value="ALL">Show All Historical Statuses</option>
                    <option value="APPROVED">APPROVED Only</option>
                    <option value="REJECTED">REJECTED Only</option>
                    <option value="MGR_REJECTED">MGR_REJECTED Only</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Data Table -->
    <div class="bg-white border border-slate-300 rounded-2xl shadow-inner p-3 sm:p-5">
        <div class="w-full max-h-[550px] overflow-y-auto">
            <table class="w-full text-left border-collapse table-auto block lg:table min-w-0 lg:min-w-[1250px]">
                <thead>
                    <tr class="bg-slate-950 text-white border-b border-slate-800 text-[10px] font-black uppercase tracking-wider hidden lg:table-row sticky top-0 z-10">
                        <th class="px-3 py-3.5 w-44">Applicant Identity</th>
                        <th class="px-3 py-3.5 w-64">Leave Scope Parameters</th>
                        <th class="px-3 py-3.5 w-48">Manager Recommendation</th>
                        <th class="px-3 py-3.5">Administrative Action Override</th>
                        <th class="px-3 py-3.5 text-center w-28">Action</th>
                    </tr>
                </thead>
                <tbody id="admin-leave-table-body" class="text-xs divide-y divide-slate-200 text-slate-900 font-bold block lg:table-row-group">
                    <tr class="block lg:table-row">
                        <td colspan="5" class="px-4 py-12 text-center text-slate-600 font-bold animate-pulse block lg:table-cell">Awaiting initialization arrays setup...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    (() => {
        let masterLeaveApplicationsCache = [];
        let activeSubPortalTabMode = "pending";

        window.formatToISODateInput = function (dateInput) {
            if (!dateInput) return "";
            let s = String(dateInput).trim().split(' ')[0];
            if (s.includes('T')) s = s.split('T')[0];
            let parts = s.includes('/') ? s.split('/') : s.split('-');
            if (parts.length === 3) {
                if (parts[0].length === 4) return `${parts[0]}-${parts[1]}-${parts[2]}`;
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return s;
        };

        window.cleanISOToDashFormat = function (dateStr) {
            if (!dateStr) return "";
            if (typeof dateStr === 'string' && dateStr.includes('T')) dateStr = dateStr.split('T')[0];
            let s = String(dateStr).trim().split(' ')[0];
            if (s.includes('/')) return s.replace(/\//g, '-');
            let parts = s.split('-');
            if (parts.length === 3 && parts[0].length === 4) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return s;
        };

        window.formatToIndianDateTimeStr = function (dateInput) {
            if (!dateInput) return "--";
            try {
                if (typeof dateInput === 'string' && dateInput.includes('/') && !dateInput.includes(' ')) return dateInput;
                let d = new Date(dateInput); if (isNaN(d.getTime())) return dateInput;
                const pad = (n) => String(n).padStart(2, '0');
                const day = pad(d.getDate()); const month = pad(d.getMonth() + 1); const year = d.getFullYear();
                if (d.getHours() === 0 && d.getMinutes() === 0 && d.getSeconds() === 0 && String(dateInput).length <= 10) return `${day}/${month}/${year}`;
                return `${day}/${month}/${year} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            } catch (e) { return dateInput; }
        };

        window.switchAdminLeaveTab = function (targetMode) {
            activeSubPortalTabMode = targetMode;

            const pendingBtn = document.getElementById("adm-tab-pending-btn");
            const historyBtn = document.getElementById("adm-tab-history-btn");
            const filterCard = document.getElementById("admin-search-filter-card");

            [pendingBtn, historyBtn].forEach(b => {
                b.className = "px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-black text-xs rounded-xl border border-slate-300 transition flex items-center gap-1.5 cursor-pointer";
            });

            if (targetMode === "pending") {
                pendingBtn.className = "px-4 py-2 bg-rose-700 text-white font-black text-xs rounded-xl shadow-md transition flex items-center gap-1.5 cursor-pointer";
                filterCard.classList.add("hidden");
            } else {
                historyBtn.className = "px-4 py-2 bg-rose-700 text-white font-black text-xs rounded-xl shadow-md transition flex items-center gap-1.5 cursor-pointer";
                filterCard.classList.remove("hidden");
            }

            window.executeAdminFilterQueryPipeline();
            if (window.lucide) window.lucide.createIcons();
        };
        
        window.syncAdminLeaveMasterData = async function () {
            const tbody = document.getElementById("admin-leave-table-body");
            tbody.innerHTML = `<tr class="block lg:table-row"><td colspan="5" class="px-4 py-12 text-center text-slate-700 font-bold block lg:table-cell">Synchronizing Admin L3 leave ledger tracks...</td></tr>`;
            try {
                // 🎯 FIXED: Simultaneously fetch Master Registry to cross-reference Manager Names
                const [leaveRes, empRes] = await Promise.all([
                    fetch(`${API_URL}?action=getAdminLeaveDataBundles`),
                    fetch(`${API_URL}?action=getAllEmployeesMasterRegistry`)
                ]);
                
                const leaveData = await leaveRes.json();
                const empData = await empRes.json();

                if (leaveData.status) { 
                    let leaves = leaveData.data;
                    let employees = empData.status ? empData.data : [];

                    // Map missing Manager Names from the Master Registry
                    leaves.forEach(lv => {
                        if (lv.managerId && (!lv.managerName || lv.managerName === "N/A")) {
                            let mgr = employees.find(e => String(e.employeeId).trim().toUpperCase() === String(lv.managerId).trim().toUpperCase());
                            if (mgr) lv.managerName = mgr.employeeName;
                        }
                    });

                    masterLeaveApplicationsCache = leaves; 
                    window.executeAdminFilterQueryPipeline(); 
                }
            } catch (e) { 
                tbody.innerHTML = `<tr class="block lg:table-row"><td colspan="5" class="px-4 py-6 text-center text-rose-700 font-black block lg:table-cell">Server error. Check connection.</td></tr>`; 
            }
        };

        window.calculateAdminApprovedShortLeaveDaysDelta = function (idx) {
            const fVal = document.getElementById(`adm_rec_from_${idx}`).value;
            const tVal = document.getElementById(`adm_rec_to_${idx}`).value;
            const lbl = document.getElementById(`adm_rec_days_lbl_${idx}`);
            if (!fVal || !tVal) { lbl.innerText = "0 Days"; return 0; }

            const calculatedDays = Math.ceil((new Date(tVal) - new Date(fVal)) / (1000 * 60 * 60 * 24)) + 1;
            lbl.innerText = `${calculatedDays > 0 ? calculatedDays : 0} Day(s)`;
            return calculatedDays > 0 ? calculatedDays : 0;
        };

        window.executeAdminFilterQueryPipeline = function () {
            const tbody = document.getElementById("admin-leave-table-body");

            let dataset = [];
            if (activeSubPortalTabMode === "pending") {
                dataset = masterLeaveApplicationsCache.filter(item => item.status === "PENDING" || item.status === "MGR_RECOMMENDED");
            } else {
                dataset = masterLeaveApplicationsCache.filter(item => item.status !== "PENDING" && item.status !== "MGR_RECOMMENDED");
            }

            if (activeSubPortalTabMode === "history") {
                const term = document.getElementById("filter-search-term").value.trim().toLowerCase();
                const rawDateVal = document.getElementById("filter-from-date").value;
                const statusState = document.getElementById("filter-status-state").value;
                
                let safeQueryDate = "";
                let queryTimestamp = null;

                if (rawDateVal) {
                    const dateParts = rawDateVal.split('-');
                    safeQueryDate = `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`; 
                    queryTimestamp = new Date(dateParts[0], parseInt(dateParts[1]) - 1, dateParts[2]).getTime();
                }

                if (term) dataset = dataset.filter(i => String(i.employeeName).toLowerCase().includes(term) || String(i.employeeId).toLowerCase().includes(term));
                if (statusState !== "ALL") dataset = dataset.filter(i => i.status === statusState);
                
                if (safeQueryDate && queryTimestamp) {
                    dataset = dataset.filter(i => {
                        let isAppliedMatch = i.appliedOn && i.appliedOn.includes(safeQueryDate);
                        let isInsideDuration = false;

                        if (i.fromDate && i.toDate) {
                            const fParts = String(i.fromDate).split('-');
                            const tParts = String(i.toDate).split('-');
                            if (fParts.length === 3 && tParts.length === 3) {
                                const startT = new Date(fParts[2], parseInt(fParts[1]) - 1, fParts[0]).getTime();
                                const endT = new Date(tParts[2], parseInt(tParts[1]) - 1, tParts[0]).getTime();
                                if (queryTimestamp >= startT && queryTimestamp <= endT) {
                                    isInsideDuration = true;
                                }
                            }
                        }
                        return isInsideDuration || isAppliedMatch || i.fromDate === safeQueryDate;
                    });
                }
            }

            if (dataset.length === 0) { tbody.innerHTML = `<tr class="block lg:table-row"><td colspan="5" class="px-4 py-12 text-center text-slate-600 italic block lg:table-cell">No leaves found.</td></tr>`; return; }

            let outputHtml = "";
            dataset.forEach((item, idx) => {
                const docLink = item.attachmentUrl && item.attachmentUrl.trim() !== "" ? `<a href="${item.attachmentUrl}" target="_blank" class="text-blue-700 underline inline-block mt-2 text-[11px] font-black"><i data-lucide="eye" class="w-3 h-3 inline"></i> View Attachment</a>` : '<span class="text-slate-500 font-black inline-block mt-2 text-[10px] uppercase tracking-wider">No Attachment</span>';
                let actionInteractiveForm = "", actionDispatchButton = "";

                if (activeSubPortalTabMode === "pending") {
                    const parsedIsoFrom = window.formatToISODateInput(item.fromDate);
                    const parsedIsoTo = window.formatToISODateInput(item.toDate);

                    actionInteractiveForm = `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="space-y-2">
                                <div>
                                    <label class="block text-[9px] uppercase text-slate-600 font-black mb-0.5">Admin Action Final Decision</label>
                                    <select id="adm_decision_${idx}" onchange="document.getElementById('adm_short_days_container_${idx}').classList.toggle('hidden', this.value !== 'SHORT'); window.calculateAdminApprovedShortLeaveDaysDelta(${idx});" class="w-full px-2 py-1 border border-slate-300 bg-white rounded-lg font-black text-xs text-slate-900">
                                        <option value="APPROVE">Approve as Recommended</option>
                                        <option value="SHORT">Approve Short Leave</option>
                                        <option value="REJECT">Reject Leave Application</option>
                                    </select>
                                </div>
                                <div id="adm_short_days_container_${idx}" class="hidden p-2 bg-white border border-slate-300 rounded-xl space-y-1.5 shadow-inner">
                                    <div><label class="block text-[9px] uppercase text-slate-600 font-black">Final Approved From</label><input type="date" id="adm_rec_from_${idx}" value="${parsedIsoFrom}" onchange="window.calculateAdminApprovedShortLeaveDaysDelta(${idx})" class="w-full px-2 py-0.5 border border-slate-300 bg-white rounded text-xs text-slate-900"></div>
                                    <div><label class="block text-[9px] uppercase text-slate-600 font-black">Final Approved To</label><input type="date" id="adm_rec_to_${idx}" value="${parsedIsoTo}" onchange="window.calculateAdminApprovedShortLeaveDaysDelta(${idx})" class="w-full px-2 py-0.5 border border-slate-300 bg-white rounded text-xs text-slate-900"></div>
                                    <div class="text-[10px] text-slate-800 font-black pt-0.5 flex justify-between"><span>Final Approved:</span> <span id="adm_rec_days_lbl_${idx}" class="font-mono text-rose-700">${item.leaveDays} Days</span></div>
                                </div>
                            </div>
                            <div><label class="block text-[9px] uppercase text-slate-600 font-black mb-0.5">Admin Remarks</label><textarea id="adm_remark_${idx}" rows="3" placeholder="Provide administrative closure statements..." class="w-full px-2 py-1 border border-slate-300 bg-white font-medium rounded-lg text-xs text-slate-900 focus:ring-1 focus:ring-rose-600"></textarea></div>
                        </div>
                    `;
                    actionDispatchButton = `<button onclick="window.commitAdminFinalDecisionSingleRow(${item.rowIndex}, ${idx}, '${item.applicationId}', '${item.employeeId}', '${item.employeeName}')" class="w-full lg:w-auto px-4 py-2 bg-rose-700 hover:bg-rose-800 text-white font-black text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5 cursor-pointer"><i data-lucide="shield-check" class="w-4 h-4"></i> Commit Final Status</button>`;
                } else {
                    actionInteractiveForm = `
                        <div class="grid grid-cols-2 gap-2 leading-normal text-slate-800 text-[11px] font-medium">
                            <div>Admin Decision: <strong class="text-slate-950 font-black text-xs uppercase">${item.adminDecision || 'APPROVE'}</strong></div>
                            <div>Final Days: <strong class="text-rose-700 font-mono font-black">${item.finalApprovedDays || '0'} Day(s)</strong></div>
                            <div class="col-span-2">Approved Block: <strong class="text-rose-700 font-mono">${item.adminApprovedDate || '--'}</strong></div>
                            
                            <!-- 🎯 FIXED: Display Admin Name prominently -->
                            <div class="col-span-2 pt-1">Processed By Admin: <span class="bg-indigo-50 border border-indigo-300 text-indigo-900 font-black px-1.5 py-0.5 rounded">${item.adminName || 'System Admin'}</span></div>
                            
                            <div class="col-span-2 border-t border-slate-200 pt-1">Admin Remark: <span class="text-slate-950 font-bold">"${item.adminRemark || ''}"</span></div>
                            <div class="col-span-2 text-slate-500 font-mono text-[9px]">Processed On: ${window.formatToIndianDateTimeStr(item.adminTimestamp)}</div>
                        </div>
                    `;

                    let statusColorBadge = "bg-slate-100 text-slate-900 border-slate-300";
                    if (item.status === "APPROVED") statusColorBadge = "bg-emerald-100 text-emerald-950 border-emerald-400";
                    else if (item.status === "REJECTED") statusColorBadge = "bg-rose-100 text-rose-950 border-rose-400";

                    actionDispatchButton = `<div class="mt-1"><span class="border px-2 py-0.5 rounded text-[10px] font-black tracking-wider uppercase ${statusColorBadge}">${item.status}</span></div>`;
                }

                outputHtml += `
                    <tr class="block lg:table-row hover:bg-slate-50/60 transition-colors p-4 mb-4 bg-slate-50 border border-slate-300 lg:border-none rounded-2xl shadow-sm lg:shadow-none">
                        <td class="block lg:table-cell px-0 lg:px-3 py-2 lg:py-3.5 align-top border-b border-slate-200 lg:border-none pb-2 lg:pb-0">
                            <strong class="text-slate-950 block font-black text-xs">${item.employeeName}</strong>
                            <span class="font-mono text-[11px] text-slate-600 block">ID: ${item.employeeId}</span>
                            <span class="text-[10px] text-slate-600 block mt-0.5 font-bold font-mono">Token: ${item.applicationId}</span>
                            <div class="mt-2 text-[10px] text-slate-700 bg-slate-100 border border-slate-200 px-2 py-1 rounded leading-tight">
                                <span class="font-bold text-slate-500">Proj:</span> ${item.project || 'N/A'}<br>
                                <span class="font-bold text-slate-500">Loc:</span> ${item.location || 'N/A'}
                            </div>
                        </td>
                        <td class="block lg:table-cell px-0 lg:px-3 py-2 lg:py-3.5 align-top border-b border-slate-200 lg:border-none pb-2 lg:pb-0">
                            <span class="inline-block bg-slate-200 border border-slate-300 text-slate-900 rounded px-1.5 py-0.5 text-[10px] font-black">${item.leaveType}</span>
                            <div class="text-slate-950 font-mono mt-1">${window.cleanISOToDashFormat(item.fromDate)} to ${window.cleanISOToDashFormat(item.toDate)}</div>
                            <span class="text-[11px] text-slate-700 block mb-1.5">Delta: <strong>${item.leaveDays} Day(s)</strong> | Filed: ${window.formatToIndianDateTimeStr(item.appliedOn)}</span>
                            
                            <!-- 🎯 FIXED: Fully Scrollable & Wrap-friendly Reason Box -->
                            <div class="text-slate-700 italic text-[11px] bg-white p-2.5 rounded-lg border border-slate-300 whitespace-pre-wrap max-h-40 overflow-y-auto leading-relaxed shadow-inner" title="Reason">
                                <span class="font-black text-slate-400 not-italic uppercase tracking-wider text-[9px] block mb-1">Reason Stated</span>
                                "${item.reason || 'No reason provided'}"
                            </div>
                            
                            ${docLink}
                        </td>
                        <td class="block lg:table-cell px-0 lg:px-3 py-2 lg:py-3.5 align-top border-b border-slate-200 lg:border-none pb-2 lg:pb-0">
                            
                            <!-- 🎯 FIXED: Display Manager Name prominently -->
                            <div class="text-slate-950 text-[11px] mb-2 bg-emerald-50 border border-emerald-200 p-1.5 rounded">
                                <span class="font-bold text-emerald-800 text-[9px] uppercase block mb-0.5">Assigned Manager:</span>
                                <span class="font-black">${item.managerName || 'Pending / N/A'}</span> 
                                <span class="text-slate-500 font-mono text-[9px]">(${item.managerId || 'N/A'})</span>
                            </div>

                            <div class="mt-1">Rec Path: <span class="text-emerald-700 font-black uppercase text-[11px]">${item.managerRec}</span></div>
                            <div class="text-slate-700 text-[10px] mt-0.5 font-bold leading-tight">
                                <div>Rec Days: <strong class="text-slate-950 font-mono">${item.managerDays}</strong></div>
                                <div class="truncate max-w-[180px]">Dates: ${item.managerDates}</div>
                                <div class="text-slate-600 italic mt-0.5 max-w-[180px] truncate" title="${item.managerRemark}">Note: "${item.managerRemark}"</div>
                                <div class="text-indigo-600 font-mono mt-1 text-[9px] border-t border-slate-200 pt-1">Rec. On: ${window.formatToIndianDateTimeStr(item.managerTimestamp)}</div>
                            </div>
                        </td>
                        <td class="block lg:table-cell px-0 lg:px-3 py-3 lg:py-3.5 align-top border-b border-slate-200 lg:border-none pb-3 lg:pb-0">${actionInteractiveForm}</td>
                        <td class="block lg:table-cell px-0 lg:px-3 py-3 lg:py-3.5 text-center lg:align-middle whitespace-nowrap">${actionDispatchButton}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = outputHtml; 
            if (window.lucide) window.lucide.createIcons();
        };

        window.commitAdminFinalDecisionSingleRow = async function (rowSheetIndex, idx, appId, empId, empName) {
            const decisionType = document.getElementById(`adm_decision_${idx}`).value;
            const remarkText = document.getElementById(`adm_remark_${idx}`).value.trim();
            if (!remarkText) { alert("Validation Mismatch: Admin comments are required."); return; }

            let targetStatus = "APPROVED";
            let cacheItem = masterLeaveApplicationsCache.find(i => i.applicationId === appId);
            
            let approvedDays = (decisionType === "APPROVE") ? cacheItem.managerDays : cacheItem.leaveDays;
            let adminApprovedDateString = (decisionType === "APPROVE") ? cacheItem.managerDates : `${window.cleanISOToDashFormat(cacheItem.fromDate)} to ${window.cleanISOToDashFormat(cacheItem.toDate)}`;
            
            let descriptiveLabelText = `APPROVE AS RECOMMENDED (${approvedDays} Approved Days: ${adminApprovedDateString})`;

            if (decisionType === "REJECT") {
                targetStatus = "REJECTED"; 
                approvedDays = 0; 
                adminApprovedDateString = "Rejected / Cancelled";
                descriptiveLabelText = `COMPLETE REJECTION / DISMISSAL (0 Days)`;
            } else if (decisionType === "SHORT") {
                approvedDays = window.calculateAdminApprovedShortLeaveDaysDelta(idx);
                const fromDateInput = document.getElementById(`adm_rec_from_${idx}`).value;
                const toDateInput = document.getElementById(`adm_rec_to_${idx}`).value;
                if (approvedDays <= 0 || isNaN(approvedDays)) { alert("Validation Mismatch: Short Leave approved dates mapping error."); return; }

                adminApprovedDateString = `${window.cleanISOToDashFormat(fromDateInput)} to ${window.cleanISOToDashFormat(toDateInput)}`;
                descriptiveLabelText = `OVERRIDE SHORT LEAVE APPROVAL (${approvedDays} Final Approved Days: ${adminApprovedDateString})`;
            }
            
            if (!confirm(`MASTER ADMINISTRATIVE OVERRIDE CLEARANCE\n\nApplicant: ${empName}\nDecision: ${descriptiveLabelText}\nRemarks: "${remarkText}"\n\nCommit this closure state?`)) return;

            const payload = { action: "processAdminLeaveApprovalDecision", rowIndex: rowSheetIndex, applicationId: appId, employeeId: empId, status: targetStatus, adminDecision: decisionType, finalApprovedDays: approvedDays, adminRemark: remarkText, adminName: currentUser.employeeName, adminApprovedDateString: adminApprovedDateString };
            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                if ((await res.json()).status) { alert("Administrative transaction committed successfully!"); window.syncAdminLeaveMasterData(); }
            } catch (e) { alert("Pipeline dropped out."); }
        };

        // SAFETY INIT
        setTimeout(() => {
            if (document.getElementById("admin-leave-table-body")) {
                window.syncAdminLeaveMasterData();
            }
        }, 50);

    })();
</script>
