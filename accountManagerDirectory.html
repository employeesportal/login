<div class="w-full glass-panel p-6 rounded-3xl border border-slate-300 shadow-xl bg-white fade-in-up">

    <!-- DASHBOARD PANEL HEADER CONTROL BAR -->
    <div class="border-b border-slate-300 pb-4 mb-6 gap-4">

        <div>
            <h3 class="text-lg font-black tracking-tight text-slate-950 flex items-center gap-2">
                <i data-lucide="users" class="text-sky-600 w-5 h-5"></i> Accounts Employee Directory
            </h3>
            <p class="text-[11px] font-black text-slate-700 uppercase tracking-wider mt-0.5">
                Read-Only Employee Registry Viewer
            </p>
        </div>

        <br>
        <div class="flex items-center gap-3 flex-wrap">
            <div class="relative min-w-[300px] flex-1 max-w-md">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-600">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </span>
                <input type="text" id="acc-search-input" oninput="window.handleAccRegistrySearchFilter()"
                    placeholder="Search employees by name or ID..."
                    class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-300 text-xs font-bold rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-600 focus:bg-white text-slate-900 transition shadow-inner">
            </div>

            <button onclick="window.refreshAccConsoleData()"
                class="px-4 py-2 bg-slate-950 hover:bg-slate-900 text-white font-black text-xs rounded-xl shadow-sm transition flex items-center gap-1.5 cursor-pointer">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Directory
            </button>
        </div>
    </div>

    <!-- MAIN INTERACTIVE IAM PROVISIONING GRID TABLE -->
    <div class="bg-white border border-slate-300 rounded-2xl shadow-inner p-5">
        <div class="overflow-x-auto w-full border border-slate-200 rounded-xl max-h-[600px]">
            <table class="w-full text-left border-collapse table-auto min-w-[1000px]">
                <thead>
                    <tr class="bg-slate-950 text-white border-b border-slate-800 text-[10px] font-black uppercase tracking-wider sticky top-0 z-20">
                        <th class="px-3 py-3.5 w-20 text-center">Profile</th>
                        <th class="px-3 py-3.5">Identity (Name & ID)</th>
                        <th class="px-3 py-3.5 w-48">Designation</th>
                        <th class="px-3 py-3.5 w-56">Appointed Projects</th>
                        <th class="px-3 py-3.5">Supervisory Line Allocations</th>
                        <th class="px-3 py-3.5 w-44">Education Attributes</th>
                    </tr>
                </thead>
                <tbody id="acc-matrix-table-body" class="text-xs divide-y divide-slate-200 text-slate-900">
                    <tr>
                        <td colspan="6" class="px-4 py-12 text-center text-slate-600 font-bold animate-pulse">
                            Loading employee directory...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Image Preview Modal -->
<div id="image-preview-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 p-4">
    <div class="bg-white p-2 rounded-2xl shadow-2xl max-w-sm w-full">
        <img id="full-profile-img" src="" class="w-full h-auto rounded-xl" alt="Profile">
        <button onclick="document.getElementById('image-preview-modal').classList.add('hidden')"
            class="mt-3 w-full py-2 bg-slate-900 text-white font-black text-xs rounded-xl">Close Preview</button>
    </div>
</div>

<script>
    (() => {
        let employeeRegistryCache = [];

        window.refreshAccConsoleData = async function () {
            const tbody = document.getElementById("acc-matrix-table-body");
            tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-12 text-center text-slate-700 font-bold">Synchronizing directory...</td></tr>`;
            document.getElementById("acc-search-input").value = "";

            try {
                // We use the existing API endpoint that retrieves all employees
                const regRes = await fetch(`${API_URL}?action=getAllEmployeesMasterRegistry`);
                const regResult = await regRes.json();
                
                if (!regResult.status) { 
                    tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-6 text-rose-700 font-black text-center">Sync rejected by database.</td></tr>`; 
                    return; 
                }

                employeeRegistryCache = regResult.data;
                window.renderAccRegistryGridRows(employeeRegistryCache);
            } catch (e) { 
                tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-6 text-center text-rose-700 font-black">Governance stack sync crash.</td></tr>`; 
            }
        };

        window.renderAccRegistryGridRows = function (dataArray) {
            const tbody = document.getElementById("acc-matrix-table-body");
            const currentYear = new Date().getFullYear();

            if(dataArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-slate-500 font-bold">No employees match your search.</td></tr>`;
                return;
            }

            let outputRows = "";
            dataArray.forEach((emp) => {
                let dojParts = String(emp.dateOfJoining || "").split("-");
                let displayDoj = (dojParts.length === 3) ? `${dojParts[2]}/${dojParts[1]}/${dojParts[0]}` : (emp.dateOfJoining || "N/A");

                const yop = parseInt(emp.yearOfPassing);
                const experience = (yop && !isNaN(yop)) ? (currentYear - yop) + " yrs" : "N/A";

                outputRows += `
                <tr class="hover:bg-slate-100/80 transition-colors">
                    <td class="px-3 py-3.5 text-center">
                        <img src="${emp.profilePhoto || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cmVjdCB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIGZpbGw9IiNjY2MiLz48L3N2Zz4='}" 
                             onclick="window.showImageByEmpId('${emp.employeeId}')"
                             class="w-10 h-10 min-w-[40px] rounded-full border-2 border-slate-200 cursor-pointer object-cover shadow-sm hover:scale-110 transition-transform mx-auto" 
                             alt="Profile">
                    </td>
                    <td class="px-3 py-3.5">
                        <strong class="text-slate-950 block font-black text-xs">${emp.employeeName}</strong>
                        <span class="font-mono text-[11px] text-slate-700 block font-bold mt-0.5">${emp.employeeId}</span>
                        <span class="text-[10px] text-slate-500 block mt-0.5 font-bold">DOJ: ${displayDoj}</span>
                    </td>
                    <td class="px-3 py-3.5">
                        <span class="block text-slate-900 font-black text-xs">${emp.designation || 'Not Configured'}</span>
                    </td>
                    <td class="px-3 py-3.5 max-w-xs text-slate-800 font-bold leading-relaxed">
                        ${emp.appointedProjects || '<span class="italic text-slate-400 font-medium">Unassigned Workspace</span>'}
                    </td>
                    <td class="px-3 py-3.5 text-[11px] font-bold leading-tight text-slate-800">
                        <div>Mgr: <strong class="font-black text-slate-950">${emp.managerName || 'None'}</strong></div>
                        <div class="mt-1">Coord: <strong class="font-black text-slate-900">${emp.coordinatorName || 'None'}</strong></div>
                    </td>
                    <td class="px-3 py-3.5 leading-normal">
                        <div class="text-slate-900 font-black text-xs">${emp.qualification || 'N/A'}</div>
                        <div class="text-[10px] font-bold text-slate-600 mt-0.5">Pass: ${emp.yearOfPassing || '--'}</div>
                        <div class="text-[10px] font-black text-sky-700 mt-0.5">Exp: ${experience}</div>
                    </td>
                </tr>
            `;
            });
            tbody.innerHTML = outputRows;
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        };

        window.showImageByEmpId = function (empId) {
            const emp = employeeRegistryCache.find(e => String(e.employeeId) === String(empId));
            const modal = document.getElementById('image-preview-modal');
            const modalImg = document.getElementById('full-profile-img');

            if (emp && emp.profilePhoto) {
                modalImg.src = emp.profilePhoto;
                modal.classList.remove('hidden');
            }
        };

        window.handleAccRegistrySearchFilter = function () {
            const query = document.getElementById("acc-search-input").value.trim().toLowerCase();
            if (!query) {
                window.renderAccRegistryGridRows(employeeRegistryCache);
                return;
            }
            
            const filtered = employeeRegistryCache.filter(emp =>
                String(emp.employeeName).toLowerCase().includes(query) || 
                String(emp.employeeId).toLowerCase().includes(query)
            );
            window.renderAccRegistryGridRows(filtered);
        };

        // Initialize Data on Load
        window.refreshAccConsoleData();
    })();
</script>
