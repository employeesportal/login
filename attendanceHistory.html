<div class="w-full glass-panel p-4 sm:p-6 rounded-3xl border border-slate-200 shadow-xl fade-in-up">

    <div class="flex items-center justify-between border-b border-slate-200 pb-4 mb-5">
        <div>
            <h3 class="text-base sm:text-lg font-black tracking-tight text-slate-800 flex items-center gap-2">
                <i data-lucide="history" class="text-indigo-600 w-5 h-5"></i> Personal Attendance History
            </h3>
            <p id="history-month-subtitle" class="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider mt-0.5">
                Loading Active Log Boundaries...
            </p>
        </div>
        <button onclick="window.showWelcomeMessage()"
            class="text-slate-400 hover:text-slate-600 p-1.5 rounded-xl hover:bg-slate-100 transition cursor-pointer">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- 🎯 INTERACTIVE SUMMARY CARDS CONTAINER (Includes Days Passed card) -->
    <div id="attendance-summary-container" class="mb-5 animate-fade-in hidden">
        <!-- Injected via JavaScript -->
    </div>

    <!-- 🎯 DUAL LAYOUT CONTAINER FOR LOGS -->
    <div id="attendance-history-container" class="w-full bg-white border border-slate-200 rounded-2xl shadow-inner sm:overflow-hidden p-2 sm:p-0">
        <div class="px-4 py-12 text-center text-slate-700 font-bold animate-pulse">
            <div class="flex items-center justify-center gap-2">
                <div class="w-4 h-4 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                Synchronizing cloud database history logs...
            </div>
        </div>
    </div>
</div>

<script>
    (() => {
        let masterHolidaysCache = [];
        let currentMonthDaysData = [];

        // Mobile Accordion Toggle Logic
        window.toggleAttendanceHistoryAccordion = function(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        };

        // Date Parsing Helpers
        function cleanToStandardISODate(dInput) {
            if (!dInput) return "";
            let cleanStr = String(dInput).trim().split(' ')[0];
            if (cleanStr.includes('T')) cleanStr = cleanStr.split('T')[0];
            let parts = [];
            if (cleanStr.includes('/')) parts = cleanStr.split('/');
            else if (cleanStr.includes('-')) parts = cleanStr.split('-');
            
            if (parts.length === 3) {
                if (parts[0].length === 4) return `${parts[0]}-${String(parts[1]).padStart(2, '0')}-${String(parts[2]).padStart(2, '0')}`;
                if (parts[2].length === 4) return `${parts[2]}-${String(parts[1]).padStart(2, '0')}-${String(parts[0]).padStart(2, '0')}`;
            }
            return cleanStr;
        }

        // 🎯 Formats any date input into strict DD/MM/YYYY Indian format
        function formatIndianDate(dInput) {
            if (!dInput) return "--";
            let iso = cleanToStandardISODate(dInput);
            if (!iso) return String(dInput);
            let parts = iso.split("-");
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return iso;
        }

        function parseToTimestamp(dateStr) {
            const normalized = cleanToStandardISODate(dateStr);
            if (!normalized) return 0;
            const d = new Date(normalized);
            d.setHours(0,0,0,0);
            return d.getTime();
        }

        function normalizeBackendObject(obj) {
            if (!obj || typeof obj !== 'object') return {};
            let cleanObj = {};
            for (let key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    let normalizedKey = String(key).replace(/\s+/g, '').toLowerCase();
                    cleanObj[normalizedKey] = obj[key];
                }
            }
            return cleanObj;
        }

        function evaluateDateInsideLeaveBlock(checkTime, lvRecord) {
            const cleanLv = normalizeBackendObject(lvRecord);
            let startStr = cleanLv.fromdate || "";
            let endStr = cleanLv.todate || "";
            const status = String(cleanLv.status || cleanLv.admindecision || "").toUpperCase();
            
            if (status === "APPROVED" || status === "SHORT") {
                if (cleanLv.adminapproveddate && String(cleanLv.adminapproveddate).includes('to')) {
                    let p = String(cleanLv.adminapproveddate).split('to');
                    startStr = p[0].trim(); endStr = p[1].trim();
                } else if (cleanLv.adminapproveddate && String(cleanLv.adminapproveddate).trim() !== "") {
                    startStr = cleanLv.adminapproveddate; endStr = cleanLv.adminapproveddate;
                }
            }
            
            const startT = parseToTimestamp(startStr);
            const endT = parseToTimestamp(endStr) || startT; 
            if (!startT) return false;
            return (checkTime >= startT && checkTime <= endT);
        }

        function getHolidayNameForTimestamp(checkTime) {
            const match = masterHolidaysCache.find(h => parseToTimestamp(h.date) === checkTime);
            return match ? match.description : null;
        }

        let activeStatusFilter = "ALL";
        window.handlePersonalSummaryCardFilterClick = function(statusVal) {
            if (activeStatusFilter === statusVal) {
                activeStatusFilter = "ALL";
            } else {
                activeStatusFilter = statusVal;
            }
            window.renderFilteredAttendanceHistory();
        };

        window.fetchAndRenderAttendanceHistory = async function () {
            const container = document.getElementById("attendance-history-container");
            const summaryContainer = document.getElementById("attendance-summary-container");
            const subtitle = document.getElementById("history-month-subtitle");
            if (!container) return;

            const now = new Date();
            const currYear = now.getFullYear();
            const currMonth = now.getMonth();
            const todayDate = now.getDate();

            const monthLabel = now.toLocaleString('default', { month: 'long', year: 'numeric' });
            if (subtitle) subtitle.innerText = `Displaying Logs For: ${monthLabel} (Current Month Only)`;

            try {
                const [attRes, lvRes, holRes] = await Promise.all([
                    fetch(`${API_URL}?action=getMonthlyAttendanceHistory&employeeId=${currentUser.employeeId}`),
                    fetch(`${API_URL}?action=getAdminLeaveDataBundles`),
                    fetch(`${API_URL}?action=getAllHolidays`)
                ]);
                
                const result = await attRes.json();
                const lvResult = await lvRes.json();
                const holResult = await holRes.json();

                const allLogs = result.status && result.data ? result.data : [];
                const allLeaves = lvResult.status && lvResult.data ? lvResult.data : [];
                masterHolidaysCache = holResult.status && holResult.data ? holResult.data : [];
                
                const myLeaves = allLeaves.filter(l => String(l.employeeId).trim().toUpperCase() === String(currentUser.employeeId).trim().toUpperCase());

                const currentMonthLogs = allLogs.filter(row => {
                    const t = parseToTimestamp(row.date);
                    if(!t) return false;
                    const d = new Date(t);
                    return d.getMonth() === currMonth && d.getFullYear() === currYear;
                });

                let countPresent = 0, countAbsent = 0, countLeave = 0, countHoliday = 0, countSunday = 0, countNotMarked = 0;
                currentMonthDaysData = [];
                
                for (let day = 1; day <= todayDate; day++) {
                    const loopDateObj = new Date(currYear, currMonth, day);
                    const loopTime = loopDateObj.getTime();
                    const isSunday = loopDateObj.getDay() === 0;
                    const holidayDesc = getHolidayNameForTimestamp(loopTime);
                    
                    let formattedDateStr = formatIndianDate(`${currYear}-${String(currMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`);

                    const attLog = currentMonthLogs.find(log => parseToTimestamp(log.date) === loopTime);
                    const activeLeave = myLeaves.find(lv => {
                        const stat = String(lv.status || lv.adminDecision || "").toUpperCase();
                        if (stat !== "APPROVED" && stat !== "SHORT") return false;
                        return evaluateDateInsideLeaveBlock(loopTime, lv);
                    });

                    let recordType = "NOT_MARKED";
                    if (attLog) {
                        const remarkText = String(attLog.coordinatorRemark || 'Pending').trim().toUpperCase();
                        if (remarkText === "REJECTED" || remarkText === "ABSENT" || remarkText === "C-AB") {
                            countAbsent++; recordType = "ABSENT";
                        } else {
                            countPresent++; recordType = "PRESENT";
                        }
                    } else if (activeLeave) {
                        countLeave++; recordType = "LEAVE";
                    } else if (holidayDesc) {
                        countHoliday++; recordType = "HOLIDAY";
                    } else if (isSunday) {
                        countSunday++; recordType = "SUNDAY";
                    } else {
                        countNotMarked++; recordType = "NOT_MARKED";
                    }

                    currentMonthDaysData.push({
                        date: formattedDateStr,
                        recordType: recordType,
                        holidayDesc: holidayDesc,
                        attLog: attLog || null,
                        activeLeave: activeLeave || null,
                        isSunday: isSunday
                    });
                }

                // Render Summary Container with Days Passed & 6 Filter Cards
                if (summaryContainer) {
                    const getCardStyle = (val) => activeStatusFilter === val ? 'ring-2 ring-indigo-600 scale-[1.02] shadow-md' : 'hover:opacity-90';

                    summaryContainer.innerHTML = `
                        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2.5">
                            <div class="bg-blue-50/50 border border-blue-100 p-3 rounded-2xl shadow-inner text-center">
                                <span class="text-[9px] font-black text-blue-500 uppercase tracking-wider block mb-0.5">Days Passed</span>
                                <strong class="text-base font-black text-blue-700 font-mono">${todayDate}</strong>
                            </div>
                            <div onclick="window.handlePersonalSummaryCardFilterClick('PRESENT')" class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl shadow-inner cursor-pointer transition-all ${getCardStyle('PRESENT')}">
                                <span class="text-[9px] font-black text-emerald-600 uppercase tracking-wider block mb-0.5">Present</span>
                                <strong class="text-base font-black text-emerald-800 font-mono">${countPresent}</strong>
                            </div>
                            <div onclick="window.handlePersonalSummaryCardFilterClick('LEAVE')" class="bg-indigo-50 border border-indigo-200 p-3 rounded-2xl shadow-inner cursor-pointer transition-all ${getCardStyle('LEAVE')}">
                                <span class="text-[9px] font-black text-indigo-600 uppercase tracking-wider block mb-0.5">On Leave</span>
                                <strong class="text-base font-black text-indigo-800 font-mono">${countLeave}</strong>
                            </div>
                            <div onclick="window.handlePersonalSummaryCardFilterClick('HOLIDAY')" class="bg-amber-100 border border-amber-300 p-3 rounded-2xl shadow-inner cursor-pointer transition-all ${getCardStyle('HOLIDAY')}">
                                <span class="text-[9px] font-black text-amber-800 uppercase tracking-wider block mb-0.5">Holidays</span>
                                <strong class="text-base font-black text-amber-950 font-mono">${countHoliday}</strong>
                            </div>
                            <div onclick="window.handlePersonalSummaryCardFilterClick('SUNDAY')" class="bg-cyan-50 border border-cyan-200 p-3 rounded-2xl shadow-inner cursor-pointer transition-all ${getCardStyle('SUNDAY')}">
                                <span class="text-[9px] font-black text-cyan-600 uppercase tracking-wider block mb-0.5">Sundays</span>
                                <strong class="text-base font-black text-cyan-800 font-mono">${countSunday}</strong>
                            </div>
                            <div onclick="window.handlePersonalSummaryCardFilterClick('ABSENT')" class="bg-rose-50 border border-rose-200 p-3 rounded-2xl shadow-inner cursor-pointer transition-all ${getCardStyle('ABSENT')}">
                                <span class="text-[9px] font-black text-rose-600 uppercase tracking-wider block mb-0.5">Absent</span>
                                <strong class="text-base font-black text-rose-800 font-mono">${countAbsent}</strong>
                            </div>
                            <div onclick="window.handlePersonalSummaryCardFilterClick('NOT_MARKED')" class="bg-slate-100 border border-slate-200 p-3 rounded-2xl shadow-inner cursor-pointer transition-all ${getCardStyle('NOT_MARKED')}">
                                <span class="text-[9px] font-black text-slate-500 uppercase tracking-wider block mb-0.5">Not Marked</span>
                                <strong class="text-base font-black text-slate-700 font-mono">${countNotMarked}</strong>
                            </div>
                        </div>
                    `;
                    summaryContainer.classList.remove('hidden');
                }

                window.renderFilteredAttendanceHistory();

            } catch (err) {
                console.error("History engine failure.", err);
                container.innerHTML = `
                    <div class="p-8 text-center text-rose-700 font-black bg-rose-50 rounded-2xl border border-rose-200">
                        Fail to Load Data.
                    </div>`;
            }
        };

        window.renderFilteredAttendanceHistory = function() {
            const container = document.getElementById("attendance-history-container");
            if (!container) return;

            let filteredDays = currentMonthDaysData;
            if (activeStatusFilter !== "ALL") {
                filteredDays = currentMonthDaysData.filter(d => d.recordType === activeStatusFilter);
            }

            if (filteredDays.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-slate-500 font-bold italic bg-slate-50 rounded-2xl">
                        No attendance logs or records match the selected filter category.
                    </div>`;
                return;
            }

            let desktopRowsHtml = "";
            let mobileCardsHtml = "";

            filteredDays.forEach((item, idx) => {
                const rowId = `att_hist_mob_${idx}`;
                const row = item.attLog || {};

                let formattedDate = formatIndianDate(item.date);
                
                let statusBadgeClass = "bg-slate-100 border-slate-200 text-slate-700";
                let displayStatusLabel = "Not Marked";

                if (item.recordType === "PRESENT") {
                    const remarkText = String(row.coordinatorRemark || 'Pending').trim().toUpperCase();
                    if (remarkText === "VERIFIED" || remarkText === "APPROVED" || remarkText === "PRESENT") {
                        statusBadgeClass = "bg-emerald-50 border-emerald-200 text-emerald-700";
                    } else if (remarkText === "PENDING") {
                        statusBadgeClass = "bg-amber-50 border-amber-200 text-amber-700";
                    }
                    displayStatusLabel = row.coordinatorRemark || 'Present';
                } else if (item.recordType === "ABSENT") {
                    statusBadgeClass = "bg-rose-50 border-rose-200 text-rose-700";
                    displayStatusLabel = row.coordinatorRemark || 'Absent';
                } else if (item.recordType === "LEAVE") {
                    statusBadgeClass = "bg-indigo-50 border-indigo-200 text-indigo-700";
                    displayStatusLabel = "On Approved Leave";
                } else if (item.recordType === "HOLIDAY") {
                    statusBadgeClass = "bg-amber-100 border-amber-300 text-amber-950 font-black";
                    displayStatusLabel = `Holiday: ${item.holidayDesc}`;
                } else if (item.recordType === "SUNDAY") {
                    statusBadgeClass = "bg-cyan-50 border-cyan-200 text-cyan-800";
                    displayStatusLabel = "Sunday / Off";
                }

                const holidayTagDisplay = item.holidayDesc ? `<div class="text-amber-800 font-black text-[10px] mt-0.5 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200/60">🎉 ${item.holidayDesc}</div>` : '';

                desktopRowsHtml += `
                    <tr class="hover:bg-slate-50 transition-colors duration-150 align-top">
                        <td class="px-4 py-3 text-slate-950 whitespace-nowrap font-mono">
                            ${formattedDate}
                            ${holidayTagDisplay}
                        </td>
                        <td class="px-4 py-3 font-semibold text-slate-700 break-words">${row.currentProject || '-'}</td>
                        <td class="px-4 py-3 whitespace-nowrap"><span class="bg-slate-100 border border-slate-200 text-slate-700 px-2 py-0.5 rounded-md font-bold text-[11px]">${row.district || '-'}</span></td>
                        <td class="px-4 py-3 max-w-xs break-words font-medium text-slate-600 italic">"${row.todaysPlan || '-'}"</td>
                        <td class="px-4 py-3 font-mono font-black text-emerald-600 whitespace-nowrap text-center">${row.loginTime || '-'}</td>
                        <td class="px-4 py-3 max-w-xs break-words italic text-slate-600 font-medium">"${row.todaysWorkProgress || '-'}"</td>
                        <td class="px-4 py-3 font-mono font-black text-orange-600 whitespace-nowrap text-center">${row.logoutTime || '-'}</td>
                        <td class="px-4 py-3 align-middle">
                            <div class="flex flex-col items-center gap-1 max-w-[180px] mx-auto">
                                <span class="border px-2 py-0.5 rounded-md text-[10px] w-max uppercase tracking-wider font-black ${statusBadgeClass}">
                                    ${displayStatusLabel}
                                </span>
                                ${row.coordinatorComment ? `<span class="text-[10px] text-slate-500 font-semibold italic text-center break-words leading-tight w-full mt-1">"${row.coordinatorComment}"</span>` : ''}
                            </div>
                        </td>
                    </tr>
                `;

                mobileCardsHtml += `
                    <div class="md:hidden bg-white border border-slate-200 rounded-xl shadow-sm mb-3 overflow-hidden">
                        <div class="px-4 py-3 bg-slate-50 flex justify-between items-center cursor-pointer hover:bg-slate-100 transition" onclick="window.toggleAttendanceHistoryAccordion('${rowId}')">
                            <div class="pr-2 w-[75%]">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="font-mono text-slate-950 font-black text-xs">${formattedDate}</span>
                                </div>
                                ${holidayTagDisplay}
                                <strong class="text-slate-800 block text-xs truncate font-bold mt-1">${row.currentProject || displayStatusLabel}</strong>
                            </div>
                            <div class="w-[25%] flex flex-col items-end gap-1">
                                <span class="border px-1.5 py-0.5 rounded text-[8px] uppercase font-black tracking-wider ${statusBadgeClass} text-center truncate w-full">${displayStatusLabel}</span>
                                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 mt-1"></i>
                            </div>
                        </div>
                        
                        <div id="${rowId}" class="hidden p-4 space-y-3 text-xs border-t border-slate-100 bg-white">
                            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                                <span class="text-slate-400 font-black uppercase text-[9px]">District</span>
                                <span class="bg-slate-100 border border-slate-200 text-slate-700 px-2 py-0.5 rounded-md font-bold text-[10px]">${row.district || '-'}</span>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-2 pb-2 border-b border-slate-100 text-center">
                                <div class="bg-emerald-50/50 p-2 rounded-lg border border-emerald-100">
                                    <span class="block text-[9px] font-black uppercase text-emerald-600 mb-0.5">Login Time</span>
                                    <span class="font-mono font-black text-emerald-700 text-sm">${row.loginTime || '-'}</span>
                                </div>
                                <div class="bg-orange-50/50 p-2 rounded-lg border border-orange-100">
                                    <span class="block text-[9px] font-black uppercase text-orange-600 mb-0.5">Logout Time</span>
                                    <span class="font-mono font-black text-orange-700 text-sm">${row.logoutTime || '-'}</span>
                                </div>
                            </div>

                            <div class="pb-2 border-b border-slate-100">
                                <span class="block text-[9px] font-black uppercase text-slate-400 tracking-wider mb-1">Morning Strategy Plan</span>
                                <p class="text-slate-700 italic bg-slate-50 p-2 rounded border border-slate-200">"${row.todaysPlan || '-'}"</p>
                            </div>

                            <div class="pb-2 border-b border-slate-100">
                                <span class="block text-[9px] font-black uppercase text-slate-400 tracking-wider mb-1">EOD Work Progress Log</span>
                                <p class="text-slate-700 italic bg-slate-50 p-2 rounded border border-slate-200">"${row.todaysWorkProgress || '-'}"</p>
                            </div>

                            <div>
                                <span class="block text-[9px] font-black uppercase text-slate-400 tracking-wider mb-1.5">Status & Comment</span>
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="border px-2 py-0.5 rounded text-[9px] uppercase tracking-wider font-black ${statusBadgeClass}">${displayStatusLabel}</span>
                                </div>
                                ${row.coordinatorComment ? `<p class="text-[11px] text-slate-600 font-medium italic bg-indigo-50/50 p-2 rounded border border-indigo-100">"${row.coordinatorComment}"</p>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="hidden md:block overflow-x-auto w-full border border-slate-200 rounded-2xl bg-white shadow-inner max-h-[480px]">
                    <table class="w-full text-left border-collapse min-w-[850px]">
                        <thead>
                            <tr class="bg-slate-900 text-white border-b border-slate-800 text-[10px] font-black tracking-wider uppercase sticky top-0 z-10">
                                <th class="px-4 py-3.5 w-32">Date</th>
                                <th class="px-4 py-3.5">Current Project</th>
                                <th class="px-4 py-3.5 w-36">District</th>
                                <th class="px-4 py-3.5 max-w-xs">Morning Strategy Plan</th>
                                <th class="px-4 py-3.5 text-center w-28">Login Time</th>
                                <th class="px-4 py-3.5 max-w-xs">EOD Work Progress Log</th>
                                <th class="px-4 py-3.5 text-center w-28">Logout Time</th>
                                <th class="px-4 py-3.5 w-44 text-center">Status & Remark</th>
                            </tr>
                        </thead>
                        <tbody class="text-xs divide-y divide-slate-200 text-slate-900 font-bold bg-white">
                            ${desktopRowsHtml}
                        </tbody>
                    </table>
                </div>
                <div class="md:hidden flex flex-col w-full pt-1">
                    ${mobileCardsHtml}
                </div>
            `;
            if (window.lucide) lucide.createIcons();
        };

        window.fetchAndRenderAttendanceHistory();
    })();
</script>
