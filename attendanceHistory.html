<div class="w-full glass-panel p-6 rounded-3xl border border-slate-200 shadow-xl fade-in-up">

    <div class="flex items-center justify-between border-b border-slate-200 pb-4 mb-5">
        <div>
            <h3 class="text-lg font-black tracking-tight text-slate-800 flex items-center gap-2">
                <i data-lucide="history" class="text-indigo-600 w-5 h-5"></i> Personal Attendance History
            </h3>
            <p id="history-month-subtitle" class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mt-0.5">
                Loading Active Log Boundaries...
            </p>
        </div>
        <button onclick="window.showWelcomeMessage()"
            class="text-slate-400 hover:text-slate-600 p-1.5 rounded-xl hover:bg-slate-100 transition cursor-pointer">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
    </div>

    <div class="overflow-x-auto w-full border border-slate-200 rounded-2xl bg-white shadow-inner max-h-[480px]">
        <table class="w-full text-left border-collapse min-w-[850px]">
            <thead>
                <tr
                    class="bg-slate-900 text-white border-b border-slate-800 text-[10px] font-black tracking-wider uppercase sticky top-0 z-10">
                    <th class="px-4 py-3.5 w-28">Date</th>
                    <th class="px-4 py-3.5">Current Project</th>
                    <th class="px-4 py-3.5 w-36">District</th>
                    <th class="px-4 py-3.5 max-w-xs">Morning Strategy Plan</th>
                    <th class="px-4 py-3.5 text-center w-28">Login Time</th>
                    <th class="px-4 py-3.5 max-w-xs">EOD Work Progress Log</th>
                    <th class="px-4 py-3.5 text-center w-28">Logout Time</th>
                    <th class="px-4 py-3.5 w-44 text-center">Coordinator Remark</th>
                </tr>
            </thead>
            <tbody id="attendance-history-table-body"
                class="text-xs divide-y divide-slate-200 text-slate-900 font-bold">
                <tr>
                    <td colspan="8" class="px-4 py-12 text-center text-slate-700 font-bold animate-pulse">
                        <div class="flex items-center justify-center gap-2">
                            <div
                                class="w-4 h-4 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin">
                            </div>
                            Synchronizing cloud database history logs...
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    (() => {
        window.fetchAndRenderAttendanceHistory = async function () {
            const tableBody = document.getElementById("attendance-history-table-body");
            const subtitle = document.getElementById("history-month-subtitle");
            if (!tableBody) return;

            const currentPeriod = new Date();
            const monthLabel = currentPeriod.toLocaleString('default', { month: 'long', year: 'numeric' });
            subtitle.innerText = `Displaying Logs For: ${monthLabel} (Current Month Only)`;

            try {
                const res = await fetch(`${API_URL}?action=getMonthlyAttendanceHistory&employeeId=${currentUser.employeeId}`);
                const result = await res.json();

                if (!result.status || !result.data || result.data.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="8" class="px-4 py-10 text-center text-slate-500 font-bold italic bg-slate-50">
                                No active attendance registry data rows tracked for this current month statement period.
                            </td>
                        </tr>`;
                    return;
                }

                let outputRows = "";
                result.data.forEach(row => {
                    
                    // SAFE DATE PARSER: Avoids the "Invalid Date" JS error from strict backend formats
                    let formattedDate = String(row.date || "-");
                    try {
                        let s = formattedDate.trim().split(' ')[0];
                        if (s.includes('T')) s = s.split('T')[0];
                        let parts = s.includes('/') ? s.split('/') : s.split('-');
                        if (parts.length === 3) {
                            if (parts[0].length === 4) {
                                formattedDate = `${parts[2]}-${parts[1]}-${parts[0]}`; // Convert YYYY-MM-DD to DD-MM-YYYY
                            } else {
                                formattedDate = `${parts[0]}-${parts[1]}-${parts[2]}`; // Ensure clean DD-MM-YYYY
                            }
                        }
                    } catch(e) { }

                    // Match coordinator statuses and comments dynamically
                    let statusBadgeClass = "bg-slate-100 border-slate-200 text-slate-700";
                    const remarkText = String(row.coordinatorRemark || 'Pending').trim().toUpperCase();

                    if (remarkText === "VERIFIED" || remarkText === "APPROVED") {
                        statusBadgeClass = "bg-emerald-50 border-emerald-200 text-emerald-700";
                    } else if (remarkText === "REJECTED" || remarkText === "ABSENT") {
                        statusBadgeClass = "bg-rose-50 border-rose-200 text-rose-700";
                    } else if (remarkText === "PENDING") {
                        statusBadgeClass = "bg-amber-50 border-amber-200 text-amber-700";
                    }

                    outputRows += `
        <tr class="hover:bg-slate-50 transition-colors duration-150 align-top">
            <td class="px-4 py-3 text-slate-950 whitespace-nowrap font-mono">${formattedDate}</td>
            <td class="px-4 py-3 font-semibold text-slate-700 break-words">${row.currentProject || '-'}</td>
            <td class="px-4 py-3 whitespace-nowrap"><span class="bg-slate-100 border border-slate-200 text-slate-700 px-2 py-0.5 rounded-md font-bold text-[11px]">${row.district || '-'}</span></td>
            <td class="px-4 py-3 max-w-xs break-words font-medium text-slate-600 italic">"${row.todaysPlan || '-'}"</td>
            <td class="px-4 py-3 font-mono font-black text-emerald-600 whitespace-nowrap text-center">${row.loginTime || '-'}</td>
            <td class="px-4 py-3 max-w-xs break-words italic text-slate-600 font-medium">"${row.todaysWorkProgress || '-'}"</td>
            <td class="px-4 py-3 font-mono font-black text-orange-600 whitespace-nowrap text-center">${row.logoutTime || '-'}</td>
            <td class="px-4 py-3 align-middle">
                <div class="flex flex-col items-center gap-1 max-w-[160px] mx-auto">
                    <span class="border px-2 py-0.5 rounded-md text-[10px] w-max uppercase tracking-wider font-black ${statusBadgeClass}">
                        ${row.coordinatorRemark || 'Pending'}
                    </span>
                    ${row.coordinatorComment ? `<span class="text-[10px] text-slate-500 font-semibold italic text-center break-words leading-tight w-full">"${row.coordinatorComment}"</span>` : ''}
                </div>
            </td>
        </tr>
    `;
                });
                tableBody.innerHTML = outputRows;

            } catch (err) {
                console.error("History engine failure.", err);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="8" class="px-4 py-10 text-center text-rose-700 font-black bg-rose-50">
                            Fail to Load Data.
                        </td>
                    </tr>`;
            }
        };

        window.fetchAndRenderAttendanceHistory();
        if (window.lucide) lucide.createIcons();
    })();
</script>
