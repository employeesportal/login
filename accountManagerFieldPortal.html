<div class="w-full max-w-7xl mx-auto glass-panel p-4 sm:p-6 rounded-3xl border border-slate-200 shadow-xl bg-white fade-in-up">
    <!-- 🎯 Header Section: Title on top line, Filters and Refresh button moved to the next line -->
    <div class="border-b border-slate-200 pb-4 mb-4 sm:mb-6 space-y-4">
        <div class="flex items-center justify-between">
            <h3 class="text-lg sm:text-xl font-black tracking-tight text-slate-800 flex items-center gap-2">
                <i data-lucide="calculator" class="text-sky-600 w-5 h-5"></i> Accounts TA Claim & Verification Console
            </h3>
        </div>
        
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full">
            <!-- Search Input for Name or ID -->
            <div class="relative flex-1 sm:max-w-xs">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </span>
                <input type="text" id="acc-filter-emp" oninput="window.filterAccTable()" placeholder="Search Name/ID..." class="w-full pl-9 pr-4 py-2 border rounded-xl text-xs bg-slate-50 font-bold focus:ring-2 focus:ring-sky-500 outline-none text-slate-900">
            </div>

            <!-- Employee Name & ID Dropdown Selector -->
            <select id="acc-select-emp" onchange="window.handleAccountsEmployeeDropdownChange()" class="px-3 py-2 border rounded-xl text-xs bg-slate-50 font-bold flex-1 sm:max-w-xs focus:ring-2 focus:ring-sky-500 outline-none">
                <option value="">Filter by Employee Name & ID</option>
            </select>

            <!-- Job ID Dropdown Selector -->
            <select id="acc-filter-job" onchange="window.filterAccTable()" class="px-3 py-2 border rounded-xl text-xs bg-slate-50 font-bold flex-1 sm:max-w-xs focus:ring-2 focus:ring-sky-500 outline-none">
                <option value="">Filter by Job ID</option>
            </select>

            <!-- Refresh Button -->
            <button onclick="window.initAccountsPortal()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition cursor-pointer flex items-center justify-center shrink-0" title="Refresh Data">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- TA Claim Print Section -->
    <div class="bg-slate-900 text-white p-4 rounded-2xl mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-md">
        <div>
            <h4 class="text-xs font-black uppercase tracking-wider text-sky-400">Generate TA Claim Voucher</h4>
            <p class="text-xs text-slate-300 mt-0.5">Select a Job ID to generate the official A4 printable travel expense report for verification.</p>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <select id="acc-print-job-select" class="px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs font-mono font-bold text-white w-full sm:w-44 focus:ring-1 focus:ring-sky-500">
                <option value="">-- Choose Job ID --</option>
            </select>
            <button type="button" onclick="window.printTaClaimFromAccounts()" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-black uppercase tracking-wider transition shrink-0 shadow-sm cursor-pointer">
                <i data-lucide="printer" class="w-3.5 h-3.5 inline mr-1"></i> Print TA Claim
            </button>
        </div>
    </div>

    <!-- DUAL LAYOUT CONTAINER -->
    <div id="accounts-data-container" class="w-full bg-white border border-slate-200 rounded-2xl shadow-inner sm:overflow-hidden p-2 sm:p-0">
        <div class="p-8 text-center text-sky-700 font-bold animate-pulse">Synchronizing secure accounts logs...</div>
    </div>
</div>

<script>
    (() => {
        let accountsCache = [];

        window.toggleAccountsRowAccordion = function(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        };

        function formatIndianDateTime(rawStr) {
            if (!rawStr) return "N/A";
            try {
                let trimmed = String(rawStr).trim();
                let d = new Date(trimmed);
                if (isNaN(d.getTime())) return trimmed;
                let day = String(d.getDate()).padStart(2, '0');
                let month = String(d.getMonth() + 1).padStart(2, '0');
                let year = d.getFullYear();
                let hours = String(d.getHours()).padStart(2, '0');
                let minutes = String(d.getMinutes()).padStart(2, '0');
                let seconds = String(d.getSeconds()).padStart(2, '0');
                return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
            } catch(e) { return rawStr; }
        }

        window.initAccountsPortal = async function() {
            const container = document.getElementById("accounts-data-container");
            if (container) container.innerHTML = `<div class="p-8 text-center animate-pulse text-sky-700 font-bold">Synchronizing secure accounts logs...</div>`;
            
            try {
                const res = await fetch(`${API_URL}?action=getFieldActivities&role=ACCOUNT_MANAGER&userId=${currentUser.employeeId}`);
                const result = await res.json();
                
                if (result.status) {
                    accountsCache = result.data;
                    populateAccountsJobDropdown(accountsCache);
                    populateAccountsEmployeeDropdown(accountsCache);
                    renderAccountsTable(accountsCache);
                }
            } catch(e) {
                if (container) container.innerHTML = `<div class="p-6 text-center text-rose-600 font-bold">Failed to load account verification records.</div>`;
            }
        };

        function populateAccountsJobDropdown(data) {
            const filterSelect = document.getElementById("acc-filter-job");
            const printSelect = document.getElementById("acc-print-job-select");
            if (!filterSelect || !printSelect) return;

            const uniqueJobs = [...new Set(data.map(d => String(d.jobActivityId || '').trim()))].filter(Boolean);
            
            filterSelect.innerHTML = '<option value="">Filter by Job ID</option>';
            printSelect.innerHTML = '<option value="">-- Choose Job ID --</option>';
            
            uniqueJobs.forEach(job => {
                let opt1 = document.createElement("option"); opt1.value = job; opt1.textContent = job;
                let opt2 = document.createElement("option"); opt2.value = job; opt2.textContent = job;
                filterSelect.appendChild(opt1);
                printSelect.appendChild(opt2);
            });
        }

        function populateAccountsEmployeeDropdown(data) {
            const select = document.getElementById("acc-select-emp");
            if (!select) return;
            
            const uniqueEmployeesMap = new Map();
            data.forEach(d => {
                if (d.employeeId && !uniqueEmployeesMap.has(d.employeeId)) {
                    uniqueEmployeesMap.set(d.employeeId, d.employeeName || "Unknown");
                }
            });

            select.innerHTML = '<option value="">Filter by Employee Name & ID</option>';
            uniqueEmployeesMap.forEach((name, id) => {
                let opt = document.createElement("option"); 
                opt.value = id; 
                opt.textContent = `${name} (${id})`;
                select.appendChild(opt);
            });
        }

        window.handleAccountsEmployeeDropdownChange = function() {
            const selectEmpEl = document.getElementById("acc-select-emp");
            const selectJobEl = document.getElementById("acc-filter-job");
            const printSelect = document.getElementById("acc-print-job-select");
            const selectedEmpId = selectEmpEl ? selectEmpEl.value : "";

            let matchingData = accountsCache;
            if (selectedEmpId) {
                matchingData = accountsCache.filter(d => String(d.employeeId) === selectedEmpId);
            }
            const availableJobs = [...new Set(matchingData.map(d => String(d.jobActivityId || '').trim()))].filter(Boolean);

            if (selectJobEl) {
                const currentJobVal = selectJobEl.value;
                selectJobEl.innerHTML = '<option value="">Filter by Job ID</option>';
                availableJobs.forEach(job => {
                    let opt = document.createElement("option"); 
                    opt.value = job; 
                    opt.textContent = job;
                    selectJobEl.appendChild(opt);
                });
                if (availableJobs.includes(currentJobVal)) selectJobEl.value = currentJobVal;
                else selectJobEl.value = "";
            }

            if (printSelect) {
                const currentPrintVal = printSelect.value;
                printSelect.innerHTML = '<option value="">-- Choose Job ID --</option>';
                availableJobs.forEach(job => {
                    let opt = document.createElement("option"); 
                    opt.value = job; 
                    opt.textContent = job;
                    printSelect.appendChild(opt);
                });
                if (availableJobs.includes(currentPrintVal)) printSelect.value = currentPrintVal;
                else printSelect.value = "";
            }

            window.filterAccTable();
        };

        window.filterAccTable = function() {
            const selectJobEl = document.getElementById("acc-filter-job");
            const selectEmpEl = document.getElementById("acc-select-emp");
            const empSearchEl = document.getElementById("acc-filter-emp");
            
            const jobVal = selectJobEl ? selectJobEl.value.trim() : "";
            const selectEmpVal = selectEmpEl ? selectEmpEl.value : "";
            const empQuery = empSearchEl ? empSearchEl.value.trim().toLowerCase() : "";
            
            const filtered = accountsCache.filter(d => {
                const matchesJob = !jobVal || String(d.jobActivityId).trim() === jobVal;
                const matchesDropdownEmp = !selectEmpVal || String(d.employeeId) === selectEmpVal;
                const matchesSearchEmp = !empQuery || 
                    String(d.employeeName || "").toLowerCase().includes(empQuery) || 
                    String(d.employeeId || "").toLowerCase().includes(empQuery);

                return matchesJob && matchesDropdownEmp && matchesSearchEmp;
            });

            renderAccountsTable(filtered);
        };

        window.printTaClaimFromAccounts = function() {
            const selectEl = document.getElementById("acc-print-job-select");
            if (!selectEl) return;
            
            const selectedJobId = selectEl.value.trim();
            if (!selectedJobId) {
                alert("Please select a Job Activity ID to generate the TA Claim voucher.");
                return;
            }
            
            const matchingRecord = accountsCache.find(r => String(r.jobActivityId).trim() === selectedJobId);
            if (!matchingRecord) {
                alert("Could not find the employee record for this Job ID.");
                return;
            }

            const empIdForPrint = matchingRecord.employeeId;
            const printUrl = `printTaClaim.html?jobId=${encodeURIComponent(selectedJobId)}&userId=${encodeURIComponent(empIdForPrint)}&apiUrl=${encodeURIComponent(API_URL)}`;
            window.open(printUrl, '_blank');
        };

        function renderAccountsTable(data) {
            const container = document.getElementById("accounts-data-container");
            if (!container) return;

            if (data.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400 font-bold bg-slate-50 rounded-2xl">No field activity records found matching criteria.</div>`;
                return;
            }

            let desktopRowsHtml = "";
            let mobileCardsHtml = "";

            data.forEach((r, idx) => {
                let badgeClass = r.managerStatus === "APPROVED_SITE" || r.managerStatus === "APPROVED_PROPOSED" ? "bg-emerald-100 text-emerald-800 border border-emerald-200" : (r.managerStatus === "REJECTED" ? "bg-rose-100 text-rose-800 border border-rose-200" : "bg-amber-100 text-amber-800 border border-amber-200");
                const rowId = `acc_mob_row_${idx}`;

                let movementParts = (r.movementType || 'N/A').split('\n');
                let mainMovement = movementParts[0];
                let locations = movementParts.length > 1 ? movementParts[1] : '';

                let docLink = r.attachmentUrl && r.attachmentUrl.trim() !== "" ? 
                    `<a href="${r.attachmentUrl}" target="_blank" class="text-blue-600 underline block mt-1.5 text-[10px] font-mono flex items-center gap-1 font-black transition hover:text-blue-800"><i data-lucide="paperclip" class="w-3 h-3"></i> View Evidence</a>` : '<span class="text-[9px] text-slate-400 italic block mt-1">No Attachment</span>';

                let travelDetailsBlock = r.modeOfTravel ? r.modeOfTravel.split(" | ").map(x => `<div class="bg-sky-50 text-sky-900 px-1.5 py-0.5 rounded text-[10px] font-mono border border-sky-100 inline-block mr-1 mb-1 shadow-sm">${x}</div>`).join('') : 'N/A';

                desktopRowsHtml += `
                    <tr class="hover:bg-slate-50 transition-colors align-top">
                        <td class="p-3.5">
                            <span class="font-mono font-black text-indigo-700 block">${r.jobActivityId}</span>
                            <span class="font-mono text-slate-500 text-[10px]">Entry: ${r.entryId}</span>
                        </td>
                        <td class="p-3.5">
                            <strong class="text-slate-950 block">${r.employeeName}</strong>
                            <span class="text-xs text-slate-600 block mb-0.5">${r.project}</span>
                            <span class="bg-slate-100 border border-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-mono text-[9px] font-black inline-block mt-1">ID: ${r.employeeId}</span>
                        </td>
                        <td class="p-3.5 max-w-sm">
                            <div class="font-bold text-slate-900">${mainMovement}</div>
                            ${locations ? `<div class="text-[10px] text-slate-500 italic mb-1.5 leading-tight">${locations}</div>` : ''}
                            <div class="mt-1">${travelDetailsBlock}</div>
                            <p class="text-slate-600 italic text-[11px] mt-2 bg-slate-100 p-2.5 rounded-lg border border-slate-200 leading-snug">"${r.activityDescription || 'N/A'}"</p>
                            ${docLink}
                            <div class="font-mono text-[10px] text-slate-600 mt-2 space-y-1 bg-white border border-slate-200 p-2 rounded-lg shadow-inner">
                                <div class="flex justify-between border-b border-slate-100 pb-1">
                                    <span class="font-black text-slate-500 uppercase">Travel Start:</span> 
                                    <span class="text-indigo-700 font-bold">${formatIndianDateTime(r.tentativeTravelDate)}</span>
                                </div>
                                <div class="flex justify-between pt-0.5">
                                    <span class="font-black text-slate-500 uppercase">Dest. Reach:</span> 
                                    <span class="text-indigo-700 font-bold">${formatIndianDateTime(r.dateToReachDestination)}</span>
                                </div>
                            </div>
                        </td>
                        
                        <td class="p-3.5 max-w-xs bg-slate-50 border-l border-r border-slate-200 space-y-3 font-mono text-[10px]">
                            <div class="border-b border-slate-200 pb-2">
                                <span class="text-[9px] font-black uppercase text-indigo-500 block mb-1">Coordinator Audit:</span>
                                <div><span class="font-bold text-slate-800">${r.coordinatorName || 'Assigned'}</span></div>
                                <div class="text-slate-600 italic bg-white p-1.5 border border-slate-200 rounded mt-1 leading-tight">"${r.coordinatorComment || 'Pending'}"</div>
                            </div>
                            <div>
                                <span class="text-[9px] font-black uppercase text-emerald-600 block mb-1">Manager Verdict:</span>
                                <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase ${badgeClass} inline-block mb-1.5">${r.managerStatus || 'PENDING'}</span><br>
                                <div class="text-slate-600 mb-0.5">Travel Auth: <strong class="text-slate-900">${r.managerTravelModeApproval || 'N/A'}</strong></div>
                                <div class="text-slate-600 italic bg-white p-1.5 border border-slate-200 rounded leading-tight">Inst: "${r.managerInstruction || 'None'}"</div>
                                <div class="text-[9px] text-slate-400 mt-1.5 block font-medium">By: ${r.managerName || '-'} at ${formatIndianDateTime(r.managerTimestamp)}</div>
                            </div>
                        </td>

                        <td class="p-3.5">
                            <div class="bg-slate-100 p-3 rounded-xl border border-slate-200 shadow-inner">
                                <div class="font-black text-slate-500 uppercase tracking-wider text-[9px] mb-1">Final Admin State:</div>
                                <div class="text-rose-700 font-black text-xs uppercase">${r.adminVerdict || 'PENDING CLOSURE'}</div>
                                <div class="text-[9px] text-slate-500 mt-2 font-mono">Approved By: <strong class="text-slate-700">${r.adminName || 'Awaiting'}</strong></div>
                            </div>
                        </td>
                    </tr>
                `;

                mobileCardsHtml += `
                    <div class="md:hidden bg-white border border-slate-200 rounded-xl shadow-sm mb-3 overflow-hidden">
                        <div class="px-4 py-3 bg-slate-50 flex justify-between items-center cursor-pointer hover:bg-slate-100 transition" onclick="window.toggleAccountsRowAccordion('${rowId}')">
                            <div class="pr-2 w-[85%]">
                                <strong class="text-slate-950 block text-xs sm:text-sm truncate font-black">${r.employeeName}</strong>
                                <span class="text-slate-500 font-mono text-[10px] font-bold block mt-0.5 text-sky-700">${r.jobActivityId} <span class="text-slate-400">| Entry: ${r.entryId}</span></span>
                            </div>
                            <div class="flex items-center justify-end w-[15%]">
                                <i data-lucide="chevron-down" class="w-5 h-5 text-slate-400"></i>
                            </div>
                        </div>
                        
                        <div id="${rowId}" class="hidden p-4 space-y-4 text-xs border-t border-slate-100 bg-white">
                            <div class="pb-3 border-b border-slate-100 flex justify-between">
                                <div>
                                    <span class="text-slate-400 uppercase text-[9px] font-black tracking-wider block mb-0.5">Project</span>
                                    <span class="font-bold text-slate-800">${r.project}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-slate-400 uppercase text-[9px] font-black tracking-wider block mb-0.5">Emp ID</span>
                                    <span class="font-mono text-slate-600">${r.employeeId}</span>
                                </div>
                            </div>
                            
                            <div class="pb-3 border-b border-slate-100">
                                <span class="text-slate-400 uppercase text-[9px] font-black tracking-wider block mb-1">Movement & Travel Details</span>
                                <div class="font-bold text-slate-900">${mainMovement}</div>
                                ${locations ? `<div class="text-[10px] text-slate-500 italic mb-1.5">${locations}</div>` : ''}
                                <div class="mt-1">${travelDetailsBlock}</div>
                                <p class="text-slate-600 italic text-[11px] mt-2 bg-slate-50 p-2 rounded border border-slate-200">"${r.activityDescription || 'N/A'}"</p>
                                ${docLink}
                                <div class="font-mono text-[10px] text-slate-500 mt-2 space-y-1">
                                    <div class="flex justify-between border-b border-slate-50 pb-1"><span>Travel Start:</span> <span class="font-bold text-slate-700">${formatIndianDateTime(r.tentativeTravelDate)}</span></div>
                                    <div class="flex justify-between border-b border-slate-50 pb-1"><span>Dest. Reach:</span> <span class="font-bold text-slate-700">${formatIndianDateTime(r.dateToReachDestination)}</span></div>
                                </div>
                            </div>
                            
                            <div class="pb-3 border-b border-slate-100 bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-3 font-mono text-[10px]">
                                <div>
                                    <span class="text-[9px] font-black uppercase text-indigo-500 block mb-1">Coordinator Audit:</span>
                                    <div class="font-bold text-slate-800">${r.coordinatorName || 'Assigned'}</div>
                                    <div class="text-slate-600 italic bg-white p-1.5 border border-slate-200 rounded mt-1">"${r.coordinatorComment || 'Pending'}"</div>
                                </div>
                                <div>
                                    <span class="text-[9px] font-black uppercase text-emerald-600 block mb-1">Manager Verdict:</span>
                                    <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase ${badgeClass} inline-block mb-1.5">${r.managerStatus || 'PENDING'}</span>
                                    <div class="text-slate-600 mb-0.5">Travel Auth: <strong class="text-slate-900">${r.managerTravelModeApproval || 'N/A'}</strong></div>
                                    <div class="text-slate-600 italic bg-white p-1.5 border border-slate-200 rounded leading-tight">Inst: "${r.managerInstruction || 'None'}"</div>
                                    <div class="text-[9px] text-slate-400 mt-1 block">By: ${r.managerName || '-'} at ${formatIndianDateTime(r.managerTimestamp)}</div>
                                </div>
                            </div>
                            
                            <div class="pt-1">
                                <span class="text-slate-400 uppercase text-[9px] font-black tracking-wider block mb-1">Final Admin State</span>
                                <div class="bg-slate-100 p-3 rounded-xl border border-slate-200 shadow-inner">
                                    <div class="text-rose-700 font-black text-xs uppercase">${r.adminVerdict || 'PENDING CLOSURE'}</div>
                                    <div class="text-[9px] text-slate-500 mt-1 font-mono">Approved By: <strong class="text-slate-700">${r.adminName || 'Awaiting'}</strong></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="hidden md:block overflow-x-auto max-h-[600px]">
                    <table class="w-full text-left border-collapse text-xs min-w-[1400px]">
                        <thead>
                            <tr class="bg-slate-950 text-white font-black uppercase text-[10px] sticky top-0 z-10 tracking-wider">
                                <th class="p-3.5">Job & Entry ID</th>
                                <th class="p-3.5">Employee & Project</th>
                                <th class="p-3.5">Timeline, Movement & Details</th>
                                <th class="p-3.5 bg-slate-900 border-l border-r border-slate-800">Verification Logs (Coord & Manager)</th>
                                <th class="p-3.5">Admin Final Verdict</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y text-slate-800 font-bold bg-white">
                            ${desktopRowsHtml}
                        </tbody>
                    </table>
                </div>
                <div class="md:hidden flex flex-col w-full">
                    ${mobileCardsHtml}
                </div>
            `;
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        setTimeout(() => {
            if (document.getElementById("accounts-data-container")) {
                window.initAccountsPortal();
            }
        }, 50);

    })();
</script>
