<div class="w-full max-w-4xl mx-auto glass-panel p-4 sm:p-6 rounded-3xl border border-slate-300 shadow-xl bg-white fade-in-up">
    <div class="border-b border-slate-200 pb-4 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
            <h3 class="text-lg font-black text-slate-900 flex items-center gap-2">
                <i data-lucide="calendar-days" class="text-indigo-600 w-5 h-5"></i> Holiday Calendar Management Console
            </h3>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mt-1">Admin Portal: Add, Edit, and Delete Official Company Holidays</p>
        </div>
        <button onclick="window.openHolidayModal('ADD')" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5 cursor-pointer">
            <i data-lucide="plus" class="w-4 h-4"></i> Add New Holiday
        </button>
    </div>

    <!-- 🎯 DUAL LAYOUT CONTAINER (Desktop Table + Mobile Accordion Cards) -->
    <div id="holidays-data-container" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-2 sm:p-4 shadow-inner">
        <div class="p-6 text-center text-slate-400 font-bold">Loading holidays catalog...</div>
    </div>
</div>

<!-- Modal Form for Add/Edit Holiday -->
<div id="holiday-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 relative">
        <h3 id="holiday-modal-title" class="text-base font-black text-slate-900 mb-4">Add Holiday</h3>
        <input type="hidden" id="holiday-row-index">
        
        <div class="space-y-4 text-xs font-bold text-slate-800">
            <div>
                <label class="block text-[10px] uppercase text-slate-500 font-black mb-1">Holiday Date</label>
                <input type="date" id="holiday-input-date" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl bg-white font-mono font-bold text-slate-900 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-[10px] uppercase text-slate-500 font-black mb-1">Holiday Description</label>
                <input type="text" id="holiday-input-desc" placeholder="e.g., Independence Day" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl bg-white font-bold text-slate-900 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>

        <div class="flex items-center gap-2 mt-6">
            <button onclick="window.saveHolidayRecord()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs rounded-xl shadow-md transition cursor-pointer uppercase tracking-wider">
                Save Holiday
            </button>
            <button onclick="document.getElementById('holiday-modal').classList.add('hidden')" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xs rounded-xl transition cursor-pointer">
                Cancel
            </button>
        </div>
    </div>
</div>

<script>
    (() => {
        let holidaysCache = [];

        // Mobile Accordion Toggle Helper
        window.toggleHolidayRowAccordion = function(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        };

        window.loadHolidaysTable = async function() {
            const container = document.getElementById("holidays-data-container");
            try {
                const res = await fetch(`${API_URL}?action=getAllHolidays`);
                const result = await res.json();
                if (!result.status) throw new Error(result.message);

                holidaysCache = result.data || [];
                if (holidaysCache.length === 0) {
                    container.innerHTML = `<div class="p-6 text-center text-slate-400 font-bold bg-white rounded-xl">No holiday records found.</div>`;
                    return;
                }

                let desktopRowsHtml = "";
                let mobileCardsHtml = "";

                holidaysCache.forEach((h, idx) => {
                    const rowId = `holiday_mob_${idx}`;

                    // Desktop Table Row
                    desktopRowsHtml += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-3.5 font-mono">${h.date}</td>
                            <td class="p-3.5 text-slate-900">${h.description}</td>
                            <td class="p-3.5 text-center whitespace-nowrap">
                                <button onclick="window.openHolidayModal('EDIT', ${idx})" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg mr-1 cursor-pointer">Edit</button>
                                <button onclick="window.deleteHolidayRecord(${h.rowIndex})" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-lg cursor-pointer">Delete</button>
                            </td>
                        </tr>
                    `;

                    // Mobile Accordion Card
                    mobileCardsHtml += `
                        <div class="bg-white border border-slate-200 rounded-xl shadow-sm mb-3 overflow-hidden">
                            <div class="px-4 py-3 bg-slate-50 flex justify-between items-center cursor-pointer hover:bg-slate-100 transition" onclick="window.toggleHolidayRowAccordion('${rowId}')">
                                <div class="pr-2 w-[85%]">
                                    <strong class="text-slate-950 block text-xs font-black">${h.description}</strong>
                                    <span class="text-indigo-700 font-mono text-[10px] font-bold block mt-0.5">${h.date}</span>
                                </div>
                                <div class="w-[15%] flex justify-end">
                                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                                </div>
                            </div>
                            
                            <div id="${rowId}" class="hidden p-4 text-xs space-y-3 border-t border-slate-100 bg-white">
                                <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                                    <div>
                                        <span class="text-[9px] uppercase font-bold text-slate-400 block">Date</span>
                                        <span class="font-mono font-bold text-slate-900">${h.date}</span>
                                    </div>
                                    <div>
                                        <span class="text-[9px] uppercase font-bold text-slate-400 block">Description</span>
                                        <span class="font-bold text-slate-900">${h.description}</span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 pt-1">
                                    <button onclick="window.openHolidayModal('EDIT', ${idx})" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-xl cursor-pointer">Edit</button>
                                    <button onclick="window.deleteHolidayRecord(${h.rowIndex})" class="flex-1 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 font-black rounded-xl cursor-pointer">Delete</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <div class="hidden md:block overflow-x-auto border border-slate-200 rounded-2xl shadow-inner bg-slate-50 max-h-[500px]">
                        <table class="w-full text-left border-collapse text-xs min-w-[600px]">
                            <thead>
                                <tr class="bg-slate-950 text-white font-black uppercase text-[10px] sticky top-0 z-10">
                                    <th class="p-3.5">Holiday Date</th>
                                    <th class="p-3.5">Description</th>
                                    <th class="p-3.5 text-center w-32">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 text-slate-800 font-bold bg-white">
                                ${desktopRowsHtml}
                            </tbody>
                        </table>
                    </div>
                    <div class="md:hidden flex flex-col w-full">
                        ${mobileCardsHtml}
                    </div>
                `;
            } catch(e) {
                container.innerHTML = `<div class="p-6 text-center text-rose-600 font-black bg-white rounded-xl">Failed loading holidays.</div>`;
            }
            if (window.lucide) lucide.createIcons();
        };

        window.openHolidayModal = function(mode, idx) {
            const modal = document.getElementById("holiday-modal");
            const title = document.getElementById("holiday-modal-title");
            const rowIdxInput = document.getElementById("holiday-row-index");
            const dateInput = document.getElementById("holiday-input-date");
            const descInput = document.getElementById("holiday-input-desc");

            if (mode === "ADD") {
                title.innerText = "Add New Holiday";
                rowIdxInput.value = "";
                dateInput.value = "";
                descInput.value = "";
            } else {
                title.innerText = "Edit Holiday Details";
                const h = holidaysCache[idx];
                rowIdxInput.value = h.rowIndex;
                const parts = h.date.split("-");
                if (parts.length === 3) dateInput.value = `${parts[2]}-${parts[1]}-${parts[0]}`;
                descInput.value = h.description;
            }
            modal.classList.remove("hidden");
        };

        window.saveHolidayRecord = async function() {
            const rowIdx = document.getElementById("holiday-row-index").value;
            const rawDate = document.getElementById("holiday-input-date").value;
            const desc = document.getElementById("holiday-input-desc").value.trim();

            if (!rawDate || !desc) { alert("Please provide both date and description."); return; }

            const p = rawDate.split("-");
            const formattedDate = `${p[2]}-${p[1]}-${p[0]}`;

            const action = rowIdx ? "updateHoliday" : "addHoliday";
            const payload = { action, rowIndex: rowIdx, date: formattedDate, description: desc };

            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status) {
                    alert("Holiday saved successfully!");
                    document.getElementById("holiday-modal").classList.add("hidden");
                    window.loadHolidaysTable();
                } else {
                    alert("Error: " + result.message);
                }
            } catch(e) {
                alert("Network communication failure.");
            }
        };

        window.deleteHolidayRecord = async function(rowIndex) {
            if (!confirm("Are you sure you want to delete this holiday record?")) return;
            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "deleteHoliday", rowIndex }) });
                const result = await res.json();
                if (result.status) {
                    window.loadHolidaysTable();
                } else {
                    alert("Error: " + result.message);
                }
            } catch(e) {
                alert("Network failure.");
            }
        };

        window.loadHolidaysTable();
    })();
</script>
