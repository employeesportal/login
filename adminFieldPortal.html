<div class="w-full max-w-7xl mx-auto glass-panel p-4 sm:p-6 rounded-3xl border border-slate-200 shadow-xl bg-white fade-in-up">
    <!-- Header Section: Title on top line, Filters and Clear Filters button on the next line -->
    <div class="border-b border-slate-200 pb-4 mb-4 sm:mb-6 space-y-4">
        <div class="flex items-center justify-between">
            <h3 class="text-lg sm:text-xl font-black tracking-tight text-slate-800 flex items-center gap-2">
                <i data-lucide="shield-alert" class="text-rose-600 w-5 h-5"></i> Admin Field Audit & Verdict Console
            </h3>
        </div>
        
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full">
            <!-- Search Input for Name or ID -->
            <div class="relative flex-1 sm:max-w-xs">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </span>
                <input type="text" id="admin-filter-emp" oninput="window.filterAdminTable()" placeholder="Search Name or ID..." class="w-full pl-9 pr-4 py-2 border rounded-xl text-xs bg-slate-50 font-bold focus:ring-2 focus:ring-rose-500 outline-none text-slate-900">
            </div>

            <!-- Employee Name & ID Dropdown Selector -->
            <select id="admin-select-emp" onchange="window.handleEmployeeDropdownChange()" class="px-3 py-2 border rounded-xl text-xs bg-slate-50 font-bold flex-1 sm:max-w-xs focus:ring-2 focus:ring-rose-500 outline-none">
                <option value="">Filter by Employee Name & ID</option>
            </select>

            <!-- Job ID Dropdown Selector -->
            <select id="admin-filter-job" onchange="window.filterAdminTable()" class="px-3 py-2 border rounded-xl text-xs bg-slate-50 font-bold flex-1 sm:max-w-xs focus:ring-2 focus:ring-rose-500 outline-none">
                <option value="">Filter by Job ID</option>
            </select>

            <!-- 🎯 Clear Filters Button -->
            <button onclick="window.clearAdminFilters()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xs rounded-xl transition cursor-pointer flex items-center justify-center gap-1.5 shrink-0 shadow-sm" title="Clear All Filters">
                <i data-lucide="x-circle" class="w-4 h-4 text-rose-600"></i> Clear Filters
            </button>
        </div>
    </div>

    <!-- 🎯 DUAL LAYOUT CONTAINER -->
    <div id="admin-data-container" class="w-full bg-white border border-slate-200 rounded-2xl shadow-inner sm:overflow-hidden p-2 sm:p-0">
        <div class="p-8 text-center text-slate-500 font-bold animate-pulse">Loading admin audit logs...</div>
    </div>
</div>

<script>
    (() => {
        let adminCache = [];

        // Accordion Toggle for Mobile Cards
        window.toggleAdminRowAccordion = function(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        };

        function formatIndianDateTime(rawStr) {
            if (!rawStr) return "N/A";
            try {
                let trimmed = String(rawStr).trim();
                let d = new Date(trimmed);
                if (isNaN(d.getTime())) return trimmed;
                let day = String(d.getDate()).padStart(2, '0');
                let month = String(d.getMonth() + 1).padStart(2, '0');
                let year = d.getFullYear();
                let hours = String(d.getHours()).padStart(2, '0');
                let minutes = String(d.getMinutes()).padStart(2, '0');
                let seconds = String(d.getSeconds()).padStart(2, '0');
                return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
            } catch(e) { return rawStr; }
        }

        async function initAdminPortal() {
            const container = document.getElementById("admin-data-container");
            if(container) container.innerHTML = `<div class="p-8 text-center text-slate-500 font-bold animate-pulse">Loading admin audit logs...</div>`;
            
            try {
                const res = await fetch(`${API_URL}?action=getFieldActivities&role=ADMIN&userId=${currentUser.employeeId}`);
                const result = await res.json();
                if (result.status) {
                    adminCache = result.data;
                    populateAdminJobDropdown(adminCache);
                    populateAdminEmployeeDropdown(adminCache);
                    renderAdminTable(adminCache);
                } else {
                    if(container) container.innerHTML = `<div class="p-8 text-center text-rose-600 font-bold">Failed to load records: ${result.message}</div>`;
                }
            } catch(e) {
                if(container) container.innerHTML = `<div class="p-8 text-center text-rose-600 font-bold">Network failure. Could not load audit records.</div>`;
            }
        }

        function populateAdminJobDropdown(data) {
            const select = document.getElementById("admin-filter-job");
            if (!select) return;
            const uniqueJobs = [...new Set(data.map(d => d.jobActivityId))];
            select.innerHTML = '<option value="">Filter by Job ID</option>';
            uniqueJobs.forEach(job => {
                let opt = document.createElement("option"); opt.value = job; opt.textContent = job;
                select.appendChild(opt);
            });
        }

        function populateAdminEmployeeDropdown(data) {
            const select = document.getElementById("admin-select-emp");
            if (!select) return;
            
            const uniqueEmployeesMap = new Map();
            data.forEach(d => {
                if (d.employeeId && !uniqueEmployeesMap.has(d.employeeId)) {
                    uniqueEmployeesMap.set(d.employeeId, d.employeeName || "Unknown");
                }
            });

            select.innerHTML = '<option value="">Filter by Employee Name & ID</option>';
            uniqueEmployeesMap.forEach((name, id) => {
                let opt = document.createElement("option"); 
                opt.value = id; 
                opt.textContent = `${name} (${id})`;
                select.appendChild(opt);
            });
        }

        // 🎯 Reset all filters and restore full Job ID options list
        window.clearAdminFilters = function() {
            const empSearchEl = document.getElementById("admin-filter-emp");
            const selectEmpEl = document.getElementById("admin-select-emp");
            const selectJobEl = document.getElementById("admin-filter-job");

            if (empSearchEl) empSearchEl.value = "";
            if (selectEmpEl) selectEmpEl.value = "";
            
            // Reset Job ID dropdown back to all options
            if (selectJobEl) {
                populateAdminJobDropdown(adminCache);
                selectJobEl.value = "";
            }

            renderAdminTable(adminCache);
        };

        window.handleEmployeeDropdownChange = function() {
            const selectEmpEl = document.getElementById("admin-select-emp");
            const selectJobEl = document.getElementById("admin-filter-job");
            const selectedEmpId = selectEmpEl ? selectEmpEl.value : "";

            if (selectJobEl) {
                let matchingData = adminCache;
                if (selectedEmpId) {
                    matchingData = adminCache.filter(d => String(d.employeeId) === selectedEmpId);
                }
                const availableJobs = [...new Set(matchingData.map(d => d.jobActivityId))];
                
                const currentJobVal = selectJobEl.value;
                selectJobEl.innerHTML = '<option value="">Filter by Job ID</option>';
                availableJobs.forEach(job => {
                    let opt = document.createElement("option"); 
                    opt.value = job; 
                    opt.textContent = job;
                    selectJobEl.appendChild(opt);
                });

                if (availableJobs.includes(currentJobVal)) {
                    selectJobEl.value = currentJobVal;
                } else {
                    selectJobEl.value = "";
                }
            }

            window.filterAdminTable();
        };

        window.filterAdminTable = function() {
            const selectJobEl = document.getElementById("admin-filter-job");
            const selectEmpEl = document.getElementById("admin-select-emp");
            const empSearchEl = document.getElementById("admin-filter-emp");
            
            const jobVal = selectJobEl ? selectJobEl.value : "";
            const selectEmpVal = selectEmpEl ? selectEmpEl.value : "";
            const empQuery = empSearchEl ? empSearchEl.value.trim().toLowerCase() : "";

            const filtered = adminCache.filter(d => {
                const matchesJob = !jobVal || d.jobActivityId === jobVal;
                const matchesDropdownEmp = !selectEmpVal || String(d.employeeId) === selectEmpVal;
                
                const matchesSearchEmp = !empQuery || 
                    String(d.employeeName || "").toLowerCase().includes(empQuery) || 
                    String(d.employeeId || "").toLowerCase().includes(empQuery);

                return matchesJob && matchesDropdownEmp && matchesSearchEmp;
            });

            renderAdminTable(filtered);
        };

        function renderAdminTable(data) {
            const container = document.getElementById("admin-data-container");
            if (!container) return;

            if (data.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400 font-bold bg-slate-50 rounded-2xl">No field activity audit records found matching criteria.</div>`;
                return;
            }

            let desktopRowsHtml = "";
            let mobileCardsHtml = "";

            data.forEach((r, idx) => {
                const isLocked = r.adminVerdict && r.adminVerdict !== "PENDING" && !r.adminVerdict.startsWith("PENDING");
                let badgeClass = r.managerStatus === "APPROVED_SITE" ? "bg-emerald-100 text-emerald-800" : (r.managerStatus === "REJECTED" ? "bg-rose-100 text-rose-800" : "bg-amber-100 text-amber-800");
                const rowId = `admin_mob_row_${idx}`;

                let movementParts = (r.movementType || 'N/A').split('\n');
                let mainMovement = movementParts[0];
                let locations = movementParts.length > 1 ? movementParts[1] : '';

                let docLink = r.attachmentUrl && r.attachmentUrl.trim() !== "" ? 
                    `<a href="${r.attachmentUrl}" target="_blank" class="text-blue-600 hover:text-blue-800 underline mt-1.5 text-[10px] font-mono inline-flex items-center gap-1 font-black bg-blue-50 px-2 py-1 rounded"><i data-lucide="paperclip" class="w-3 h-3"></i> View File</a>` : '';

                // Desktop Row HTML
                desktopRowsHtml += `
                    <tr class="hover:bg-slate-50 align-top hidden md:table-row">
                        <td class="p-3.5">
                            <span class="font-mono font-black text-indigo-700 block">${r.jobActivityId}</span>
                            <span class="font-mono text-slate-500 text-[10px]">Entry: ${r.entryId}</span>
                        </td>
                        <td class="p-3.5">
                            <strong class="text-slate-950 block">${r.employeeName}</strong>
                            <span class="text-xs text-slate-600">${r.project}</span>
                            <span class="text-slate-500 font-mono text-[10px] block mt-1">ID: ${r.employeeId}</span>
                        </td>
                        <td class="p-3.5 max-w-xs">
                            <div class="font-bold text-slate-900">${mainMovement} (${r.modeOfTravel})</div>
                            ${locations ? `<div class="text-[10px] text-slate-500 italic mb-1">${locations}</div>` : ''}
                            <p class="text-slate-600 italic text-[11px] mt-1 bg-slate-100 p-1.5 rounded border border-slate-200">"${r.activityDescription || 'N/A'}"</p>
                            ${docLink}
                            <div class="font-mono text-[10px] text-slate-500 mt-1.5 space-y-0.5">
                                <div>Travel: ${formatIndianDateTime(r.tentativeTravelDate)}</div>
                                <div>Reach: ${formatIndianDateTime(r.dateToReachDestination)}</div>
                                <div class="text-indigo-600">Logged: ${formatIndianDateTime(r.employeeTimestamp)}</div>
                            </div>
                        </td>
                        <td class="p-3.5 space-y-1">
                            <div class="text-[10px] text-slate-600"><strong>Coordinator:</strong> ${r.coordinatorName || 'Assigned'}</div>
                            <div class="text-slate-700 italic text-[10px] bg-slate-50 p-1 rounded border">Coord Note: "${r.coordinatorComment || 'None'}"</div>
                        </td>
                        <td class="p-3.5 max-w-xs bg-slate-50 border-l border-r border-slate-200 space-y-2 font-mono text-[10px]">
                            <div>
                                <span class="text-[9px] font-black uppercase text-slate-400 block">Manager Status:</span>
                                <span class="px-1.5 py-0.5 rounded text-[9px] font-black uppercase ${badgeClass}">${r.managerStatus || 'PENDING'}</span>
                            </div>
                            <div>
                                <span class="text-[9px] font-black uppercase text-slate-400 block">Manager Travel Mode Approval:</span>
                                <span class="font-bold text-slate-800">${r.managerTravelModeApproval || 'N/A'}</span>
                            </div>
                            <div>
                                <span class="text-[9px] font-black uppercase text-slate-400 block">Manager Instruction:</span>
                                <span class="text-indigo-900 font-sans italic">${r.managerInstruction || 'None'}</span>
                            </div>
                            <div>
                                <span class="text-[9px] font-black uppercase text-slate-400 block">Manager Name:</span>
                                <span class="text-slate-900 font-bold">${r.managerName || 'Pending'}</span>
                            </div>
                            <div>
                                <span class="text-[9px] font-black uppercase text-slate-400 block">Manager Timestamp:</span>
                                <span class="text-slate-600">${formatIndianDateTime(r.managerTimestamp)}</span>
                            </div>
                        </td>
                        <td class="p-3.5 space-y-2">
                            <select id="desk-admin-status-${r.rowIndex}" class="w-full p-1.5 border rounded-lg text-xs bg-white font-black focus:ring-2 focus:ring-rose-500 outline-none" ${isLocked ? 'disabled bg-slate-100 text-slate-500' : ''}>
                                <option value="APPROVED">Fully Approved</option>
                                <option value="APPROVED_AS_MANAGER_APPROVAL">Approved as Manager Approval</option>
                                <option value="MANAGER_APPROVAL_OVERRIDE">Manager Approval Override</option>
                                <option value="APPROVED_WITH_DEDUCTION">Approved with Deduction as per Policy</option>
                                <option value="REJECTED">Rejected</option>
                            </select>
                            <input type="text" id="desk-admin-comment-${r.rowIndex}" placeholder="Add audit comment..." class="w-full p-1.5 border rounded-lg text-xs bg-white font-normal focus:ring-2 focus:ring-rose-500 outline-none" ${isLocked ? 'disabled bg-slate-100 text-slate-500' : ''}>
                            <div class="text-[10px] font-mono text-slate-600 pt-1">
                                <div><strong>Verdict Log:</strong> ${r.adminVerdict || 'PENDING'}</div>
                                <div class="text-indigo-700"><strong>Admin Name:</strong> ${r.adminName || 'Unassigned'}</div>
                            </div>
                            ${isLocked ? '<span class="text-[10px] text-emerald-700 font-bold block">🔒 Locked (Verdict Committed)</span>' : ''}
                        </td>
                        <td class="p-3.5 text-center align-middle">
                            ${!isLocked ? `<button onclick="window.saveAdminVerdict(${r.rowIndex}, 'desk')" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-black uppercase tracking-wider shadow transition">Commit Verdict</button>` : '<span class="text-xs text-slate-400">-</span>'}
                        </td>
                    </tr>
                `;

                // Mobile Accordion Card HTML
                mobileCardsHtml += `
                    <div class="md:hidden bg-white border border-slate-200 rounded-xl shadow-sm mb-3 overflow-hidden">
                        <div class="px-4 py-3 bg-slate-50 flex justify-between items-center cursor-pointer hover:bg-slate-100 transition" onclick="window.toggleAdminRowAccordion('${rowId}')">
                            <div class="pr-2 w-[85%]">
                                <strong class="text-slate-950 block text-xs sm:text-sm truncate font-black">${r.employeeName}</strong>
                                <span class="text-slate-500 font-mono text-[10px] font-bold block mt-0.5 text-rose-700">${r.jobActivityId} <span class="text-slate-400">| Entry: ${r.entryId}</span></span>
                            </div>
                            <div class="flex items-center justify-end w-[15%]">
                                <i data-lucide="chevron-down" class="w-5 h-5 text-slate-400"></i>
                            </div>
                        </div>
                        
                        <div id="${rowId}" class="hidden p-4 space-y-4 text-xs border-t border-slate-100 bg-white">
                            <div class="pb-3 border-b border-slate-100 flex justify-between">
                                <div>
                                    <span class="text-slate-400 uppercase text-[9px] font-black tracking-wider block mb-0.5">Project</span>
                                    <span class="font-bold text-slate-800">${r.project}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-slate-400 uppercase text-[9px] font-black tracking-wider block mb-0.5">Emp ID</span>
                                    <span class="font-mono text-slate-600">${r.employeeId}</span>
                                </div>
                            </div>
                            
                            <div class="pb-3 border-b border-slate-100">
                                <span class="text-slate-400 uppercase text-[9px] font-black tracking-wider block mb-1">Movement Details</span>
                                <div class="font-bold text-slate-900">${mainMovement} (${r.modeOfTravel})</div>
                                ${locations ? `<div class="text-[10px] text-slate-500 italic mb-1">${locations}</div>` : ''}
                                <p class="text-slate-600 italic text-[11px] mt-1 bg-slate-50 p-2 rounded border border-slate-200">"${r.activityDescription || 'N/A'}"</p>
                                ${docLink}
                                <div class="font-mono text-[10px] text-slate-500 mt-2 space-y-1">
                                    <div class="flex justify-between border-b border-slate-50 pb-1"><span>Travel:</span> <span class="font-bold text-slate-700">${formatIndianDateTime(r.tentativeTravelDate)}</span></div>
                                    <div class="flex justify-between border-b border-slate-50 pb-1"><span>Reach:</span> <span class="font-bold text-slate-700">${formatIndianDateTime(r.dateToReachDestination)}</span></div>
                                    <div class="flex justify-between text-indigo-700 font-bold"><span>Logged:</span> <span>${formatIndianDateTime(r.employeeTimestamp)}</span></div>
                                </div>
                            </div>
                            
                            <div class="pb-3 border-b border-slate-100">
                                <span class="text-slate-400 uppercase text-[9px] font-black tracking-wider block mb-1">Coordinator Remarks</span>
                                <div class="text-[10px] text-slate-500 mb-1">Auditor: <strong>${r.coordinatorName || 'Assigned'}</strong></div>
                                <div class="text-slate-700 italic text-[11px] bg-slate-50 p-2 rounded border border-slate-200">"${r.coordinatorComment || 'None'}"</div>
                            </div>
                            
                            <div class="pb-3 border-b border-slate-100 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <span class="text-slate-500 uppercase text-[10px] font-black tracking-wider block mb-2 flex items-center gap-1"><i data-lucide="folder-search" class="w-3.5 h-3.5"></i> Manager Tracking Logs</span>
                                <div class="font-mono text-[10px] space-y-2">
                                    <div class="flex justify-between items-center"><span class="text-slate-400">Status:</span> <span class="px-1.5 py-0.5 rounded text-[9px] font-black uppercase ${badgeClass}">${r.managerStatus || 'PENDING'}</span></div>
                                    <div class="flex justify-between items-center"><span class="text-slate-400">Travel Mode:</span> <span class="font-bold text-slate-800">${r.managerTravelModeApproval || 'N/A'}</span></div>
                                    <div><span class="text-slate-400 block mb-0.5">Instruction:</span> <span class="text-indigo-900 font-sans italic">"${r.managerInstruction || 'None'}"</span></div>
                                    <div class="flex justify-between items-center pt-2 border-t border-slate-200"><span class="text-slate-400">Manager:</span> <span class="font-bold text-slate-800">${r.managerName || 'Pending'}</span></div>
                                    <div class="flex justify-between items-center"><span class="text-slate-400">Timestamp:</span> <span class="text-slate-600">${formatIndianDateTime(r.managerTimestamp)}</span></div>
                                </div>
                            </div>
                            
                            <div class="pt-1">
                                <span class="text-rose-600 uppercase text-[10px] font-black tracking-wider block mb-2 flex items-center gap-1"><i data-lucide="gavel" class="w-3.5 h-3.5"></i> Admin Verdict & Approval</span>
                                
                                <div class="space-y-3">
                                    <select id="mob-admin-status-${r.rowIndex}" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs bg-white font-black focus:ring-2 focus:ring-rose-500 outline-none" ${isLocked ? 'disabled bg-slate-100 text-slate-500' : ''}>
                                        <option value="APPROVED">Fully Approved</option>
                                        <option value="APPROVED_AS_MANAGER_APPROVAL">Approved as Manager Approval</option>
                                        <option value="MANAGER_APPROVAL_OVERRIDE">Manager Approval Override</option>
                                        <option value="APPROVED_WITH_DEDUCTION">Approved with Deduction as per Policy</option>
                                        <option value="REJECTED">Rejected</option>
                                    </select>
                                    
                                    <input type="text" id="mob-admin-comment-${r.rowIndex}" placeholder="Add audit comment..." class="w-full p-2.5 border border-slate-300 rounded-xl text-xs bg-white font-normal outline-none focus:ring-2 focus:ring-rose-500" ${isLocked ? 'disabled bg-slate-100 text-slate-500' : ''}>
                                    
                                    <div class="text-[10px] font-mono text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-200">
                                        <div><strong>Verdict Log:</strong> ${r.adminVerdict || 'PENDING'}</div>
                                        <div class="text-indigo-700 mt-1"><strong>Admin Name:</strong> ${r.adminName || 'Unassigned'}</div>
                                    </div>
                                    
                                    ${isLocked ? 
                                        `<span class="text-[11px] text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded font-bold flex items-center justify-center gap-1 w-full mt-2"><i data-lucide="lock" class="w-3 h-3"></i> Locked (Verdict Committed)</span>` : 
                                        `<button onclick="window.saveAdminVerdict(${r.rowIndex}, 'mob')" class="mt-3 w-full px-4 py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-black uppercase tracking-wider shadow transition flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Commit Verdict</button>`
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="hidden md:block overflow-x-auto max-h-[600px]">
                    <table class="w-full text-left border-collapse text-xs min-w-[1400px]">
                        <thead>
                            <tr class="bg-slate-950 text-white font-black uppercase text-[10px] tracking-wider sticky top-0 z-10">
                                <th class="p-3.5">Job & Entry ID</th>
                                <th class="p-3.5">Employee & Project</th>
                                <th class="p-3.5">Timeline, Movement & Description</th>
                                <th class="p-3.5">Coordinator Review</th>
                                <th class="p-3.5 bg-slate-900 border-l border-r border-slate-800">Manager Tracking Logs (All Columns)</th>
                                <th class="p-3.5">Admin Verdict & Approval</th>
                                <th class="p-3.5 text-center">Execute Control</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y text-slate-800 font-bold bg-white">
                            ${desktopRowsHtml}
                        </tbody>
                    </table>
                </div>
                <div class="md:hidden flex flex-col w-full">
                    ${mobileCardsHtml}
                </div>
            `;
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        window.saveAdminVerdict = async function(rowIndex, prefix = 'desk') {
            const statusVal = document.getElementById(`${prefix}-admin-status-${rowIndex}`).value;
            const commentVal = document.getElementById(`${prefix}-admin-comment-${rowIndex}`).value.trim();
            
            if (!commentVal) { alert("Please provide a comment for the admin verdict."); return; }
            if (!confirm("Are you sure you want to commit and lock this admin verdict?")) return;

            const finalVerdictString = `${statusVal} - Note: ${commentVal} (By ${currentUser.employeeName})`;

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        action: "processAdminFieldAction", 
                        rowIndex: rowIndex, 
                        adminVerdict: finalVerdictString,
                        adminName: currentUser.employeeName 
                    })
                });
                const result = await res.json();
                if (result.status) {
                    alert("Admin verdict committed successfully!");
                    initAdminPortal();
                } else alert("Error: " + result.message);
            } catch(e) { alert("Network error."); }
        };

        setTimeout(() => {
            const container = document.getElementById("admin-data-container");
            if (container) {
                initAdminPortal();
            } else {
                console.warn("DOM not ready. Retrying init...");
                setTimeout(() => {
                   if(document.getElementById("admin-data-container")) initAdminPortal(); 
                }, 150);
            }
        }, 50);

    })();
</script>
