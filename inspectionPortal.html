<div class="w-full max-w-7xl mx-auto glass-panel p-3 sm:p-6 rounded-3xl border border-slate-200 shadow-xl bg-white fade-in-up">
    
    <!-- Header & Controls -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-200 pb-4 mb-4 sm:mb-6 gap-4">
        <div>
            <h3 class="text-xl font-black tracking-tight text-slate-900 flex items-center gap-2">
                <i data-lucide="map" class="text-indigo-600 w-6 h-6"></i> Inspection Tracking
            </h3>
            <p class="text-[10px] font-black text-slate-500 uppercase tracking-wider mt-1">District/Phase ➔ TKC ➔ Item ➔ Feeder Dashboard</p>
        </div>
        
        <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-2 w-full sm:w-auto">
            <select id="ins-project-select" onchange="window.fetchInspectionData()" class="col-span-2 px-3 py-2 sm:px-4 border border-slate-300 rounded-xl text-xs bg-slate-50 font-black focus:ring-1 focus:ring-indigo-500 transition">
                <option value="">-- Select Project --</option>
            </select>
            
            <select id="ins-district-filter" onchange="window.applyFilters()" class="hidden px-3 py-2 sm:px-4 border border-slate-300 rounded-xl text-xs bg-white font-black focus:ring-1 focus:ring-indigo-500 shadow-sm transition">
                <option value="ALL">All Districts</option>
            </select>

            <select id="ins-phase-filter" onchange="window.applyFilters()" class="hidden px-3 py-2 sm:px-4 border border-slate-300 rounded-xl text-xs bg-white font-black focus:ring-1 focus:ring-indigo-500 shadow-sm transition">
                <option value="ALL">All Phases</option>
            </select>

            <button id="btn-print-report" onclick="window.generatePrintableReport()" class="hidden col-span-2 sm:col-span-1 px-4 py-2 bg-slate-800 hover:bg-slate-950 text-white rounded-xl text-xs font-black uppercase tracking-wider shadow-sm transition flex justify-center items-center">
                <i data-lucide="printer" class="w-3.5 h-3.5 mr-1.5"></i> Export PDF
            </button>

            <button id="btn-create-target" onclick="window.openTargetModal()" class="hidden col-span-2 sm:col-span-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-black uppercase tracking-wider shadow-sm transition flex justify-center items-center">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5 mr-1.5"></i> New Target
            </button>
        </div>
    </div>

    <!-- DETAILED CALL TRACKERS -->
    <div id="ins-accordion-container" class="w-full">
        <div class="p-10 text-center text-slate-400 italic border border-slate-200 rounded-2xl bg-white shadow-inner">
            Select an assigned project above to view inspection trackers.
        </div>
    </div>
</div>

<!-- AUTOCOMPLETE DATALISTS -->
<datalist id="existing-districts"></datalist>
<datalist id="existing-items"></datalist>
<datalist id="existing-tkcs"></datalist>

<!-- Modal: Create / Edit Target (DataCoordinator Only) -->
<div id="modal-target" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white w-full max-w-2xl max-h-[95vh] overflow-y-auto rounded-3xl shadow-2xl p-5 sm:p-6 relative">
        <h3 id="target-modal-title" class="text-lg font-black text-slate-900 border-b pb-3 mb-4">Create Inspection Target</h3>
        <input type="hidden" id="target-row-index">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs font-bold text-slate-700">
            <div><label class="block mb-1 text-[10px] uppercase text-slate-500">District</label><input type="text" id="t-district" list="existing-districts" autocomplete="off" class="w-full p-2 border rounded-lg bg-slate-50"></div>
            <div>
                <label class="block mb-1 text-[10px] uppercase text-slate-500">Phase</label>
                <select id="t-phase" class="w-full p-2 border rounded-lg bg-slate-50">
                    <option value="1st">1st Phase</option>
                    <option value="2nd">2nd Phase</option>
                    <option value="3rd">3rd Phase</option>
                </select>
            </div>
            
            <div><label class="block mb-1 text-[10px] uppercase text-slate-500">TKC Name</label><input type="text" id="t-tkc" list="existing-tkcs" autocomplete="off" class="w-full p-2 border rounded-lg bg-slate-50"></div>
            <div><label class="block mb-1 text-[10px] uppercase text-slate-500">Item Type</label><input type="text" id="t-item" list="existing-items" autocomplete="off" class="w-full p-2 border rounded-lg bg-slate-50"></div>
            
            <div>
                <label class="block mb-1 text-[10px] uppercase text-slate-500 text-sky-600">Unit</label>
                <select id="t-item-unit" class="w-full p-2 border border-sky-200 rounded-lg bg-sky-50 text-sky-900">
                    <option value="Nos">Nos (Numbers)</option>
                    <option value="Kms">Kms (Kilometers)</option>
                    <option value="Mtrs">Mtrs (Meters)</option>
                    <option value="Sets">Sets</option>
                    <option value="Lot">Lot</option>
                </select>
            </div>
            <div class="hidden sm:block"></div> <!-- empty spacer -->

            <div><label class="block mb-1 text-[10px] uppercase text-slate-500">Total Sanctioned Qty</label><input type="number" step="0.001" id="t-sanc-qty" class="w-full p-2 border rounded-lg bg-slate-50"></div>
            <div><label class="block mb-1 text-[10px] uppercase text-slate-500 text-indigo-600">Target Qty to Inspect</label><input type="number" step="0.001" id="t-target-qty" class="w-full p-2 border border-indigo-200 rounded-lg bg-indigo-50 text-indigo-900"></div>
            
            <div class="sm:col-span-2 border-t border-slate-200 pt-4 mt-2">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end mb-3 gap-2">
                    <div>
                        <label class="block text-xs uppercase text-slate-800 font-black tracking-wider">Feeders List</label>
                        <p class="text-[9px] text-slate-400 font-normal">Declare the feeders associated with this target.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-[9px] uppercase text-slate-500 font-bold">Qty of Feeders:</label>
                        <input type="number" id="t-feeder-count" value="1" min="1" max="50" onchange="window.renderFeederInputs()" class="w-16 p-1.5 border border-slate-300 rounded text-center text-xs font-bold focus:ring-1 focus:ring-indigo-500">
                    </div>
                </div>
                <div id="t-feeder-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    <!-- Dynamic inputs inject here -->
                </div>
            </div>
        </div>
        <div class="flex justify-end gap-3 mt-6 pt-4 border-t sticky bottom-0 bg-white">
            <button onclick="document.getElementById('modal-target').classList.add('hidden')" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-black text-xs uppercase">Cancel</button>
            <button onclick="window.saveTargetAction()" class="px-6 py-2 bg-indigo-600 text-white rounded-xl font-black text-xs uppercase shadow-md hover:bg-indigo-700">Save</button>
        </div>
    </div>
</div>

<!-- Modal: Add Location Log (Everyone) -->
<div id="modal-log" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-5 sm:p-6 relative">
        <h3 class="text-lg font-black text-slate-900 border-b pb-3 mb-4">Log Inspected Location</h3>
        <input type="hidden" id="log-call-id">
        <div class="space-y-4 text-xs font-bold text-slate-700">
            <div>
                <label class="block mb-1 text-[10px] uppercase text-slate-500 text-indigo-600">Select Feeder</label>
                <select id="l-feeder-select" class="w-full p-2.5 border border-indigo-200 rounded-xl bg-indigo-50 text-indigo-900 font-bold focus:ring-1 focus:ring-indigo-500">
                    <!-- Populated dynamically -->
                </select>
            </div>
            
            <div>
                <label class="block mb-1 text-[10px] uppercase text-slate-500">Location Name / Sub-Area</label>
                <input type="text" id="l-location" placeholder="E.g., Chandrapur Village Site" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:ring-1 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block mb-1 text-[10px] uppercase text-slate-500 text-emerald-600">Quantity Inspected Here</label>
                <input type="number" step="0.001" id="l-qty" placeholder="0.000" class="w-full p-2.5 border border-emerald-200 rounded-xl bg-emerald-50 text-emerald-900 font-mono text-lg">
            </div>
            <div id="remark-input-container">
                <label class="block mb-1 text-[10px] uppercase text-slate-500">Remark</label>
                <textarea id="l-remark" rows="2" placeholder="Enter any specific notes..." class="w-full p-2 border rounded-xl bg-slate-50 focus:ring-1 focus:ring-amber-500"></textarea>
            </div>
        </div>
        <div class="flex justify-end gap-3 mt-6 pt-4 border-t">
            <button onclick="document.getElementById('modal-log').classList.add('hidden')" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-black text-xs uppercase">Cancel</button>
            <button onclick="window.saveLogAction()" class="px-6 py-2 bg-emerald-600 text-white rounded-xl font-black text-xs uppercase shadow-md hover:bg-emerald-700">Submit</button>
        </div>
    </div>
</div>

<script>
    (() => {
        let currentTargetData = {};
        
        const rawRoles = (currentUser.role || "").split(",").map(r => String(r).trim().toUpperCase().replace(/[^A-Z0-9]/g, ""));
        const isCoordinator = rawRoles.some(r => ["DATACOORDINATOR", "ADMIN", "GLOBALADMIN"].includes(r));

        if (isCoordinator) {
            document.getElementById("btn-create-target").classList.remove("hidden");
            document.getElementById("btn-print-report").classList.remove("hidden");
        }

        const projSelect = document.getElementById("ins-project-select");
        const userProjects = currentUser.appointedProjects ? currentUser.appointedProjects.split(",").map(p => p.trim()) : [];
        
        userProjects.forEach(p => {
            if(p) {
                let opt = document.createElement("option");
                opt.value = p; opt.textContent = p;
                projSelect.appendChild(opt);
            }
        });

        function formatQty(qty) {
            return Number(qty || 0).toFixed(3);
        }

        window.toggleAccordion = function(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        };

        window.renderFeederInputs = function(prefillData = []) {
            let count = parseInt(document.getElementById('t-feeder-count').value) || 1;
            if (prefillData.length > 0) count = prefillData.length;
            if (count > 50) count = 50;
            
            document.getElementById('t-feeder-count').value = count;
            const container = document.getElementById('t-feeder-container');
            let html = '';
            for(let i=1; i<=count; i++) {
                const val = prefillData[i-1] || '';
                html += `<div>
                    <label class="block mb-1 text-[9px] uppercase text-slate-400">Feeder ${i}</label>
                    <input type="text" value="${val}" class="feeder-input w-full p-2 border border-slate-300 rounded-lg bg-white focus:ring-1 focus:ring-indigo-500 placeholder:text-slate-300" placeholder="Name...">
                </div>`;
            }
            container.innerHTML = html;
        };

        window.fetchInspectionData = async function() {
            const project = projSelect.value;
            const container = document.getElementById("ins-accordion-container");
            const filterDropdown = document.getElementById("ins-district-filter");
            const phaseDropdown = document.getElementById("ins-phase-filter");

            if(!project) {
                container.innerHTML = `<div class="p-12 text-center text-slate-400 italic border border-slate-200 rounded-2xl bg-white shadow-inner">Select an assigned project above to view inspection trackers.</div>`;
                filterDropdown.classList.add("hidden");
                phaseDropdown.classList.add("hidden");
                return;
            }

            container.innerHTML = `<div class="p-12 text-center text-indigo-500 animate-pulse font-bold tracking-wider border border-slate-200 rounded-2xl bg-white shadow-inner">Syncing tracking logs for ${project}...</div>`;

            try {
                const res = await fetch(`${API_URL}`, {
                    method: "POST",
                    body: JSON.stringify({ action: "getInspectionData", project: project })
                });
                const result = await res.json();
                
                if (result.status) {
                    processAndRenderData(result.data);
                } else {
                    container.innerHTML = `<div class="p-8 text-center text-rose-500 font-bold border border-slate-200 rounded-2xl bg-white">Error loading data.</div>`;
                }
            } catch(e) {
                container.innerHTML = `<div class="p-8 text-center text-rose-500 font-bold border border-slate-200 rounded-2xl bg-white">Network failure.</div>`;
            }
        };

        function processAndRenderData(rows) {
            currentTargetData = {};
            
            let uniqueDistricts = new Set();
            let uniquePhases = new Set();
            let uniqueItems = new Set();
            let uniqueTkcs = new Set();
            
            rows.forEach(r => {
                if (r.Entry_Type === "TARGET") {
                    currentTargetData[r.Call_ID] = { ...r, logs: [], totalInspected: 0 };
                    
                    if (r.District) uniqueDistricts.add(r.District.trim());
                    if (r.Phase) uniquePhases.add(r.Phase.trim());
                    if (r.Item_Type) uniqueItems.add(r.Item_Type.trim());
                    if (r.TKC_Name) uniqueTkcs.add(r.TKC_Name.trim());
                }
            });

            rows.forEach(r => {
                if (r.Entry_Type === "LOG" && currentTargetData[r.Call_ID]) {
                    const t = currentTargetData[r.Call_ID];
                    t.logs.push(r);
                    t.totalInspected += Number(r.Inspected_Qty || 0);
                }
            });

            const dlDists = document.getElementById("existing-districts");
            if (dlDists) dlDists.innerHTML = Array.from(uniqueDistricts).map(d => `<option value="${d}">`).join('');
            
            const dlItems = document.getElementById("existing-items");
            if (dlItems) dlItems.innerHTML = Array.from(uniqueItems).map(i => `<option value="${i}">`).join('');
            
            const dlTkcs = document.getElementById("existing-tkcs");
            if (dlTkcs) dlTkcs.innerHTML = Array.from(uniqueTkcs).map(tkc => `<option value="${tkc}">`).join('');

            const filterDropdown = document.getElementById("ins-district-filter");
            if (filterDropdown && uniqueDistricts.size > 0) {
                const sortedDistricts = Array.from(uniqueDistricts).sort();
                filterDropdown.innerHTML = '<option value="ALL">All Districts</option>' + 
                    sortedDistricts.map(d => `<option value="${d}">${d}</option>`).join('');
                filterDropdown.classList.remove("hidden");
                filterDropdown.value = "ALL";
            }

            const phaseDropdown = document.getElementById("ins-phase-filter");
            if (phaseDropdown && uniquePhases.size > 0) {
                const sortedPhases = Array.from(uniquePhases).sort();
                phaseDropdown.innerHTML = '<option value="ALL">All Phases</option>' + 
                    sortedPhases.map(p => `<option value="${p}">${p}</option>`).join('');
                phaseDropdown.classList.remove("hidden");
                phaseDropdown.value = "ALL";
            }

            window.applyFilters();
        }

        window.applyFilters = function() {
            const distVal = document.getElementById("ins-district-filter").value;
            const phaseVal = document.getElementById("ins-phase-filter").value;
            const container = document.getElementById("ins-accordion-container");
            
            let filteredHierarchy = {};

            Object.keys(currentTargetData).forEach(key => {
                const t = currentTargetData[key];
                const dist = t.District ? t.District.trim() : "Unassigned";
                const phase = t.Phase ? t.Phase.trim() : "1st Phase";
                const tkc = t.TKC_Name ? t.TKC_Name.trim() : "Unknown TKC";
                const item = t.Item_Type ? t.Item_Type.trim() : "Unknown";
                
                if (distVal !== "ALL" && dist !== distVal) return;
                if (phaseVal !== "ALL" && phase !== phaseVal) return;

                const dpKey = `${dist}_${phase}`;
                
                if (!filteredHierarchy[dpKey]) filteredHierarchy[dpKey] = { district: dist, phase: phase, tkcs: {}, summaryItems: {} };
                
                if (!filteredHierarchy[dpKey].summaryItems[item]) {
                    filteredHierarchy[dpKey].summaryItems[item] = { totalTarget: 0, totalInspected: 0, unit: t.Item_Unit || "" };
                }
                filteredHierarchy[dpKey].summaryItems[item].totalTarget += Number(t.Target_Inspect_Qty || 0);
                filteredHierarchy[dpKey].summaryItems[item].totalInspected += t.totalInspected;

                if (!filteredHierarchy[dpKey].tkcs[tkc]) {
                    filteredHierarchy[dpKey].tkcs[tkc] = { items: {} };
                }

                if (!filteredHierarchy[dpKey].tkcs[tkc].items[item]) {
                    filteredHierarchy[dpKey].tkcs[tkc].items[item] = { targets: [], totalTarget: 0, totalInspected: 0, unit: t.Item_Unit || "" };
                }
                
                filteredHierarchy[dpKey].tkcs[tkc].items[item].totalTarget += Number(t.Target_Inspect_Qty || 0);
                filteredHierarchy[dpKey].tkcs[tkc].items[item].totalInspected += t.totalInspected;
                filteredHierarchy[dpKey].tkcs[tkc].items[item].targets.push(t);
            });
            
            if (Object.keys(filteredHierarchy).length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-slate-400 font-bold border border-slate-200 rounded-2xl bg-white shadow-inner">No targets found for the selected filters.</div>`;
                return;
            }

            let html = "";
            Object.keys(filteredHierarchy).forEach(dpKey => {
                const dpData = filteredHierarchy[dpKey];
                const safeDpId = 'dp_' + dpKey.replace(/[^a-zA-Z0-9]/g, '_');
                
                let distSummaryArr = [];
                Object.keys(dpData.summaryItems).forEach(item => {
                    const sItem = dpData.summaryItems[item];
                    distSummaryArr.push(`<span class="text-indigo-400">${item}:</span> ${formatQty(sItem.totalInspected)} / ${formatQty(sItem.totalTarget)} ${sItem.unit}`);
                });
                const distSummaryStr = distSummaryArr.join(' <span class="text-slate-600 font-black px-1">|</span> ');
                
                html += `
                <div class="mb-4 bg-white border border-slate-300 rounded-xl sm:rounded-2xl shadow-sm overflow-hidden animate-fade-in">
                    <!-- TIER 1: District & Phase -->
                    <div class="px-4 py-3 sm:px-5 sm:py-4 bg-slate-950 text-white flex justify-between items-center cursor-pointer hover:bg-slate-900 transition" onclick="window.toggleAccordion('${safeDpId}')">
                        <div class="flex items-start sm:items-center gap-3 w-[90%]">
                            <i data-lucide="map-pin" class="w-5 h-5 text-rose-500 shrink-0 mt-0.5 sm:mt-0"></i>
                            <div class="w-full pr-2">
                                <h4 class="text-xs sm:text-sm font-black uppercase tracking-wider flex flex-wrap items-center gap-2">
                                    ${dpData.district} 
                                    <span class="bg-rose-600 border border-rose-500 text-white px-1.5 py-0.5 rounded text-[9px] sm:text-[10px]">Phase: ${dpData.phase}</span>
                                </h4>
                                <div class="text-[9px] sm:text-[10px] text-slate-300 font-mono mt-1 leading-relaxed whitespace-normal break-words w-full pr-2">${distSummaryStr}</div>
                            </div>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 sm:w-5 sm:h-5 text-slate-500 shrink-0"></i>
                    </div>
                    
                    <div id="${safeDpId}" class="hidden p-2 sm:p-4 space-y-3 sm:space-y-4 bg-slate-50">
                `;

                Object.keys(dpData.tkcs).forEach(tkcKey => {
                    const tkcData = dpData.tkcs[tkcKey];
                    const safeTkcId = safeDpId + '_tkc_' + tkcKey.replace(/[^a-zA-Z0-9]/g, '_');

                    html += `
                        <!-- TIER 2: TKC Level -->
                        <div class="border border-indigo-200 rounded-lg overflow-hidden bg-white shadow-sm">
                            <div class="px-3 py-2 sm:px-4 sm:py-3 bg-indigo-50 flex justify-between items-center cursor-pointer hover:bg-indigo-100 transition" onclick="window.toggleAccordion('${safeTkcId}')">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="briefcase" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-indigo-600"></i>
                                    <div>
                                        <h5 class="text-[11px] sm:text-xs font-black text-indigo-900 uppercase tracking-wider">TKC: ${tkcKey}</h5>
                                    </div>
                                </div>
                                <i data-lucide="chevron-down" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-indigo-400 shrink-0"></i>
                            </div>
                            
                            <div id="${safeTkcId}" class="hidden p-2 sm:p-3 space-y-2 sm:space-y-3 bg-indigo-50/30">
                    `;

                    Object.keys(tkcData.items).forEach(item => {
                        const iData = tkcData.items[item];
                        const safeItemId = safeTkcId + '_i_' + item.replace(/[^a-zA-Z0-9]/g, '_');
                        const iProg = iData.totalTarget > 0 ? Math.min(100, (iData.totalInspected / iData.totalTarget) * 100) : 0;
                        const unitStr = iData.unit ? ` ${iData.unit}` : '';

                        html += `
                            <!-- TIER 3: Item Level (RESPONSIVE CARDS) -->
                            <div class="border border-sky-200 rounded-lg overflow-hidden bg-white shadow-sm">
                                <div class="px-3 py-2 bg-sky-100 flex justify-between items-center cursor-pointer hover:bg-sky-200 transition" onclick="window.toggleAccordion('${safeItemId}')">
                                    <div class="flex items-start gap-2">
                                        <i data-lucide="box" class="w-3.5 h-3.5 text-sky-700 shrink-0 mt-0.5"></i>
                                        <div>
                                            <h6 class="text-[10px] sm:text-[11px] font-black text-sky-900 uppercase tracking-wider">${item}</h6>
                                            <div class="text-[9px] text-sky-700 font-mono mt-0.5">Target: ${formatQty(iData.totalTarget)}${unitStr} | Inspected: ${formatQty(iData.totalInspected)}${unitStr} (${iProg.toFixed(1)}%)</div>
                                        </div>
                                    </div>
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-sky-600 shrink-0"></i>
                                </div>
                                
                                <div id="${safeItemId}" class="hidden p-2 sm:p-3 bg-slate-50/50 space-y-3">
                        `;

                        iData.targets.forEach(t => {
                            const tUnitStr = t.Item_Unit ? ` ${t.Item_Unit}` : '';
                            const progressPct = t.Target_Inspect_Qty > 0 ? Math.min(100, (t.totalInspected / t.Target_Inspect_Qty) * 100) : 0;
                            let progressColor = progressPct >= 100 ? "bg-emerald-500" : "bg-indigo-500";
                            
                            const feedersArray = t.Feeder_Name ? t.Feeder_Name.split(',').map(f => f.trim()).filter(f=>f) : ["General"];
                            let feederDict = {};
                            feedersArray.forEach(f => feederDict[f] = { total: 0, logs: [] });
                            
                            t.logs.forEach(l => {
                                const fName = l.Feeder_Name || feedersArray[0];
                                if(!feederDict[fName]) feederDict[fName] = { total: 0, logs: [] };
                                feederDict[fName].logs.push(l);
                                feederDict[fName].total += Number(l.Inspected_Qty || 0);
                            });

                            let feedersHtml = `<div id="feeders-${t.Call_ID}" class="hidden mt-2 border border-slate-200 rounded-lg shadow-inner overflow-hidden bg-white">
                                <div class="px-3 py-2 bg-indigo-50 border-b border-indigo-100 flex items-center justify-between">
                                    <h6 class="text-[9px] sm:text-[10px] uppercase font-black text-indigo-900 tracking-wider">Feeder Breakdown</h6>
                                </div>
                                <div class="divide-y divide-slate-100 flex flex-col">`;
                            
                            Object.keys(feederDict).forEach(fKey => {
                                const fData = feederDict[fKey];
                                const safeFeederId = `log_${t.Call_ID}_${fKey.replace(/[^a-zA-Z0-9]/g, '_')}`;
                                
                                let specificLogsHtml = "";
                                if (fData.logs.length > 0) {
                                    specificLogsHtml = `<div id="${safeFeederId}" class="hidden bg-slate-50 border-t border-slate-100 p-2 inset-shadow">
                                        <div class="flex flex-col gap-2">`;
                                    
                                    fData.logs.forEach(l => {
                                        let rawDate = String(l.Timestamp || '');
                                        let dStr = rawDate.includes(' ') ? rawDate.split(' ')[0] : rawDate;
                                        
                                        const timeSpan = isCoordinator ? `<span class="text-slate-400 font-mono text-[9px]">${rawDate}</span>` : '';
                                        const delBtn = isCoordinator ? `<button onclick="window.deleteLogAction(${l.rowIndex})" class="text-rose-500 hover:bg-rose-50 p-1 rounded transition"><i data-lucide="trash-2" class="w-3 h-3"></i></button>` : '';
                                        const rawRemark = String(l.Remark || l.Remarks || '').trim();
                                        const remarkHtml = (rawRemark !== "") ? `<div class="text-[9px] text-amber-800 font-medium mt-1 bg-amber-50/80 p-1.5 rounded border border-amber-200/50 leading-tight"><strong class="uppercase text-[8px] text-amber-600 block mb-0.5">Remark:</strong>${rawRemark}</div>` : '';

                                        specificLogsHtml += `
                                            <div class="bg-white p-2 border border-slate-200 rounded shadow-sm relative pr-8">
                                                <div class="flex justify-between items-start mb-1">
                                                    <span class="font-bold text-slate-800 text-[10px] leading-tight">${l.Location_Name}</span>
                                                    <span class="font-mono text-emerald-600 font-bold text-[10px]">+${formatQty(l.Inspected_Qty)}</span>
                                                </div>
                                                <div class="flex justify-between items-center text-[9px] text-slate-500 mt-1">
                                                    <span>${l.Submitted_By_Name}</span>
                                                    ${timeSpan}
                                                </div>
                                                ${remarkHtml}
                                                <div class="absolute top-1.5 right-1.5">${delBtn}</div>
                                            </div>
                                        `;
                                    });
                                    specificLogsHtml += `</div></div>`;
                                }

                                feedersHtml += `
                                    <div class="flex flex-col">
                                        <div class="flex items-center justify-between p-2.5 hover:bg-slate-50 transition cursor-pointer" ${fData.logs.length > 0 ? `onclick="window.toggleAccordion('${safeFeederId}')"` : ''}>
                                            <div class="font-black text-slate-700 text-[10px] truncate pr-2 w-1/2">${fKey}</div>
                                            <div class="flex items-center justify-end gap-1.5 w-1/2">
                                                <span class="font-mono text-emerald-600 font-bold text-[9px] bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">${formatQty(fData.total)}${tUnitStr}</span>
                                                ${fData.logs.length > 0 ? `<button class="text-indigo-600 text-[9px] font-black uppercase shadow-sm px-1.5 py-0.5 bg-indigo-50 hover:bg-indigo-100 rounded border border-indigo-100 whitespace-nowrap flex items-center">Logs <i data-lucide="chevron-down" class="w-3 h-3 ml-0.5"></i></button>` : `<span class="text-slate-300 text-[8px] uppercase font-bold px-1.5 py-0.5 whitespace-nowrap">No Logs</span>`}
                                            </div>
                                        </div>
                                        ${specificLogsHtml}
                                    </div>
                                `;
                            });
                            feedersHtml += `</div></div>`;

                            html += `
                                <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden relative">
                                    <div class="flex flex-col md:flex-row md:divide-x divide-slate-100">
                                        
                                        <!-- Card Col 1: Details -->
                                        <div class="p-3 md:w-1/3 flex flex-col justify-center relative">
                                            <div class="font-black text-slate-900 text-[11px] uppercase tracking-wide pr-8">${t.Item_Type}</div>
                                            <div class="text-[10px] text-slate-500 mt-1">Phase: <strong class="text-slate-700">${t.Phase}</strong></div>
                                            <div class="text-[9px] text-slate-400 font-mono mt-0.5 truncate">Call: ${t.Call_ID}</div>
                                            
                                            ${isCoordinator ? `<button onclick="window.openTargetModal('${t.Call_ID}')" class="absolute top-2 right-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 p-1.5 rounded transition"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>` : ''}
                                        </div>
                                        
                                        <!-- Card Col 2: Progress -->
                                        <div class="p-3 md:w-1/3 border-t md:border-t-0 border-slate-100 bg-slate-50/50 flex flex-col justify-center">
                                            <div class="text-[9px] font-black text-slate-500 mb-1.5 pb-1 border-b border-slate-200/60 flex justify-between">
                                                <span>Sanctioned:</span>
                                                <span class="text-slate-800">${formatQty(t.Sanctioned_Qty)}${tUnitStr}</span>
                                            </div>
                                            <div class="flex justify-between text-[9px] font-black mb-1">
                                                <span class="text-slate-500">Target: <span class="text-indigo-900">${formatQty(t.Target_Inspect_Qty)}${tUnitStr}</span></span>
                                                <span class="text-slate-500">Done: <span class="${progressPct >= 100 ? 'text-emerald-600' : 'text-indigo-600'}">${formatQty(t.totalInspected)}</span></span>
                                            </div>
                                            <div class="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden shadow-inner mb-1">
                                                <div class="${progressColor} h-1.5 rounded-full transition-all duration-500" style="width: ${progressPct}%"></div>
                                            </div>
                                            <div class="text-[8px] text-right ${progressPct >= 100 ? 'text-emerald-600' : 'text-indigo-600'} font-black">${progressPct.toFixed(1)}% Complete</div>
                                        </div>
                                        
                                        <!-- Card Col 3: Actions -->
                                        <div class="p-3 md:w-1/3 border-t md:border-t-0 border-slate-100 flex flex-col justify-center gap-2">
                                            ${progressPct < 100 ? `<button onclick="window.openLogModal('${t.Call_ID}')" class="w-full px-2 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-[9px] font-black uppercase tracking-wider rounded shadow-sm transition flex items-center justify-center gap-1.5"><i data-lucide="plus-circle" class="w-3 h-3"></i> Log Location</button>` : `<div class="text-center text-[9px] font-black text-emerald-600 uppercase bg-emerald-50 py-1.5 rounded border border-emerald-100 flex items-center justify-center gap-1"><i data-lucide="check-circle" class="w-3 h-3"></i> Target Achieved</div>`}
                                            
                                            <button onclick="window.toggleAccordion('feeders-${t.Call_ID}')" class="w-full px-2 py-1.5 bg-white text-indigo-700 hover:bg-indigo-50 text-[9px] font-black uppercase tracking-wider rounded border border-indigo-200 shadow-sm transition flex items-center justify-center gap-1.5">View Feeders <i data-lucide="chevron-down" class="w-3 h-3"></i></button>
                                        </div>
                                    </div>
                                    ${feedersHtml}
                                </div>
                            `;
                        });

                        html += `</div></div>`;
                    });
                    html += `</div></div>`;
                });
                html += `</div></div>`;
            });
            
            if (html === "") {
                container.innerHTML = `<div class="p-12 text-center text-slate-500 font-bold border border-slate-200 rounded-2xl bg-white shadow-inner">No targets found for the selected filters.</div>`;
            } else {
                container.innerHTML = html;
            }
            if(window.lucide) window.lucide.createIcons();
        };

        window.generatePrintableReport = function() {
            const distFilter = document.getElementById("ins-district-filter").value;
            const phaseFilter = document.getElementById("ins-phase-filter").value;
            const project = document.getElementById("ins-project-select").value;

            if (!project) { alert("Select a project first."); return; }
            if (distFilter === "ALL") { 
                alert("Please select a specific District from the dropdown menu to generate a clean report."); 
                return; 
            }

            const printUrl = `printInspectionReport.html?project=${encodeURIComponent(project)}&district=${encodeURIComponent(distFilter)}&phase=${encodeURIComponent(phaseFilter)}&apiUrl=${encodeURIComponent(API_URL)}&isCoord=${isCoordinator}`;
            window.open(printUrl, '_blank');
        };

        window.openTargetModal = function(callId = null) {
            const project = projSelect.value;
            if(!project) { alert("Select a project first."); return; }

            document.getElementById("modal-target").classList.remove("hidden");
            
            if (callId && currentTargetData[callId]) {
                const t = currentTargetData[callId];
                document.getElementById("target-modal-title").innerText = "Edit Inspection Target";
                document.getElementById("target-row-index").value = t.rowIndex;
                document.getElementById("t-district").value = t.District;
                document.getElementById("t-phase").value = t.Phase;
                document.getElementById("t-tkc").value = t.TKC_Name;
                document.getElementById("t-item").value = t.Item_Type;
                document.getElementById("t-item-unit").value = t.Item_Unit || "Nos";
                document.getElementById("t-sanc-qty").value = formatQty(t.Sanctioned_Qty);
                document.getElementById("t-target-qty").value = formatQty(t.Target_Inspect_Qty);
                
                const prefillFeeders = t.Feeder_Name ? t.Feeder_Name.split(',').map(f=>f.trim()).filter(f=>f) : [];
                window.renderFeederInputs(prefillFeeders);
            } else {
                document.getElementById("target-modal-title").innerText = "Create New Target";
                document.getElementById("target-row-index").value = "";
                document.getElementById("t-district").value = "";
                document.getElementById("t-phase").value = "1st";
                document.getElementById("t-tkc").value = "";
                document.getElementById("t-item").value = "";
                document.getElementById("t-item-unit").value = "Nos";
                document.getElementById("t-sanc-qty").value = "";
                document.getElementById("t-target-qty").value = "";
                window.renderFeederInputs(); 
            }
        };

        window.saveTargetAction = async function() {
            const project = projSelect.value;
            const rIndex = document.getElementById("target-row-index").value;
            
            const feederNodes = document.querySelectorAll('.feeder-input');
            const feederArr = Array.from(feederNodes).map(node => node.value.trim()).filter(val => val !== "");
            const finalFeederString = feederArr.join(', ');

            const payload = {
                action: rIndex ? "editInspectionTarget" : "saveInspectionTarget",
                project: project,
                rowIndex: rIndex,
                district: document.getElementById("t-district").value.trim(),
                phase: document.getElementById("t-phase").value,
                tkc: document.getElementById("t-tkc").value.trim(),
                item: document.getElementById("t-item").value.trim(),
                itemUnit: document.getElementById("t-item-unit").value.trim(),
                feeder: finalFeederString, 
                sancQty: document.getElementById("t-sanc-qty").value,
                targetQty: document.getElementById("t-target-qty").value,
                userId: currentUser.employeeId,
                userName: currentUser.employeeName
            };

            if(!payload.district || !payload.item || !payload.targetQty || !payload.feeder) {
                alert("Please fill all required target fields, including at least one feeder name."); return;
            }

            document.getElementById('modal-target').classList.add('hidden');
            await executeApiCall(payload);
        };

        window.openLogModal = function(callId) {
            document.getElementById("log-call-id").value = callId;
            document.getElementById("l-location").value = "";
            document.getElementById("l-qty").value = "";
            document.getElementById("l-remark").value = "";
            
            const t = currentTargetData[callId];
            const drop = document.getElementById("l-feeder-select");
            const feederArr = t.Feeder_Name ? t.Feeder_Name.split(',').map(f=>f.trim()).filter(f=>f) : [];
            if(feederArr.length === 0) {
                drop.innerHTML = `<option value="General">General / Unassigned</option>`;
            } else {
                drop.innerHTML = feederArr.map(f => `<option value="${f}">${f}</option>`).join('');
            }
            
            document.getElementById("modal-log").classList.remove("hidden");
        };

        window.saveLogAction = async function() {
            const project = projSelect.value;
            const callId = document.getElementById("log-call-id").value;
            const loc = document.getElementById("l-location").value.trim();
            const qty = Number(document.getElementById("l-qty").value);
            const remark = document.getElementById("l-remark").value.trim();
            const selectedFeeder = document.getElementById("l-feeder-select").value;

            if(!loc || qty <= 0 || !selectedFeeder) { alert("Feeder selection, location name, and quantity are required."); return; }

            const t = currentTargetData[callId];
            if ((t.totalInspected + qty) > t.Target_Inspect_Qty) {
                if(!confirm(`Warning: This log pushes the total inspected quantity (${formatQty(t.totalInspected + qty)}) beyond the target (${formatQty(t.Target_Inspect_Qty)}). Proceed anyway?`)) return;
            }

            const payload = {
                action: "saveInspectionLog",
                project: project,
                callId: callId,
                feeder: selectedFeeder, 
                location: loc,
                inspectedQty: qty,
                remark: remark, 
                userId: currentUser.employeeId,
                userName: currentUser.employeeName
            };

            document.getElementById('modal-log').classList.add('hidden');
            await executeApiCall(payload);
        };

        window.deleteLogAction = async function(rIndex) {
            if(!isCoordinator) return;
            if(!confirm("Are you sure you want to permanently delete this sub-location log?")) return;
            const payload = {
                action: "deleteInspectionLog",
                project: projSelect.value,
                rowIndex: rIndex
            };
            await executeApiCall(payload);
        };

        async function executeApiCall(payload) {
            const container = document.getElementById("ins-accordion-container");
            container.innerHTML = `<div class="p-12 text-center text-indigo-500 animate-pulse font-bold tracking-wider border border-slate-200 rounded-2xl bg-white shadow-inner">Transmitting data to server...</div>`;
            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.status) {
                    window.fetchInspectionData();
                } else {
                    alert("System Error: " + result.message);
                    window.fetchInspectionData();
                }
            } catch(e) { alert("Network drop during save."); window.fetchInspectionData(); }
        }

    })();
</script>
