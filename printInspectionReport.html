<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            @page { margin: 15mm; }
        }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f8fafc; }
        .print-container { max-w-[1000px]; margin: 0 auto; background: white; padding: 40px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 20px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; vertical-align: top; }
        th { background-color: #f1f5f9; font-weight: bold; text-transform: uppercase; color: #475569; font-size: 10px; }
        .feeder-block { margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 6px; background-color: #f8fafc; overflow: hidden; }
        .feeder-header { background-color: #eef2ff; padding: 6px 10px; border-bottom: 1px solid #e2e8f0; font-weight: bold; color: #312e81; font-size: 11px; display: flex; justify-content: space-between; }
        .feeder-body { padding: 8px 10px; }
        .log-item { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #e2e8f0; font-size: 10px; color: #475569; }
        .log-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    </style>
</head>
<body>
    
    <div class="no-print p-4 flex justify-end">
        <button onclick="window.print()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold shadow hover:bg-indigo-700 transition">Print / Save PDF</button>
    </div>

    <div class="print-container">
        <h2 class="text-center border-b-2 border-indigo-600 pb-4 mb-6 text-slate-900 uppercase text-lg font-black tracking-widest">Material Inspection & Tracking Report</h2>
        
        <div class="flex justify-between text-xs mb-6 font-bold bg-slate-50 p-4 border border-slate-200 rounded-lg">
            <span>Project: <span id="lbl-proj" class="text-indigo-600"></span></span>
            <span>District: <span id="lbl-dist" class="text-indigo-600"></span></span>
            <span>Phase: <span id="lbl-phase" class="text-indigo-600"></span></span>
            <span>Generated: <span id="lbl-date" class="text-indigo-600"></span></span>
        </div>

        <div id="report-body" class="text-center mt-10 mb-10 text-indigo-600 font-bold animate-pulse">
            Synchronizing reporting data from server...
        </div>

        <div class="mt-8 text-center text-[10px] text-slate-400">
            * This is a system-generated report. All sub-location log entries are digitally stamped and verified by the authorized coordinator.
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const project = urlParams.get('project');
        const district = urlParams.get('district');
        const phase = urlParams.get('phase');
        const apiUrl = urlParams.get('apiUrl');

        document.getElementById('lbl-proj').innerText = project;
        document.getElementById('lbl-dist').innerText = district;
        document.getElementById('lbl-phase').innerText = phase === 'ALL' ? 'All Phases' : phase;
        document.getElementById('lbl-date').innerText = new Date().toLocaleString('en-IN');

        function formatQty(qty) { return Number(qty || 0).toFixed(3); }

        async function loadReportData() {
            try {
                const res = await fetch(apiUrl, {
                    method: "POST",
                    body: JSON.stringify({ action: "getInspectionData", project: project })
                });
                const result = await res.json();
                
                if (result.status) {
                    renderReport(result.data);
                    setTimeout(function() { window.print(); }, 800);
                } else {
                    document.getElementById('report-body').innerHTML = '<div class="text-rose-600">Error loading data.</div>';
                }
            } catch (e) {
                document.getElementById('report-body').innerHTML = '<div class="text-rose-600">Failed to connect to the server.</div>';
            }
        }

        function renderReport(rows) {
            let targets = {};
            
            rows.forEach(function(r) {
                if (r.Entry_Type === "TARGET") {
                    if (r.District === district && (phase === 'ALL' || r.Phase === phase)) {
                        targets[r.Call_ID] = Object.assign({}, r, { logs: [], totalInspected: 0 });
                    }
                }
            });

            rows.forEach(function(r) {
                if (r.Entry_Type === "LOG" && targets[r.Call_ID]) {
                    targets[r.Call_ID].logs.push(r);
                    targets[r.Call_ID].totalInspected += Number(r.Inspected_Qty || 0);
                }
            });

            const keys = Object.keys(targets);
            if (keys.length === 0) {
                document.getElementById('report-body').innerHTML = '<div class="text-slate-500 py-10">No data available for the selected filters.</div>';
                return;
            }

            let html = "";
            html += "<table>";
            html += "<thead><tr>";
            html += "<th style='width: 25%'>Item Details & TKC</th>";
            html += "<th style='width: 25%'>Master Target Status</th>";
            html += "<th style='width: 50%'>Feeder-wise Inspection Breakdown</th>";
            html += "</tr></thead><tbody>";

            keys.forEach(function(key) {
                const t = targets[key];
                const unit = t.Item_Unit ? " " + t.Item_Unit : "";
                const pct = t.Target_Inspect_Qty > 0 ? ((t.totalInspected / t.Target_Inspect_Qty) * 100).toFixed(1) : 0;
                const pctColor = pct >= 100 ? "#059669" : "#ea580c";

                // Map feeders from comma-separated string
                let feedersArray = [];
                if (t.Feeder_Name) {
                    const rawSplit = t.Feeder_Name.split(',');
                    for(let i=0; i<rawSplit.length; i++) {
                        let trimmed = rawSplit[i].trim();
                        if (trimmed) feedersArray.push(trimmed);
                    }
                }
                if (feedersArray.length === 0) feedersArray = ["General"];

                let feederDict = {};
                feedersArray.forEach(function(f) { feederDict[f] = { total: 0, logs: [] }; });

                // Assign logs to specific feeders
                t.logs.forEach(function(l) {
                    const fName = l.Feeder_Name || feedersArray[0];
                    if (!feederDict[fName]) feederDict[fName] = { total: 0, logs: [] };
                    feederDict[fName].logs.push(l);
                    feederDict[fName].total += Number(l.Inspected_Qty || 0);
                });

                // Build Feeder Cards inside the 3rd column
                let feedersHtml = "";
                Object.keys(feederDict).forEach(function(fKey) {
                    const fData = feederDict[fKey];
                    
                    feedersHtml += "<div class='feeder-block'>";
                    feedersHtml += "<div class='feeder-header'>";
                    feedersHtml += "<span>" + fKey + "</span>";
                    feedersHtml += "<span style='color: #059669;'>Inspected: " + formatQty(fData.total) + unit + "</span>";
                    feedersHtml += "</div>";
                    feedersHtml += "<div class='feeder-body'>";

                    let logsHtml = "";
                    if (fData.logs.length > 0) {
                        fData.logs.forEach(function(l) {
                            const rawRemark = String(l.Remark || l.Remarks || "").trim();
                            const rmkHtml = rawRemark ? "<br><i style='color:#64748b; font-size:9px;'>Remark: " + rawRemark + "</i>" : "";
                            const subName = l.Submitted_By_Name || "Unknown";
                            
                            logsHtml += "<div class='log-item'>";
                            logsHtml += "<strong style='color:#0f172a; font-size:11px;'>" + l.Location_Name + "</strong> : ";
                            logsHtml += "<span style='color:#059669; font-weight:bold;'>+" + formatQty(l.Inspected_Qty) + unit + "</span> ";
                            logsHtml += "<span style='color:#94a3b8; font-size:9px;'>(By: " + subName + ")</span>";
                            logsHtml += rmkHtml;
                            logsHtml += "</div>";
                        });
                    } else {
                        logsHtml = "<i style='color:#94a3b8;'>No locations logged under this feeder yet.</i>";
                    }

                    feedersHtml += logsHtml;
                    feedersHtml += "</div></div>"; // Close body & block
                });

                // Build Final Row
                html += "<tr style='page-break-inside: avoid;'>";
                
                // Column 1
                html += "<td>";
                html += "<strong style='color:#4f46e5; font-size:14px;'>" + t.Item_Type + "</strong><br><br>";
                html += "<span style='color:#64748b; font-size:10px;'>TKC: <strong style='color:#0f172a;'>" + t.TKC_Name + "</strong></span><br>";
                html += "<span style='color:#94a3b8; font-size:9px;'>Call ID: " + t.Call_ID + "</span>";
                html += "</td>";
                
                // Column 2
                html += "<td style='line-height: 1.8;'>";
                html += "Sanctioned: <strong>" + formatQty(t.Sanctioned_Qty) + unit + "</strong><br>";
                html += "Target: <strong style='color:#0f172a;'>" + formatQty(t.Target_Inspect_Qty) + unit + "</strong><br>";
                html += "Inspected: <strong style='color:#059669;'>" + formatQty(t.totalInspected) + unit + "</strong><br><br>";
                html += "Progress: <span style='color:" + pctColor + "; font-weight:bold;'>" + pct + "% Complete</span>";
                html += "</td>";
                
                // Column 3
                html += "<td>" + feedersHtml + "</td>";
                html += "</tr>";
            });

            html += "</tbody></table>";
            
            document.getElementById('report-body').innerHTML = html;
            document.getElementById('report-body').classList.remove('animate-pulse', 'text-center', 'text-indigo-600');
        }

        loadReportData();
    </script>
</body>
</html>
