<div class="w-full bg-white p-6 rounded-3xl border border-slate-300 shadow-xl fade-in-up">
    <div class="border-b border-slate-200 pb-4 mb-6">
        <h3 class="text-lg font-black text-slate-900 flex items-center gap-2">
            <i data-lucide="wallet-cards" class="text-emerald-600 w-5 h-5"></i> Monthly Payroll Compliance Ledger
        </h3>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mt-1">Data Preview & Export Module</p>
    </div>

    <div class="flex flex-wrap gap-4 mb-6">
        <div class="flex-1 min-w-[200px]">
            <label class="block text-[10px] font-black text-slate-500 uppercase mb-2">Target Attendance Period</label>
            <input type="month" id="payroll-export-month" class="w-full px-4 py-3 border border-slate-300 rounded-xl font-black text-sm text-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none transition">
        </div>
        <div class="flex items-end gap-2">
            <button onclick="window.fetchPayrollData(false)" class="px-5 py-3 bg-slate-800 hover:bg-slate-950 text-white font-black text-xs rounded-xl shadow-md transition flex items-center gap-2">
                <i data-lucide="eye" class="w-4 h-4"></i> View
            </button>
            <button id="btn-export-payroll" onclick="window.fetchPayrollData(true)" class="px-5 py-3 bg-indigo-700 hover:bg-indigo-800 text-white font-black text-xs rounded-xl shadow-md transition flex items-center gap-2">
                <i data-lucide="download" class="w-4 h-4"></i> Download CSV
            </button>
        </div>
    </div>

    <div id="payroll-view-container" class="hidden overflow-auto border border-slate-200 rounded-2xl max-h-[400px] shadow-inner bg-slate-50">
        <table class="w-full text-[10px] text-left border-collapse">
            <thead class="bg-slate-950 text-white sticky top-0">
                <tr id="payroll-table-head"></tr>
            </thead>
            <tbody id="payroll-table-body" class="divide-y divide-slate-200 text-slate-800 font-bold"></tbody>
        </table>
    </div>
</div>

<script>
    window.fetchPayrollData = async function (shouldDownload) {
        const month = document.getElementById("payroll-export-month").value;
        const container = document.getElementById("payroll-view-container");
        const tbody = document.getElementById("payroll-table-body");
        const thead = document.getElementById("payroll-table-head");
        const btn = document.getElementById("btn-export-payroll");

        if (!month) return alert("Please select a month first.");

        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Processing...';

        try {
            const res = await fetch(`${API_URL}?action=exportMonthlyPayrollLedger&month=${encodeURIComponent(month)}`);
            const result = await res.json();
            
            if (!result.status) throw new Error(result.message);

            if (shouldDownload) {
                // Download Logic
                const keys = Object.keys(result.data[0]);
                let csv = [keys.join(',')];
                result.data.forEach(r => csv.push(keys.map(k => `"${String(r[k]||"").replace(/"/g,'""')}"`).join(',')));
                const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Payroll_Ledger_${month}.csv`;
                link.click();
            } else {
                // View Logic
                container.classList.remove("hidden");
                const keys = Object.keys(result.data[0]);
                thead.innerHTML = keys.map(k => `<th class="p-3 uppercase">${k}</th>`).join('');
                tbody.innerHTML = result.data.map(row => 
                    `<tr>${keys.map(k => `<td class="p-3">${row[k] || '-'}</td>`).join('')}</tr>`
                ).join('');
            }
        } catch (e) {
            alert("Error: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="download" class="w-4 h-4"></i> Download CSV';
            lucide.createIcons();
        }
    };
    
    // Refresh icons
    if(window.lucide) window.lucide.createIcons();
</script>
