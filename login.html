<div class="flex-1 flex flex-col items-center justify-center p-6 bg-white sm:bg-slate-50 min-h-screen fade-in-up">
    <div class="w-full max-w-md bg-white sm:shadow-lg sm:rounded-3xl sm:border border-slate-200 p-8 space-y-6">

        <div class="flex flex-col items-center text-center">
            <div
                class="w-40 h-40 rounded-full bg-slate-100 flex items-center justify-center overflow-hidden border border-slate-200 mb-4 shadow-sm">
                <svg viewBox="0 0 128 128" class="w-full h-full text-slate-400 bg-slate-200 shadow-inner"
                    fill="currentColor">
                    <path
                        d="M64 8a32 32 0 1032 32A32 32 0 0064 8zm0 76c-28.72 0-80 14.36-80 43.12V120h160v-12.88C144 98.36 92.72 84 64 84z" />
                </svg>
            </div>
            <h2 class="text-4xl font-extrabold text-blue-800 tracking-tight">EMPLOYEE PORTAL</h2><br>
            <h4 class="text-ml font-extrabold text-blue-800 tracking-tight">Welcome to Your Workplace Portal</h4><br>
            <h4 class="font-extrabold text-red-400 tracking-tight">Attendance • Leave Management • Employee Self Service
            </h4>
            <br>
            <p class="text-slate-500 text-sm mt-1 font-medium">Sign in to continue</p>
        </div>

        <form id="auth-execution-form" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Username</label>
                <input type="text" id="auth-user" required placeholder="Enter Username"
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition font-medium">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Password</label>
                <div class="relative rounded-xl shadow-sm">
                    <input type="password" id="auth-pass" required placeholder="Enter Password"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-white focus:ring-2 focus:ring-blue-600 focus:outline-none transition font-medium pr-12">
                    <button type="button" onclick="window.togglePasswordRevealVisibility()"
                        class="absolute inset-y-0 right-0 px-4 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer focus:outline-none">
                        <i id="eye-icon-asset" data-lucide="eye" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm pt-1">
                <label class="flex items-center gap-2 font-medium text-slate-600 cursor-pointer">
                    <input type="checkbox" id="auth-remember"
                        class="w-4 h-4 rounded text-blue-600 border-slate-300 focus:ring-blue-500">
                    <span>Remember Me</span>
                </label>
                <a href="#" onclick="openForgotModal()"
                    class="font-bold text-blue-600 hover:text-blue-800 transition">Forgot Password?</a>
            </div>

            <div class="pt-2">
                <button type="submit" id="auth-submit-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition duration-150 text-base uppercase tracking-wider cursor-pointer">
                    LOGIN
                </button>
            </div>
        </form>
        <p id="auth-error-log" class="text-center text-sm font-semibold text-red-500 hidden"></p>

        <div class="text-center text-xs font-bold text-slate-400 tracking-wide pt-4 border-t border-slate-100">
            © 2026 Employee Self Service Portal | All Rights Reserved
        </div>
    </div>
</div>

<div id="forgot-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-4">
        <h3 class="text-xl font-bold text-blue-800">Recover Access</h3>
        <p id="modal-text" class="text-sm text-slate-600">Enter your username to receive credentials via registered
            email.</p>
        <input type="text" id="forgot-username" placeholder="Username" class="w-full px-4 py-2 border rounded-lg">
        <div class="flex gap-2">
            <button onclick="closeForgotModal()" class="flex-1 py-2 text-slate-600 font-bold">Cancel</button>
            <button id="modal-action-btn" onclick="handleForgotAction()"
                class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold">Submit</button>
        </div>
    </div>
</div>

<script>

    let pendingEmail = "";
    let pendingUser = "";
    let pendingPass = "";

    function openForgotModal() { document.getElementById("forgot-modal").classList.remove("hidden"); }
    function closeForgotModal() { document.getElementById("forgot-modal").classList.add("hidden"); }

    async function handleForgotAction() {
        const user = document.getElementById("forgot-username").value;
        const btn = document.getElementById("modal-action-btn");

        if (btn.innerText === "Submit") {
            btn.innerText = "Searching...";
            const res = await fetch(`${API_URL}?action=forgot&username=${user}`);
            const data = await res.json();

            if (data.status === "CONFIRM") {
                pendingEmail = data.email;
                pendingUser = user;
                document.getElementById("modal-text").innerText = `Found email: ${data.maskedEmail}. Confirm to send password?`;
                btn.innerText = "Confirm & Send";
            } else {
                alert(data.message);
                btn.innerText = "Submit";
            }
        } else {
            btn.innerText = "Sending...";
            await fetch(`${API_URL}?action=send_creds&email=${pendingEmail}&user=${pendingUser}`);
            alert("Credentials sent to your email!");
            closeForgotModal();
        }
    }

    (() => {
        window.togglePasswordRevealVisibility = function () {
            const input = document.getElementById("auth-pass");
            const icon = document.getElementById("eye-icon-asset");
            if (input.type === "password") {
                input.type = "text";
                icon.setAttribute("data-lucide", "eye-off");
            } else {
                input.type = "password";
                icon.setAttribute("data-lucide", "eye");
            }
            lucide.createIcons();
        };

        document.getElementById("auth-execution-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("auth-submit-btn");
            const err = document.getElementById("auth-error-log");

            // 1. Initial State lockout (Prevents multi-clicks and clears errors)
            btn.disabled = true;
            btn.innerText = "VERIFYING CREDENTIALS...";
            err.classList.add("hidden");

            const u = document.getElementById("auth-user").value;
            const p = document.getElementById("auth-pass").value;

            try {
                // 2. Fire relational authentication data stream network transaction
                const res = await fetch(`${API_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
                const result = await res.json();

                if (result.status) {
                    // ==========================================================
                    // 🎯 THE CORE FIX IS LOCATED RIGHT HERE: SAVE IDENTITY TOKEN
                    // ==========================================================
                    // This maps the server's user object into persistent browser memory.
                    // This is what the attendance portal failsafe checks for!
                    localStorage.setItem("current_user_cache", JSON.stringify(result));

                    // Hydrate global scoped runtime variable context
                    currentUser = result;

                    // Initialize non-resettable session constraints tracking parameters matrix
                    const SESSION_DURATION_MINUTES = 30;
                    const expirationEpoch = Date.now() + (SESSION_DURATION_MINUTES * 60 * 1000);
                    localStorage.setItem("session_expiration_epoch", expirationEpoch);
                    localStorage.setItem("session_warned", "false");

                    // 3. Fire dynamic layout transition matrix to boot dashboard
                    mountDashboardShell();
                } else {
                    // Display security validation parameters failure alert
                    err.innerText = result.message;
                    err.classList.remove("hidden");
                }
            } catch (ex) {
                // Communications transaction failure context handling
                err.innerText = "Cloud backend pipeline synchronization failed.";
                err.classList.remove("hidden");
            } finally {
                // Reset transaction lock button parameters context
                btn.disabled = false;
                btn.innerText = "LOGIN";
            }
        });
    })();
</script>
