<div class="w-full space-y-6 fade-in-up">
    
    <div class="border-b border-slate-200 pb-4 mb-6">
        <h3 class="text-lg font-black text-slate-900 flex items-center gap-2">
            <div class="w-5 h-5 bg-indigo-100 text-indigo-700 rounded-2xl flex items-center justify-center group-hover:scale-100 transition-transform">
                <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
            </div>
            Attendance & Analysis Console
        </h3>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mt-1">View & Analyse Daily and Employee Wise Attendance </p>
    </div>

    <!-- Filter Configuration Matrix Card -->
    <div class="p-5 bg-slate-100 border-2 border-slate-300 rounded-2xl text-xs font-bold text-slate-800 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-300 pb-2">
            <span class="text-[10px] font-black uppercase tracking-wider text-indigo-700 flex items-center gap-1.5">
                <i data-lucide="sliders" class="w-4 h-4"></i> Analysis Filter Engine Configurations 
            </span>
            <span id="analysis-current-month-lbl" class="font-mono text-[11px] bg-slate-200 px-2.5 py-0.5 rounded text-slate-950 font-black"></span>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div>
                <label class="block text-[10px] text-slate-700 font-black uppercase mb-1">Assessment View Mode</label>
                <select id="anly-view-mode" onchange="window.toggleAnalysisFilterContextLayouts()" class="w-full px-3 py-2 border border-slate-300 text-slate-900 rounded-xl bg-white font-black">
                    <option value="DATE">View Logs By Calendar Date</option>
                    <option value="EMPLOYEE">Analyze Specific Employee Data</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] text-slate-700 font-black uppercase mb-1">Filter By Duty Status</label>
                <select id="anly-status-filter" onchange="window.executeAttendanceAnalysisPipeline()" class="w-full px-3 py-2 border border-slate-300 text-slate-900 rounded-xl bg-white font-black text-indigo-700">
                    <option value="ALL">Show All Statuses</option>
                    <option value="PRESENT_EMP">Present (Marked by Employee)</option>
                    <option value="PRESENT_COORD">Present (Marked by Coordinator)</option>
                    <option value="APPROVED_LEAVE">Approved Leaves (System)</option>
                    <option value="APPLIED_LEAVE">Applied Leaves (Pending)</option>
                    <option value="COORD_LEAVE">Leave Marked by Coordinator</option>
                    <option value="ABSENT">Absent & Rejected</option>
                    <option value="HOLIDAY">Holidays</option>
                    <option value="SUNDAY">Sundays / Off Days</option>
                    <option value="NOT_MARKED">Not Marked (Idle)</option>
                </select>
            </div>
            
            <div id="anly-date-input-container" class="sm:col-span-2">
                <label class="block text-[10px] text-slate-700 font-black uppercase mb-1">Select Target Calendar Date</label>
                <input type="date" id="anly-target-date" onchange="window.executeAttendanceAnalysisPipeline()" class="w-full px-3 py-2 border border-slate-300 text-slate-900 rounded-xl bg-white font-mono font-black">
            </div>

            <div id="anly-emp-input-container" class="hidden col-span-1 sm:col-span-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-[10px] text-slate-700 font-black uppercase mb-1">Search Employee By Name / ID</label>
                    <input type="text" id="anly-search-query" oninput="window.filterAnalysisEmployeeDropdownOptions()" placeholder="Type matching keywords..." class="w-full px-3 py-2 border border-slate-300 text-slate-900 rounded-xl bg-white font-medium">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-700 font-black uppercase mb-1">Select Employee Details</label>
                    <select id="anly-employee-select" onchange="window.executeAttendanceAnalysisPipeline()" class="w-full px-3 py-2 border border-slate-300 text-slate-900 rounded-xl bg-white font-black">
                        <option value="">-- Awaiting Search Queries --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-slate-700 font-black uppercase mb-1">Select Assessment Month</label>
                    <input type="month" id="anly-target-month" onchange="window.executeAttendanceAnalysisPipeline()" class="w-full px-3 py-2 border border-slate-300 text-slate-900 rounded-xl bg-white font-mono font-black">
                </div>
            </div>
        </div>
    </div>

    <!-- Summary Statistics Pane (Clickable Filter Cards) -->
    <div id="anly-summary-cards-container" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-9 gap-2.5"></div>

    <!-- Data Matrix Viewport -->
    <div class="bg-white border border-slate-300 rounded-2xl shadow-inner p-3 sm:p-5">
        <div id="anly-data-container" class="w-full">
            <div class="text-center text-slate-600 font-bold py-12 animate-pulse">
                Synchronizing data and system configurations layout...
            </div>
        </div>
    </div>
</div>

<script>
    (() => {
        let masterRegistryEmployees = [];
        let masterAttendanceLogCache = [];
        let masterLeaveApplicationsCache = [];
        let masterHolidaysCache = [];

        const datePicker = document.getElementById("anly-target-date");
        if (datePicker) datePicker.value = new Date().toISOString().split('T')[0];

        const monthPicker = document.getElementById("anly-target-month");
        const todayObj = new Date();
        if (monthPicker) monthPicker.value = todayObj.getFullYear() + '-' + String(todayObj.getMonth() + 1).padStart(2, '0');

        const labelMonth = document.getElementById("analysis-current-month-lbl");
        if (labelMonth) labelMonth.innerText = todayObj.toLocaleString('default', { month: 'long', year: 'numeric' });

        window.toggleAnalysisFilterContextLayouts = function () {
            const modeEl = document.getElementById("anly-view-mode");
            if (!modeEl) return;
            
            const mode = modeEl.value;
            const dateContainer = document.getElementById("anly-date-input-container");
            const empContainer = document.getElementById("anly-emp-input-container");

            if (dateContainer) dateContainer.classList.toggle("hidden", mode !== "DATE");
            if (empContainer) empContainer.classList.toggle("hidden", mode !== "EMPLOYEE");
            
            window.executeAttendanceAnalysisPipeline();
        };

        window.toggleAnalysisRowAccordion = function(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        };

        window.handleSummaryCardFilterClick = function(targetStatusValue) {
            const statusSelect = document.getElementById("anly-status-filter");
            if (!statusSelect) return;

            if (statusSelect.value === targetStatusValue) {
                statusSelect.value = "ALL";
            } else {
                statusSelect.value = targetStatusValue;
            }
            window.executeAttendanceAnalysisPipeline();
        };

        function normalizeBackendObject(obj) {
            if (!obj || typeof obj !== 'object') return {};
            let cleanObj = {};
            for (let key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    let normalizedKey = String(key).replace(/\s+/g, '').toLowerCase();
                    cleanObj[normalizedKey] = obj[key];
                }
            }
            return cleanObj;
        }

        window.filterAnalysisEmployeeDropdownOptions = function () {
            const query = document.getElementById("anly-search-query").value.trim().toLowerCase();
            const select = document.getElementById("anly-employee-select");
            if (!select) return;
            select.innerHTML = '<option value="">-- Choose Profile Target --</option>';

            const matches = masterRegistryEmployees.filter(e => {
                const clean = normalizeBackendObject(e);
                const name = String(clean.employeename || "").toLowerCase();
                const id = String(clean.employeeid || "").toLowerCase();
                return name.includes(query) || id.includes(query);
            });

            matches.forEach(e => {
                const clean = normalizeBackendObject(e);
                let opt = document.createElement("option");
                opt.value = clean.employeeid;
                opt.textContent = `${clean.employeename} (${clean.employeeid})`;
                select.appendChild(opt);
            });
        };

        function cleanToStandardISODate(dInput) {
            if (!dInput) return "";
            let cleanStr = String(dInput).trim().split(' ')[0];
            if (cleanStr.includes('T')) cleanStr = cleanStr.split('T')[0];
            
            let parts = [];
            if (cleanStr.includes('/')) parts = cleanStr.split('/');
            else if (cleanStr.includes('-')) parts = cleanStr.split('-');
            
            if (parts.length === 3) {
                if (parts[0].length === 4) return `${parts[0]}-${String(parts[1]).padStart(2, '0')}-${String(parts[2]).padStart(2, '0')}`;
                if (parts[2].length === 4) return `${parts[2]}-${String(parts[1]).padStart(2, '0')}-${String(parts[0]).padStart(2, '0')}`;
            }
            return cleanStr;
        }

        function parseToTimestamp(dateStr) {
            const normalized = cleanToStandardISODate(dateStr);
            if (!normalized) return 0;
            const d = new Date(normalized);
            d.setHours(0,0,0,0);
            return d.getTime();
        }

        function evaluateDateInsideLeaveBlock(checkTime, lvRecord) {
            const cleanLv = normalizeBackendObject(lvRecord);
            let startStr = cleanLv.fromdate || "";
            let endStr = cleanLv.todate || "";
            
            const status = String(cleanLv.status || cleanLv.admindecision || "").toUpperCase();
            
            if (status === "APPROVED" || status === "SHORT") {
                if (cleanLv.adminapproveddate && String(cleanLv.adminapproveddate).includes('to')) {
                    let p = String(cleanLv.adminapproveddate).split('to');
                    startStr = p[0].trim(); endStr = p[1].trim();
                } else if (cleanLv.adminapproveddate && String(cleanLv.adminapproveddate).trim() !== "") {
                    startStr = cleanLv.adminapproveddate; endStr = cleanLv.adminapproveddate;
                }
            }
            
            const startT = parseToTimestamp(startStr);
            const endT = parseToTimestamp(endStr) || startT; 
            if (!startT) return false;
            
            return (checkTime >= startT && checkTime <= endT);
        }

        function getMonthMetricsInfo(year, monthIndex) {
            const totalDays = new Date(year, monthIndex + 1, 0).getDate();
            let sundays = 0;
            for (let d = 1; d <= totalDays; d++) {
                if (new Date(year, monthIndex, d).getDay() === 0) sundays++;
            }
            return { totalDays, sundays };
        }

        function getHolidayNameForTimestamp(checkTime) {
            const match = masterHolidaysCache.find(h => parseToTimestamp(h.date) === checkTime);
            return match ? match.description : null;
        }

        function parseProjectParameters(cleanEmp, cleanLog, cleanLeave) {
            let currentProject = "--";
            let district = "";
            let locationLink = '<span class="text-slate-400 font-normal italic">No Geo Record</span>';
            let accuracy = "--";

            if (cleanEmp.appointedprojects && String(cleanEmp.appointedprojects).trim() !== "") {
                currentProject = cleanEmp.appointedprojects;
            }

            if (cleanLog.employeeid) {
                let logProj = cleanLog.currentproject || "";
                if (String(logProj).trim() !== "" && String(logProj).trim() !== "--") {
                    currentProject = logProj;
                }
                
                let logDist = cleanLog.district || "";
                if (String(logDist).trim() !== "" && String(logDist).trim() !== "--" && String(logDist).toLowerCase() !== "unassigned") {
                    district = logDist;
                }
                
                let locStr = String(cleanLog.location || "").trim();
                if (locStr.includes("||")) {
                    let segments = locStr.split("||");
                    let parsedUrl = segments[1] ? segments[1].trim() : segments[0].trim();
                    locationLink = `<a href="${parsedUrl}" target="_blank" class="px-2 py-0.5 bg-blue-50 hover:bg-blue-100 border border-blue-300 text-blue-700 font-black rounded text-[10px] inline-flex items-center gap-0.5 transition shadow-sm"><i data-lucide="map-pin" class="w-2.5 h-2.5"></i> Map</a>`;
                } else if (locStr !== "" && locStr !== "--") {
                    if (locStr.startsWith("http://") || locStr.startsWith("https://")) {
                        locationLink = `<a href="${locStr}" target="_blank" class="px-2 py-0.5 bg-blue-50 hover:bg-blue-100 border border-blue-300 text-blue-700 font-black rounded text-[10px] inline-flex items-center gap-0.5 transition shadow-sm"><i data-lucide="map-pin" class="w-2.5 h-2.5"></i> Map</a>`;
                    } else if (locStr.includes(',') || /[0-9]{2}\.[0-9]+/.test(locStr)) {
                        locationLink = `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locStr)}" target="_blank" class="px-2 py-0.5 bg-blue-50 hover:bg-blue-100 border border-blue-300 text-blue-700 font-black rounded text-[10px] inline-flex items-center gap-0.5 transition shadow-sm"><i data-lucide="map-pin" class="w-2.5 h-2.5"></i> Map</a>`;
                    } else {
                        locationLink = `<span class="text-slate-800 font-bold">${locStr}</span>`;
                    }
                }
                
                let logAcc = cleanLog.accuracy || cleanLog["accuracym"] || "";
                accuracy = logAcc ? `${logAcc} m` : "--";

            } else if (cleanLeave.employeeid) {
                if (cleanLeave.project && String(cleanLeave.project).trim() !== "") currentProject = cleanLeave.project;
                if (cleanLeave.location && String(cleanLeave.location).trim() !== "" && String(cleanLeave.location).toLowerCase() !== "unassigned") district = cleanLeave.location;
            }

            return { currentProject, district, locationLink, accuracy };
        }

        window.executeAttendanceAnalysisPipeline = function () {
            const modeEl = document.getElementById("anly-view-mode");
            const statusSelect = document.getElementById("anly-status-filter");
            const statusFilter = statusSelect ? statusSelect.value : "ALL";
            const filterDisplayName = statusSelect ? statusSelect.options[statusSelect.selectedIndex].text : "All Statuses";
            
            if (!modeEl) return;
            const mode = modeEl.value;
            const dataContainer = document.getElementById("anly-data-container");
            const summaryBox = document.getElementById("anly-summary-cards-container");
            
            if (masterRegistryEmployees.length === 0) return;

            let countPresentEmp = 0, countPresentCoord = 0, countApprLeave = 0, countApplLeave = 0, countCoordLeave = 0, countAbsent = 0, countHoliday = 0, countSunday = 0, countIdle = 0;
            let processedRows = [];
            let daysToConsider = 0;

            if (mode === "DATE") {
                const rawSelectedDate = datePicker ? datePicker.value : "";
                if (!rawSelectedDate) { 
                    dataContainer.innerHTML = `<div class="p-10 text-center text-slate-500 font-bold border border-slate-200 rounded-xl bg-slate-50">Please pick a date parameter first.</div>`; 
                    return; 
                }
                
                daysToConsider = 1;
                const checkTime = parseToTimestamp(rawSelectedDate);
                const dateObj = new Date(checkTime);
                const isSunday = dateObj.getDay() === 0;
                const holidayDesc = getHolidayNameForTimestamp(checkTime);

                masterRegistryEmployees.forEach(emp => {
                    const cleanEmp = normalizeBackendObject(emp);
                    const cleanEmpId = String(cleanEmp.employeeid || "").trim().toUpperCase();
                    
                    const attLog = masterAttendanceLogCache.find(log => {
                        const cleanLog = normalizeBackendObject(log);
                        return String(cleanLog.employeeid || "").trim().toUpperCase() === cleanEmpId && parseToTimestamp(cleanLog.date) === checkTime;
                    });

                    let isLeaveApproved = false, isLeaveApplied = false;
                    const activeLeave = masterLeaveApplicationsCache.find(lv => {
                        const cleanLv = normalizeBackendObject(lv);
                        if (String(cleanLv.employeeid || "").trim().toUpperCase() !== cleanEmpId) return false;
                        const stat = String(cleanLv.status || cleanLv.admindecision || "").toUpperCase();
                        if (stat === "REJECTED" || stat === "DECLINED" || stat === "CANCELLED") return false;
                        return evaluateDateInsideLeaveBlock(checkTime, lv);
                    });

                    if (activeLeave) {
                        const cleanLv = normalizeBackendObject(activeLeave);
                        const stat = String(cleanLv.status || cleanLv.admindecision || "").toUpperCase();
                        if (stat === "APPROVED" || stat === "SHORT") isLeaveApproved = true;
                        else isLeaveApplied = true;
                    }

                    const cleanLog = normalizeBackendObject(attLog);
                    const cleanLeave = normalizeBackendObject(activeLeave);

                    let status = "NOT MARKED", badge = "bg-rose-50 text-rose-800 border border-rose-200";
                    let todaysPlan = "--", loginTime = "--", todaysWorkProgress = "--", logoutTime = "--";
                    let coordinatorName = cleanLog.coordinatorname || cleanEmp.coordinatorname || "--";
                    let coordinatorRemark = "--", coordinatorComment = "--";

                    const pParams = parseProjectParameters(cleanEmp, cleanLog, cleanLeave);

                    if (attLog) {
                        let rem = cleanLog.coordinatorremark || "";
                        let uRem = String(rem).toUpperCase();
                        let planStr = String(cleanLog.todaysplan || "").toLowerCase();
                        const isBypassedByCoord = planStr.includes("bypassed by coordinator") || planStr.includes("attendance marked by coordinator");

                        if (uRem === "ON LEAVE" || uRem === "LEAVE APPLIED" || uRem === "HALF-DAY") {
                            status = "COORD LEAVE MARK"; badge = "bg-fuchsia-100 text-fuchsia-950 border border-fuchsia-300";
                        } else if (uRem === "ABSENT" || uRem === "REJECTED" || uRem === "C-AB") {
                            status = "ABSENT"; badge = "bg-rose-100 text-rose-950 border border-rose-300";
                        } else if (isBypassedByCoord) {
                            status = "PRESENT (COORD)"; badge = "bg-teal-100 text-teal-950 border border-teal-300";
                        } else {
                            if (uRem && uRem !== "PENDING" && uRem !== "VERIFIED" && uRem !== "APPROVED") {
                                status = "PRESENT (COORD)"; badge = "bg-teal-100 text-teal-950 border border-teal-300";
                            } else {
                                status = "PRESENT (EMP)"; badge = "bg-emerald-100 text-emerald-950 border border-emerald-400";
                            }
                        }
                        
                        if (isLeaveApproved) { status = "APPROVED LEAVE"; badge = "bg-emerald-100 text-emerald-950 border border-emerald-500"; }
                        else if (isLeaveApplied && status !== "COORD LEAVE MARK") { status = "APPLIED LEAVE"; badge = "bg-orange-100 text-orange-950 border border-orange-400"; }

                        todaysPlan = cleanLog.todaysplan || "--";
                        loginTime = cleanLog.logintime || "--";
                        todaysWorkProgress = cleanLog.todaysworkprogress || "--";
                        logoutTime = cleanLog.logouttime || "--";
                        coordinatorRemark = rem || "Pending Audit";
                        coordinatorComment = cleanLog.coordinatorcomment || "--";
                    } else {
                        if (isLeaveApproved) { status = "APPROVED LEAVE"; badge = "bg-emerald-100 text-emerald-950 border border-emerald-500"; }
                        else if (isLeaveApplied) { status = "APPLIED LEAVE"; badge = "bg-orange-100 text-orange-950 border border-orange-400"; }
                        else if (holidayDesc) { status = "HOLIDAY"; badge = "bg-amber-100 text-amber-950 border border-amber-300"; coordinatorRemark = "Holiday"; coordinatorComment = holidayDesc; }
                        else if (isSunday) { status = "SUNDAY"; badge = "bg-cyan-100 text-cyan-950 border border-cyan-300"; }
                    }

                    if (status === "PRESENT (EMP)") countPresentEmp++;
                    else if (status === "PRESENT (COORD)") countPresentCoord++;
                    else if (status === "APPROVED LEAVE") countApprLeave++;
                    else if (status === "APPLIED LEAVE") countApplLeave++;
                    else if (status === "COORD LEAVE MARK") countCoordLeave++;
                    else if (status === "ABSENT") countAbsent++;
                    else if (status === "HOLIDAY") countHoliday++;
                    else if (status === "SUNDAY") countSunday++; 
                    else countIdle++;

                    processedRows.push({
                        date: rawSelectedDate.split('-').reverse().join('/'),
                        name: cleanEmp.employeename || "--", id: cleanEmp.employeeid || "--",
                        status, badge, ...pParams, todaysPlan, loginTime, todaysWorkProgress, logoutTime,
                        coordinatorName, coordinatorRemark, coordinatorComment, holidayDesc
                    });
                });

            } else if (mode === "EMPLOYEE") {
                const selectedTargetEmpId = document.getElementById("anly-employee-select") ? document.getElementById("anly-employee-select").value : "";
                if (!selectedTargetEmpId) { 
                    dataContainer.innerHTML = `<div class="p-10 text-center text-slate-500 font-bold border border-slate-200 rounded-xl bg-slate-50">Please identify an active employee node using selection box inputs above.</div>`; 
                    return; 
                }

                const targetEmp = masterRegistryEmployees.find(e => {
                    const clean = normalizeBackendObject(e);
                    return String(clean.employeeid || "") === selectedTargetEmpId;
                });
                
                const cleanTargetEmp = normalizeBackendObject(targetEmp);
                const targetMonthStr = monthPicker ? monthPicker.value : "";
                if (!targetMonthStr) { 
                    dataContainer.innerHTML = `<div class="p-10 text-center text-slate-500 font-bold border border-slate-200 rounded-xl bg-slate-50">Please pick a calculation month frame.</div>`; 
                    return; 
                }
                
                const tokens = targetMonthStr.split('-');
                const currentYear = parseInt(tokens[0], 10);
                const currentMonthIdx = parseInt(tokens[1], 10) - 1;
                const monthInfo = getMonthMetricsInfo(currentYear, currentMonthIdx);

                daysToConsider = monthInfo.totalDays;
                const now = new Date();
                if (currentYear === now.getFullYear() && currentMonthIdx === now.getMonth()) {
                    daysToConsider = now.getDate(); 
                } else if (new Date(currentYear, currentMonthIdx, 1) > now) {
                    daysToConsider = 0; 
                }

                for (let dayIndex = 1; dayIndex <= daysToConsider; dayIndex++) {
                    const loopDate = new Date(currentYear, currentMonthIdx, dayIndex);
                    const loopTime = loopDate.getTime();
                    const isSunday = loopDate.getDay() === 0;
                    const holidayDesc = getHolidayNameForTimestamp(loopTime);
                    const cleanSearchEmpId = String(selectedTargetEmpId).trim().toUpperCase();

                    const attLog = masterAttendanceLogCache.find(log => {
                        const cleanLog = normalizeBackendObject(log);
                        return String(cleanLog.employeeid || "").trim().toUpperCase() === cleanSearchEmpId && parseToTimestamp(cleanLog.date) === loopTime;
                    });

                    let isLeaveApproved = false, isLeaveApplied = false;
                    const activeLeave = masterLeaveApplicationsCache.find(lv => {
                        const cleanLv = normalizeBackendObject(lv);
                        if (String(cleanLv.employeeid || "").trim().toUpperCase() !== cleanSearchEmpId) return false;
                        const stat = String(cleanLv.status || cleanLv.admindecision || "").toUpperCase();
                        if (stat === "REJECTED" || stat === "DECLINED" || stat === "CANCELLED") return false;
                        return evaluateDateInsideLeaveBlock(loopTime, lv);
                    });

                    if (activeLeave) {
                        const cleanLv = normalizeBackendObject(activeLeave);
                        const stat = String(cleanLv.status || cleanLv.admindecision || "").toUpperCase();
                        if (stat === "APPROVED" || stat === "SHORT") isLeaveApproved = true;
                        else isLeaveApplied = true;
                    }

                    const cleanLog = normalizeBackendObject(attLog);
                    const cleanLeave = normalizeBackendObject(activeLeave);

                    let status = "NOT MARKED", badge = "bg-rose-50 text-rose-800 border border-rose-200";
                    let todaysPlan = "--", loginTime = "--", todaysWorkProgress = "--", logoutTime = "--";
                    let coordinatorName = cleanLog.coordinatorname || cleanTargetEmp.coordinatorname || "--";
                    let coordinatorRemark = "--", coordinatorComment = "--";

                    const pParams = parseProjectParameters(cleanTargetEmp, cleanLog, cleanLeave);

                    if (attLog) {
                        let rem = cleanLog.coordinatorremark || "";
                        let uRem = String(rem).toUpperCase();
                        let planStr = String(cleanLog.todaysplan || "").toLowerCase();
                        const isBypassedByCoord = planStr.includes("bypassed by coordinator") || planStr.includes("attendance marked by coordinator");

                        if (uRem === "ON LEAVE" || uRem === "LEAVE APPLIED" || uRem === "HALF-DAY") {
                            status = "COORD LEAVE MARK"; badge = "bg-fuchsia-100 text-fuchsia-950 border border-fuchsia-300";
                        } else if (uRem === "ABSENT" || uRem === "REJECTED" || uRem === "C-AB") {
                            status = "ABSENT"; badge = "bg-rose-100 text-rose-950 border border-rose-300";
                        } else if (isBypassedByCoord) {
                            status = "PRESENT (COORD)"; badge = "bg-teal-100 text-teal-950 border border-teal-300";
                        } else {
                            if (uRem && uRem !== "PENDING" && uRem !== "VERIFIED" && uRem !== "APPROVED") {
                                status = "PRESENT (COORD)"; badge = "bg-teal-100 text-teal-950 border border-teal-300";
                            } else {
                                status = "PRESENT (EMP)"; badge = "bg-emerald-100 text-emerald-950 border border-emerald-400";
                            }
                        }
                        
                        if (isLeaveApproved) { status = "APPROVED LEAVE"; badge = "bg-emerald-100 text-emerald-950 border border-emerald-500"; }
                        else if (isLeaveApplied && status !== "COORD LEAVE MARK") { status = "APPLIED LEAVE"; badge = "bg-orange-100 text-orange-950 border border-orange-400"; }

                        todaysPlan = cleanLog.todaysplan || "--";
                        loginTime = cleanLog.logintime || "--";
                        todaysWorkProgress = cleanLog.todaysworkprogress || "--";
                        logoutTime = cleanLog.logouttime || "--";
                        coordinatorRemark = rem || "Pending Audit";
                        coordinatorComment = cleanLog.coordinatorcomment || "--";
                    } else {
                        if (isLeaveApproved) { status = "APPROVED LEAVE"; badge = "bg-emerald-100 text-emerald-950 border border-emerald-500"; }
                        else if (isLeaveApplied) { status = "APPLIED LEAVE"; badge = "bg-orange-100 text-orange-950 border border-orange-400"; }
                        else if (holidayDesc) { status = "HOLIDAY"; badge = "bg-amber-100 text-amber-950 border border-amber-300"; coordinatorRemark = "Holiday"; coordinatorComment = holidayDesc; }
                        else if (isSunday) { status = "SUNDAY"; badge = "bg-cyan-100 text-cyan-950 border border-cyan-300"; }
                    }

                    if (status === "PRESENT (EMP)") countPresentEmp++;
                    else if (status === "PRESENT (COORD)") countPresentCoord++;
                    else if (status === "APPROVED LEAVE") countApprLeave++;
                    else if (status === "APPLIED LEAVE") countApplLeave++;
                    else if (status === "COORD LEAVE MARK") countCoordLeave++;
                    else if (status === "ABSENT") countAbsent++;
                    else if (status === "HOLIDAY") countHoliday++;
                    else if (status === "SUNDAY") countSunday++;
                    else countIdle++;

                    processedRows.push({
                        date: `${String(dayIndex).padStart(2, '0')}/${String(currentMonthIdx + 1).padStart(2, '0')}/${currentYear}`,
                        name: cleanTargetEmp.employeename || "--", id: cleanTargetEmp.employeeid || "--",
                        status, badge, ...pParams, todaysPlan, loginTime, todaysWorkProgress, logoutTime,
                        coordinatorName, coordinatorRemark, coordinatorComment, holidayDesc
                    });
                }
            }

            // Apply Filter logic
            let filteredRows = processedRows;
            if (statusFilter !== "ALL") {
                filteredRows = processedRows.filter(r => {
                    const s = String(r.status);
                    if (statusFilter === "PRESENT_EMP") return s === "PRESENT (EMP)";
                    if (statusFilter === "PRESENT_COORD") return s === "PRESENT (COORD)";
                    if (statusFilter === "APPROVED_LEAVE") return s === "APPROVED LEAVE";
                    if (statusFilter === "APPLIED_LEAVE") return s === "APPLIED LEAVE";
                    if (statusFilter === "COORD_LEAVE") return s === "COORD LEAVE MARK";
                    if (statusFilter === "ABSENT") return s === "ABSENT";
                    if (statusFilter === "HOLIDAY") return s === "HOLIDAY";
                    if (statusFilter === "NOT_MARKED") return s === "NOT MARKED";
                    if (statusFilter === "SUNDAY") return s === "SUNDAY";
                    return true;
                });
            }

            const getCardStyle = (val) => {
                const isActive = statusFilter === val;
                return isActive ? 'ring-2 ring-indigo-600 scale-[1.02] shadow-md' : 'hover:opacity-90';
            };

            // Render Summary Boxes with Holiday Card Included
            if (summaryBox) {
                summaryBox.innerHTML = `
                    <div class="col-span-2 sm:col-span-4 lg:col-span-9 bg-slate-900 border border-slate-800 p-3 sm:px-5 sm:py-4 rounded-xl shadow-inner flex justify-between items-center transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <i data-lucide="filter" class="w-5 h-5 text-indigo-400"></i>
                            <div>
                                <span class="text-[9px] font-black text-slate-500 uppercase tracking-wider block mb-0.5">Currently Filtering By</span>
                                <strong class="text-sm text-white">${filterDisplayName} <span class="text-indigo-400 text-xs ml-1 font-mono tracking-normal">(${mode === 'EMPLOYEE' ? daysToConsider + ' Days Analyzed' : '1 Day Analyzed'})</span></strong>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-[9px] font-black text-slate-500 uppercase tracking-wider block mb-0.5">Matching Records</span>
                            <strong class="text-xl font-mono font-black text-emerald-400">${filteredRows.length}</strong>
                        </div>
                    </div>
                    
                    <div onclick="window.handleSummaryCardFilterClick('PRESENT_EMP')" class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl shadow-inner cursor-pointer transition-all ${getCardStyle('PRESENT_EMP')}" title="Filter Present (By Employee)">
                        <span class="text-[9px] font-black text-emerald-600 uppercase block tracking-wider mb-1">Present (Emp)</span>
                        <strong class="text-lg font-mono font-black text-emerald-800">${countPresentEmp}</strong>
                    </div>
                    <div onclick="window.handleSummaryCardFilterClick('PRESENT_COORD')" class="bg-teal-50 border border-teal-200 p-3 rounded-xl shadow-inner cursor-pointer transition-all ${getCardStyle('PRESENT_COORD')}" title="Filter Present (By Coordinator)">
                        <span class="text-[9px] font-black text-teal-600 uppercase block tracking-wider mb-1">Present (Coord)</span>
                        <strong class="text-lg font-mono font-black text-teal-800">${countPresentCoord}</strong>
                    </div>
                    <div onclick="window.handleSummaryCardFilterClick('APPROVED_LEAVE')" class="bg-indigo-50 border border-indigo-200 p-3 rounded-xl shadow-inner cursor-pointer transition-all ${getCardStyle('APPROVED_LEAVE')}" title="Filter Approved Leave">
                        <span class="text-[9px] font-black text-indigo-600 uppercase block tracking-wider mb-1">Appr Leave</span>
                        <strong class="text-lg font-mono font-black text-indigo-800">${countApprLeave}</strong>
                    </div>
                    <div onclick="window.handleSummaryCardFilterClick('APPLIED_LEAVE')" class="bg-orange-50 border border-orange-200 p-3 rounded-xl shadow-inner cursor-pointer transition-all ${getCardStyle('APPLIED_LEAVE')}" title="Filter Applied Leave">
                        <span class="text-[9px] font-black text-orange-600 uppercase block tracking-wider mb-1">Appl Leave</span>
                        <strong class="text-lg font-mono font-black text-orange-800">${countApplLeave}</strong>
                    </div>
                    <div onclick="window.handleSummaryCardFilterClick('COORD_LEAVE')" class="bg-fuchsia-50 border border-fuchsia-200 p-3 rounded-xl shadow-inner cursor-pointer transition-all ${getCardStyle('COORD_LEAVE')}" title="Filter Coordinator Leave">
                        <span class="text-[9px] font-black text-fuchsia-600 uppercase block tracking-wider mb-1">Coord Leave</span>
                        <strong class="text-lg font-mono font-black text-fuchsia-800">${countCoordLeave}</strong>
                    </div>
                    <div onclick="window.handleSummaryCardFilterClick('ABSENT')" class="bg-amber-50 border border-amber-200 p-3 rounded-xl shadow-inner cursor-pointer transition-all ${getCardStyle('ABSENT')}" title="Filter Absent">
                        <span class="text-[9px] font-black text-amber-600 uppercase block tracking-wider mb-1">Absent</span>
                        <strong class="text-lg font-mono font-black text-amber-800">${countAbsent}</strong>
                    </div>
                    <div onclick="window.handleSummaryCardFilterClick('HOLIDAY')" class="bg-amber-100 border border-amber-300 p-3 rounded-xl shadow-inner cursor-pointer transition-all ${getCardStyle('HOLIDAY')}" title="Filter Holidays">
                        <span class="text-[9px] font-black text-amber-800 uppercase block tracking-wider mb-1">Holidays</span>
                        <strong class="text-lg font-mono font-black text-amber-950">${countHoliday}</strong>
                    </div>
                    <div onclick="window.handleSummaryCardFilterClick('SUNDAY')" class="bg-cyan-50 border border-cyan-200 p-3 rounded-xl shadow-inner cursor-pointer transition-all ${getCardStyle('SUNDAY')}" title="Filter Sundays">
                        <span class="text-[9px] font-black text-cyan-600 uppercase block tracking-wider mb-1">Sundays</span>
                        <strong class="text-lg font-mono font-black text-cyan-800">${countSunday}</strong>
                    </div>
                    <div onclick="window.handleSummaryCardFilterClick('NOT_MARKED')" class="bg-rose-50 border border-rose-200 p-3 rounded-xl shadow-inner cursor-pointer transition-all ${getCardStyle('NOT_MARKED')}" title="Filter Unmarked">
                        <span class="text-[9px] font-black text-rose-600 uppercase block tracking-wider mb-1">Unmarked</span>
                        <strong class="text-lg font-mono font-black text-rose-800">${countIdle}</strong>
                    </div>
                `;
            }

            if (filteredRows.length === 0) {
                dataContainer.innerHTML = `<div class="p-10 text-center text-slate-500 font-bold border border-slate-200 rounded-xl bg-slate-50">No records found matching the chosen criteria.</div>`;
            } else {
                let desktopRowsHtml = "";
                let mobileCardsHtml = "";

                filteredRows.forEach((r, idx) => {
                    const rowId = `anly_row_${idx}`;
                    const holidayTagDisplay = r.holidayDesc ? `<div class="text-amber-800 font-black text-[10px] mt-0.5 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200/60">🎉 ${r.holidayDesc}</div>` : '';
                    
                    desktopRowsHtml += `
                        <tr class="hover:bg-slate-50 transition-colors align-top hidden md:table-row">
                            <td class="px-4 py-3 whitespace-nowrap font-mono text-slate-700">
                                ${r.date}
                                ${holidayTagDisplay}
                            </td>
                            <td class="px-4 py-3">
                                <strong class="text-slate-950 block text-xs">${r.name}</strong>
                                <span class="text-slate-500 font-mono text-[11px]">ID: ${r.id}</span>
                            </td>
                            <td class="px-4 py-3 text-center">
                                <span class="px-2 py-0.5 rounded text-[10px] uppercase tracking-wider font-black ${r.badge}">${r.status}</span>
                            </td>
                            <td class="px-4 py-3 space-y-1">
                                <div><span class="text-slate-400 font-medium">Proj:</span> <span class="text-slate-900">${r.currentProject}</span></div>
                                ${r.district ? `<div><span class="text-slate-400 font-medium">Dist:</span> <span class="text-slate-800">${r.district}</span></div>` : ''}
                                <div class="text-[10px] font-mono text-slate-500 bg-slate-100 px-1 rounded border border-slate-200 w-max" title="GPS Accuracy Delta">± ${r.accuracy}</div>
                            </td>
                            <td class="px-4 py-3 text-center align-middle">${r.locationLink}</td>
                            <td class="px-4 py-3 space-y-1 max-w-xs">
                                <div class="text-slate-600 font-medium break-words italic">"${r.todaysPlan}"</div>
                                <div><span class="text-[10px] font-mono uppercase bg-emerald-50 text-emerald-800 border border-emerald-200 px-1.5 py-0.5 rounded font-black">In: ${r.loginTime}</span></div>
                            </td>
                            <td class="px-4 py-3 space-y-1 max-w-xs">
                                <div class="text-slate-600 font-medium break-words italic">"${r.todaysWorkProgress}"</div>
                                <div><span class="text-[10px] font-mono uppercase bg-orange-50 text-orange-800 border border-orange-200 px-1.5 py-0.5 rounded font-black">Out: ${r.logoutTime}</span></div>
                            </td>
                            <td class="px-4 py-3 space-y-1 text-[11px]">
                                <div><span class="text-slate-400 font-medium">Auditor:</span> <span class="text-slate-900 font-black">${r.coordinatorName}</span></div>
                                <div><span class="text-slate-400 font-medium">Remark:</span> <span class="font-bold text-indigo-700 uppercase text-[10px]">${r.coordinatorRemark}</span></div>
                                <div class="text-slate-500 italic max-w-xs truncate" title="${r.coordinatorComment}">Note: "${r.coordinatorComment}"</div>
                            </td>
                        </tr>
                    `;

                    mobileCardsHtml += `
                        <div class="md:hidden bg-white border border-slate-200 rounded-xl shadow-sm mb-3 overflow-hidden">
                            <div class="px-4 py-3 bg-slate-50 flex justify-between items-center cursor-pointer hover:bg-slate-100 transition" onclick="window.toggleAnalysisRowAccordion('${rowId}')">
                                <div class="pr-2 w-[70%]">
                                    <strong class="text-slate-950 block text-xs truncate">${r.name}</strong>
                                    <span class="text-slate-500 font-mono text-[10px] block mt-0.5">${r.date} | ID: ${r.id}</span>
                                    ${holidayTagDisplay}
                                </div>
                                <div class="flex flex-col items-end gap-1.5 w-[30%]">
                                    <span class="px-1.5 py-0.5 rounded text-[8px] uppercase tracking-wider font-black ${r.badge} text-center block w-full truncate">${r.status}</span>
                                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                                </div>
                            </div>
                            <div id="${rowId}" class="hidden p-4 space-y-4 text-xs border-t border-slate-100 bg-white">
                                <div class="space-y-1.5">
                                    <div class="flex justify-between border-b pb-1.5 border-slate-50"><span class="text-slate-400 uppercase text-[9px] font-black tracking-wider">Project</span> <span class="text-slate-900 font-bold truncate max-w-[150px] text-right">${r.currentProject}</span></div>
                                    ${r.district ? `<div class="flex justify-between border-b pb-1.5 border-slate-50"><span class="text-slate-400 uppercase text-[9px] font-black tracking-wider">District</span> <span class="text-slate-800 font-bold truncate max-w-[150px] text-right">${r.district}</span></div>` : ''}
                                    <div class="flex justify-between border-b pb-1.5 border-slate-50"><span class="text-slate-400 uppercase text-[9px] font-black tracking-wider">Loc Acc</span> <span class="text-slate-500 font-mono text-[10px]">± ${r.accuracy}</span></div>
                                    <div class="flex justify-between border-b pb-1.5 border-slate-50 items-center"><span class="text-slate-400 uppercase text-[9px] font-black tracking-wider">Map</span> <span>${r.locationLink}</span></div>
                                </div>
                                
                                <div class="pt-2 border-t border-slate-100">
                                    <div class="flex justify-between mb-1"><span class="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Execution Plan</span><span class="text-[9px] font-mono text-emerald-700 bg-emerald-50 px-1 rounded border border-emerald-100 font-bold">In: ${r.loginTime}</span></div>
                                    <p class="text-slate-700 italic leading-relaxed text-[11px]">"${r.todaysPlan}"</p>
                                </div>
                                
                                <div class="pt-2 border-t border-slate-100">
                                    <div class="flex justify-between mb-1"><span class="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Work Progress</span><span class="text-[9px] font-mono text-orange-700 bg-orange-50 px-1 rounded border border-orange-100 font-bold">Out: ${r.logoutTime}</span></div>
                                    <p class="text-slate-700 italic leading-relaxed text-[11px]">"${r.todaysWorkProgress}"</p>
                                </div>
                                
                                <div class="pt-2 border-t border-slate-100 bg-slate-50/50 p-3 rounded-xl border">
                                    <span class="text-slate-400 block mb-1.5 font-black uppercase text-[9px] tracking-wider">Audit Details</span>
                                    <div class="grid grid-cols-2 gap-2 mb-2">
                                        <div class="text-[10px]"><span class="text-slate-400 block text-[8px] uppercase">By</span> <span class="font-bold text-slate-800">${r.coordinatorName}</span></div>
                                        <div class="text-[10px]"><span class="text-slate-400 block text-[8px] uppercase">Remark</span> <span class="font-bold text-indigo-700 uppercase">${r.coordinatorRemark}</span></div>
                                    </div>
                                    <div class="text-[10px] text-slate-600 italic bg-white p-2 rounded border border-slate-200">"${r.coordinatorComment}"</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                dataContainer.innerHTML = `
                    <div class="hidden md:block overflow-x-auto w-full border border-slate-200 rounded-xl max-h-[550px]">
                        <table class="w-full text-left border-collapse table-auto min-w-[1550px]">
                            <thead>
                                <tr class="bg-slate-950 text-white border-b border-slate-800 text-[10px] font-black uppercase tracking-wider sticky top-0 z-10">
                                    <th class="px-4 py-3.5 w-32">Date</th>
                                    <th class="px-4 py-3.5 w-56">Employee Details</th>
                                    <th class="px-4 py-3.5 w-32 text-center">Duty Status State</th>
                                    <th class="px-4 py-3.5 w-64">Assigned Project Parameters</th>
                                    <th class="px-4 py-3.5 w-40 text-center">Login Location</th>
                                    <th class="px-4 py-3.5 w-60">Day's Execution Plan</th>
                                    <th class="px-4 py-3.5 w-60">Day's Work Progress</th>
                                    <th class="px-4 py-3.5 w-64">Coordinator Audit Details</th>
                                </tr>
                            </thead>
                            <tbody class="text-xs divide-y divide-slate-200 text-slate-900 font-bold">
                                ${desktopRowsHtml}
                            </tbody>
                        </table>
                    </div>
                    <div class="md:hidden flex flex-col pt-2">
                        ${mobileCardsHtml}
                    </div>
                `;
            }
            if (window.lucide) window.lucide.createIcons();
        };

        window.loadMasterAnalysisDataPackages = async function () {
            const dataContainer = document.getElementById("anly-data-container");
            try {
                const [regRes, attRes, lvRes, holRes] = await Promise.all([
                    fetch(`${API_URL}?action=getAllEmployeesMasterRegistry`),
                    fetch(`${API_URL}?action=getMonthlyAttendanceHistory&employeeId=ALL`),
                    fetch(`${API_URL}?action=getAdminLeaveDataBundles`),
                    fetch(`${API_URL}?action=getAllHolidays`)
                ]);

                const regData = await regRes.json();
                const attData = await attRes.json();
                const lvData = await lvRes.json();
                const holData = await holRes.json();

                masterRegistryEmployees = regData.status ? regData.data : [];
                masterAttendanceLogCache = attData.status ? attData.data : [];
                masterLeaveApplicationsCache = lvData.status ? lvData.data : [];
                masterHolidaysCache = holData.status ? holData.data : [];

                masterRegistryEmployees.sort((a, b) => {
                    const cleanA = normalizeBackendObject(a);
                    const cleanB = normalizeBackendObject(b);
                    return String(cleanA.employeename || "").localeCompare(String(cleanB.employeename || ""));
                });
                
                window.filterAnalysisEmployeeDropdownOptions();
                window.executeAttendanceAnalysisPipeline();
            } catch(e) {
                if (dataContainer) dataContainer.innerHTML = `<div class="p-10 text-center text-rose-700 font-black border border-rose-200 rounded-xl bg-rose-50">Data Loading Failure. Please check connection.</div>`;
            }
        };

        window.loadMasterAnalysisDataPackages();
    })();
</script>
